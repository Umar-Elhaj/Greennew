# ============================================================
# GREEN — lines to add AT THE TOP of the .htaccess of the domain on
# o2switch (the document root of the domain chosen in "Setup Python App").
# Keep the "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION" block that
# cPanel writes below them untouched.
# The domain serves everything: pages and static files (linked into the
# document root by deploy/o2switch/publish_frontend.sh, served by Apache)
# and the API under /api/* (Passenger → FastAPI).
# ============================================================

# No directory listings (js/, vendor/…)
Options -Indexes

# Force HTTPS (the Let's Encrypt certificate must be active on the domain)
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

<IfModule mod_headers.c>
  # HSTS: browsers will only use HTTPS for one year (only sent over HTTPS)
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
  # Same headers as the API (backend/main.py), for the files Apache serves itself
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "DENY"
  Header always set Permissions-Policy "camera=(self), geolocation=(self), microphone=()"

  # The API is not for search engines; its own Cache-Control (private
  # images of /api/media) must never be overridden
  <If "%{REQUEST_URI} =~ m#^/api/#">
    Header always set X-Robots-Tag "noindex, nofollow"
  </If>
  # Images and fonts: one week
  <If "%{REQUEST_URI} !~ m#^/api/# && %{REQUEST_URI} =~ m#\.(png|jpe?g|webp|svg|ico|woff2?)$#">
    Header set Cache-Control "public, max-age=604800"
  </If>
  # Pages, scripts, styles: revalidated on every visit (a cheap 304), so a
  # deployment is visible at once and pages never mix old and new scripts
  <If "%{REQUEST_URI} !~ m#^/api/# && %{REQUEST_URI} !~ m#\.(png|jpe?g|webp|svg|ico|woff2?)$#">
    Header set Cache-Control "no-cache"
  </If>
</IfModule>

# Compression of pages, scripts and JSON
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/csv application/javascript text/javascript application/json application/geo+json image/svg+xml
</IfModule>

# Never serve the repository's private files if the app root is ever
# placed under the document root by mistake
<FilesMatch "^\.env|\.(py|db|sqlite3|ini|sql|sh|pth|onnx|tflite)$">
  Require all denied
</FilesMatch>
