# ============================================================
# GREEN — lines to add AT THE TOP of the .htaccess of the API domain on
# o2switch (the document root of the domain chosen in "Setup Python App").
# Keep the "# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION" block that
# cPanel writes below them untouched.
# ============================================================

# Force HTTPS (the AutoSSL certificate must be active on the domain)
RewriteEngine On
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

# HSTS: browsers will only use HTTPS for one year (only send over HTTPS)
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
</IfModule>

# Never serve the repository's private files if the app root is ever
# placed under the document root by mistake
<FilesMatch "^\.env|\.(py|db|sqlite3|ini|pth|onnx|tflite)$">
  Require all denied
</FilesMatch>
