# Alembic — GREEN schema migrations.
# The database URL comes from DATABASE_URL (config.py), never from this file.
#   cd backend
#   alembic upgrade head            # apply pending migrations
#   alembic upgrade head --sql      # print the SQL without touching the DB
#   alembic stamp 0001_baseline     # mark an existing pre-Alembic database
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
