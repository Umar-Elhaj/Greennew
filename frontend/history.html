<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.history">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    /* ---- Two-column layout ---------------------------------- */
    .history-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: var(--sp-6);
      align-items: start;
    }
    @media (max-width: 1100px) { .history-grid { grid-template-columns: 1fr; } }

    /* ---- Filter bar ---------------------------------------- */
    .filter-bar {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-6);
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-4);
      align-items: flex-end;
      margin-bottom: var(--sp-6);
    }
    .filter-group { display: flex; flex-direction: column; gap: var(--sp-1); }
    .filter-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .filter-select {
      height: 38px;
      padding: 0 var(--sp-3);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: border-color var(--dur-base) var(--ease-out);
      outline: none;
    }
    .filter-select:hover { border-color: var(--input-border-hover); }
    .filter-select:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring); }

    /* ---- History card -------------------------------------- */
    .hist-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .hist-card-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
    }
    .hist-card-hdr h3 {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0;
    }
    .count-badge {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 2px 10px;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
    }

    /* ---- Table --------------------------------------------- */
    .hist-tbl { width: 100%; border-collapse: collapse; }
    .hist-tbl th {
      text-align: left;
      padding: 10px var(--sp-5);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    .hist-tbl td {
      padding: 11px var(--sp-5);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    .hist-tbl tr:last-child td { border-bottom: none; }
    .hist-tbl tbody tr { cursor: pointer; transition: background-color var(--dur-base) var(--ease-out); }
    .hist-tbl tbody tr:hover td { background: var(--bg-subtle); }
    .hist-tbl tbody tr.selected td { background: rgba(46,204,113,.06); }

    .td-disease { font-weight: var(--weight-semibold); color: var(--text-primary); }
    .td-healthy  { font-weight: var(--weight-semibold); color: var(--brand-primary); }
    .td-pest     { font-weight: var(--weight-semibold); color: #d97706; }

    .sev-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .sev-none   { background: rgba(46,204,113,.12); color: var(--brand-primary); }
    .sev-low    { background: rgba(59,130,246,.12); color: var(--color-info); }
    .sev-medium { background: rgba(245,158,11,.12); color: #d97706; }
    .sev-high   { background: rgba(239,68,68,.12);  color: #ef4444; }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: var(--radius-sm);
      transition: color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
      display: flex;
      align-items: center;
    }
    .del-btn:hover { color: var(--color-error); background: rgba(239,68,68,.08); }

    /* ---- Empty state --------------------------------------- */
    .empty-state {
      padding: var(--sp-16) var(--sp-6);
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state svg { opacity: .25; margin-bottom: var(--sp-4); display: block; margin-inline: auto; }
    .empty-state p { font-size: var(--text-sm); margin: 0; }

    /* ---- Pagination ---------------------------------------- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-6);
      border-top: 1px solid var(--border-subtle);
    }
    .pg-btn {
      height: 34px;
      padding: 0 var(--sp-4);
      background: var(--bg-subtle);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--text-secondary);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: border-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
    }
    .pg-btn:hover:not(:disabled) { border-color: var(--brand-primary); color: var(--brand-primary); }
    .pg-btn:disabled { opacity: .35; cursor: not-allowed; }
    .pg-info { font-size: var(--text-xs); color: var(--text-muted); padding: 0 var(--sp-2); }

    /* ---- Fiche panel (sticky right) ------------------------ */
    .fiche-panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: calc(var(--header-height) + var(--sp-6));
    }
    .fiche-panel-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
    }
    .fiche-panel-hdr h3 {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0;
    }

    .fiche-body { padding: var(--sp-5) var(--sp-6); }

    .fiche-verdict {
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      margin-bottom: var(--sp-5);
      padding-bottom: var(--sp-5);
      border-bottom: 1px solid var(--border-subtle);
    }
    .verdict-ico {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .verdict-ico.healthy  { background: rgba(46,204,113,.12); }
    .verdict-ico.diseased { background: rgba(239,68,68,.1); }
    .verdict-main h4 { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--text-primary); margin: 0 0 2px; }
    .verdict-sub { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .conf-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); }
    .conf-track { flex: 1; height: 5px; background: var(--bg-muted); border-radius: var(--radius-full); overflow: hidden; }
    .conf-fill { height: 100%; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--brand-primary), var(--brand-mid)); transition: width var(--dur-slower) var(--ease-out); }
    .conf-pct { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-secondary); min-width: 32px; text-align: right; }

    .pest-block {
      background: rgba(245,158,11,.07);
      border: 1px solid rgba(245,158,11,.2);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-4);
    }
    .pest-block-name { font-weight: var(--weight-semibold); color: #d97706; font-size: var(--text-sm); }
    .pest-block-sub  { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }

    .fiche-section { margin-bottom: var(--sp-4); }
    .fiche-section-title {
      font-size: 11px;
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 0 0 var(--sp-2);
    }
    .fiche-section ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
    .fiche-section ul li {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      display: flex; align-items: flex-start; gap: var(--sp-2);
      line-height: 1.45;
    }
    .fiche-section ul li::before { content: '•'; color: var(--brand-primary); flex-shrink: 0; margin-top: 1px; }

    .thumb-img { width: 100%; border-radius: var(--radius-md); max-height: 160px; object-fit: cover; margin-bottom: var(--sp-4); }
    .fiche-meta { font-size: var(--text-xs); color: var(--text-muted); display: flex; gap: var(--sp-4); flex-wrap: wrap; padding-top: var(--sp-3); border-top: 1px solid var(--border-subtle); margin-top: var(--sp-2); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Banner -->
      <div style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-8);position:relative;overflow:hidden;" class="page-banner">
        <div style="position:absolute;width:260px;height:260px;background:rgba(255,255,255,.05);border-radius:50%;right:-40px;top:-80px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:var(--weight-semibold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="history.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:var(--weight-extrabold);color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="history.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.7);" data-i18n="history.banner_text"></div>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <label class="filter-label" for="filterSource" data-i18n="history.source"></label>
          <select class="filter-select" id="filterSource">
            <option value="" data-i18n="history.all_sources"></option>
            <option value="camera" data-i18n="fiche.sources.camera"></option>
            <option value="upload" data-i18n="fiche.sources.upload"></option>
            <option value="rover" data-i18n="fiche.sources.rover"></option>
            <option value="drone" data-i18n="fiche.sources.drone"></option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterType" data-i18n="history.result"></label>
          <select class="filter-select" id="filterType">
            <option value="" data-i18n="history.all_results"></option>
            <option value="disease" data-i18n="history.diseased"></option>
            <option value="healthy" data-i18n="history.healthy"></option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterPlant" data-i18n="history.plant"></label>
          <select class="filter-select" id="filterPlant">
            <option value="" data-i18n="history.all_plants"></option>
            <option value="Cassava" data-i18n="model.plants.Cassava"></option>
            <option value="Corn" data-i18n="model.plants.Corn"></option>
            <option value="Tomato" data-i18n="model.plants.Tomato"></option>
          </select>
        </div>
        <div style="margin-left:auto;display:flex;align-items:flex-end;">
          <button type="button" class="btn" style="height:38px;font-size:var(--text-sm);" onclick="loadHistory()" data-i18n="common.actions.refresh"></button>
        </div>
      </div>

      <!-- Main grid -->
      <div class="history-grid">

        <!-- Left: table -->
        <div>
          <div class="hist-card">
            <div class="hist-card-hdr">
              <h3 data-i18n="history.analyses"></h3>
              <span class="count-badge" id="totalBadge">—</span>
            </div>

            <div id="histTableWrap" class="table-scroll">
              <div id="histEmpty" class="empty-state" style="display:none;">
                <p id="histEmptyText"></p>
                <a href="/camera" class="btn btn-primary" id="histEmptyCta" style="display:none;" data-i18n="history.go_camera"></a>
              </div>
              <table class="hist-tbl" id="histTbl" style="display:none;">
                <thead>
                  <tr>
                    <th data-i18n="history.col_result"></th>
                    <th data-i18n="history.col_plant"></th>
                    <th data-i18n="history.col_confidence"></th>
                    <th data-i18n="history.col_alert" data-i18n-title="model.alert.help"></th>
                    <th data-i18n="history.col_source"></th>
                    <th data-i18n="history.col_date"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="histBody"></tbody>
              </table>
            </div>

            <div class="pagination" id="pagination" style="display:none;">
              <button type="button" class="pg-btn" id="prevBtn" onclick="changePage(-1)" data-i18n="history.prev"></button>
              <span class="pg-info" id="pgInfo"></span>
              <button type="button" class="pg-btn" id="nextBtn" onclick="changePage(1)" data-i18n="history.next"></button>
            </div>
          </div>
        </div>

        <!-- Right: field sheet -->
        <div class="fiche-panel" id="fichePanel">
          <div class="fiche-panel-hdr">
            <h3 data-i18n="fiche.title"></h3>
          </div>
          <div id="ficheContent" aria-live="polite">
            <div class="empty-state">
              <p data-i18n="history.select"></p>
            </div>
          </div>
        </div>

      </div><!-- /history-grid -->

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/fiche.js"></script>
<script>
Layout.init({ page: 'history', titleKey: 'nav.history', subtitleKey: 'history.subtitle' });

const PAGE_SIZE = 15;
let currentPage = 0;
let totalItems  = 0;
let items       = null;   // null = error
let selectedId  = null;
let selected    = null;   // last loaded analysis (for re-render)

document.addEventListener('DOMContentLoaded', () => {
  ['filterSource', 'filterType', 'filterPlant'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => { currentPage = 0; loadHistory(); }));
  const wanted = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
  if (wanted) selectAnalysis(wanted);
  loadHistory();
});

window.addEventListener('languageChanged', () => {
  renderTable();
  if (selectedId) selectAnalysis(selectedId);   // sheet texts come from the server
});

function changePage(dir) { currentPage = Math.max(0, currentPage + dir); loadHistory(); }

function hasFilters() {
  return ['filterSource', 'filterType', 'filterPlant'].some(id => document.getElementById(id).value);
}

async function loadHistory() {
  const { data, error } = await API.analysis.history(PAGE_SIZE, currentPage * PAGE_SIZE, {
    source:      document.getElementById('filterSource').value,
    result_type: document.getElementById('filterType').value,
    plant_type:  document.getElementById('filterPlant').value,
  });
  if (error || !data) { items = null; renderTable(); return; }
  totalItems = data.total || 0;
  items = data.items || [];
  // Deleting the last row of the last page: go back one page
  if (!items.length && totalItems > 0 && currentPage > 0) {
    currentPage = Math.max(0, Math.ceil(totalItems / PAGE_SIZE) - 1);
    return loadHistory();
  }
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('histBody');
  const tbl   = document.getElementById('histTbl');
  const empty = document.getElementById('histEmpty');
  const pg    = document.getElementById('pagination');

  if (items === null) {
    tbl.style.display = 'none'; pg.style.display = 'none'; empty.style.display = '';
    document.getElementById('histEmptyText').textContent = I18n.t('history.error');
    document.getElementById('histEmptyCta').style.display = 'none';
    document.getElementById('totalBadge').textContent = '—';
    return;
  }
  document.getElementById('totalBadge').textContent = I18n.t('history.total', { count: totalItems });
  if (!items.length) {
    tbl.style.display = 'none'; pg.style.display = 'none'; empty.style.display = '';
    document.getElementById('histEmptyText').textContent = I18n.t(hasFilters() ? 'history.empty' : 'history.empty_none');
    document.getElementById('histEmptyCta').style.display = hasFilters() ? 'none' : '';
    return;
  }
  tbl.style.display = ''; empty.style.display = 'none';

  tbody.innerHTML = items.map(a => {
    const healthy = isHealthy(a);
    const level = alertLevel(a);
    return `<tr class="${a.id === selectedId ? 'selected' : ''}" data-id="${a.id}" tabindex="0">
      <td class="${healthy ? 'td-healthy' : 'td-disease'}">${escapeHtml(analysisLabel(a))}</td>
      <td style="color:var(--text-secondary);">${escapeHtml(plantLabel(a.plant_type))}</td>
      <td style="color:var(--text-secondary);">${a.confidence != null ? escapeHtml(I18n.percent(a.confidence)) : '—'}</td>
      <td><span class="sev-pill sev-${level}">${escapeHtml(alertLabel(level, true))}</span></td>
      <td style="font-size:var(--text-xs);color:var(--text-muted);">${escapeHtml(I18n.t(`fiche.sources.${a.source || 'upload'}`))}</td>
      <td style="font-size:var(--text-xs);white-space:nowrap;color:var(--text-muted);">${escapeHtml(I18n.date(a.created_at, { day: 'numeric', month: 'short', year: 'numeric' }))}</td>
      <td>
        <button type="button" class="del-btn" data-del="${a.id}" title="${escapeHtml(I18n.t('history.delete'))}" aria-label="${escapeHtml(I18n.t('history.delete'))}">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr => {
    const open = () => selectAnalysis(parseInt(tr.dataset.id, 10));
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  });
  tbody.querySelectorAll('[data-del]').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); deleteAnalysis(parseInt(btn.dataset.del, 10)); }));

  const totalPages = Math.ceil(totalItems / PAGE_SIZE);
  if (totalPages > 1) {
    pg.style.display = 'flex';
    document.getElementById('pgInfo').textContent = I18n.t('history.page', { page: currentPage + 1, pages: totalPages });
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
  } else {
    pg.style.display = 'none';
  }
}

async function selectAnalysis(id) {
  selectedId = id;
  document.querySelectorAll('#histBody tr').forEach(tr => tr.classList.toggle('selected', parseInt(tr.dataset.id, 10) === id));
  const box = document.getElementById('ficheContent');
  const { data, error } = await API.analysis.get(id);
  if (selectedId !== id) return;
  if (error || !data) {
    box.innerHTML = `<div class="empty-state"><p>${escapeHtml(error || I18n.t('history.fiche_error'))}</p></div>`;
    return;
  }
  selected = data;
  box.innerHTML = Fiche.html(data);
  if (window.innerWidth <= 900) document.getElementById('fichePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function deleteAnalysis(id) {
  if (!App.confirm(I18n.t('history.delete_confirm'))) return;
  const { error } = await API.analysis.delete(id);
  if (error) { App.toast(error, 'error'); return; }
  if (selectedId === id) {
    document.getElementById('ficheContent').innerHTML =
      `<div class="empty-state"><p>${escapeHtml(I18n.t('history.select'))}</p></div>`;
    selectedId = null;
  }
  App.toast(I18n.t('history.deleted'), 'success');
  loadHistory();
}
</script>
</body>
</html>
