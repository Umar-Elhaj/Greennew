<!DOCTYPE html>
<html lang="fr">
<!--
  GREEN App — GREEN Map
  Parcels (drawn and edited offline, synced through js/parcel-store.js),
  grid + serpentine path computed by the server (missions), and the
  per-cell heatmap of analysis results.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.map">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <!-- Leaflet 1.9.4 (map) and Turf 7.1.0 (offline geometry checks), exact versions -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <style>
    .app-content.map-content { padding: 0; display: flex; overflow: hidden; }
    .map-page { display: flex; flex: 1; min-height: calc(100vh - 64px); min-width: 0; }
    .map-side { width: 360px; flex: none; background: var(--surface-1); border-right: 1px solid var(--border-subtle);
                overflow-y: auto; display: flex; flex-direction: column; }
    .map-wrap { position: relative; flex: 1; min-width: 0; }
    #map { position: absolute; inset: 0; background: var(--bg-muted); }
    .side-view { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); }
    .side-view[hidden] { display: none; }
    .side-hdr { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .side-hdr h2 { font-size: var(--text-lg); margin: 0; color: var(--text-primary); }
    .link-btn { background: none; border: none; padding: 0; color: var(--brand-primary); font: 600 var(--text-sm) var(--font-sans); cursor: pointer; text-align: left; }
    .note { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.5; }
    .banner-warn { font-size: var(--text-xs); line-height: 1.5; padding: var(--sp-3); border-radius: var(--radius-md);
                   background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); color: #92400E; }
    [data-theme="dark"] .banner-warn { color: #FCD34D; }
    .banner-err { font-size: var(--text-xs); line-height: 1.5; padding: var(--sp-3); border-radius: var(--radius-md);
                  background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); color: var(--color-error); }
    .parcel-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
    .parcel-item { width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--border-subtle);
                   border-radius: var(--radius-md); padding: var(--sp-3); cursor: pointer; font: inherit; color: inherit; }
    .parcel-item:hover, .parcel-item:focus-visible { border-color: var(--brand-primary); }
    .parcel-item .pi-top { display: flex; justify-content: space-between; gap: var(--sp-2); align-items: baseline; }
    .parcel-item .pi-name { font-weight: 600; color: var(--text-primary); }
    .parcel-item .pi-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
    .sync-badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
    .sync-synced   { background: rgba(46,204,113,.12); color: var(--brand-primary); }
    .sync-pending  { background: rgba(245,158,11,.14); color: #b45309; }
    .sync-conflict, .sync-error { background: rgba(239,68,68,.12); color: var(--color-error); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2) var(--sp-4); font-size: var(--text-sm); }
    .stats dt { font-size: var(--text-xs); color: var(--text-muted); }
    .stats dd { margin: 0; color: var(--text-primary); font-weight: 600; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label, .field .lbl { font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); }
    .row { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .row > * { flex: 1 1 auto; }
    .mission-item { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--sp-3); font-size: var(--text-sm); }
    .mission-item .mi-top { display: flex; justify-content: space-between; gap: var(--sp-2); }
    .progress { height: 6px; background: var(--bg-muted); border-radius: 999px; overflow: hidden; margin: 6px 0; }
    .progress > div { height: 100%; background: var(--brand-primary); }
    .draw-bar { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: 16px; width: min(560px, calc(100% - 24px));
                background: var(--surface-1); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
                box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
    .draw-bar[hidden] { display: none; }
    .draw-bar .db-msg { font-size: var(--text-xs); color: var(--text-secondary); }
    .draw-bar .db-status { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); }
    .draw-bar .row .btn { font-size: var(--text-sm); }
    .legend { position: absolute; z-index: 900; right: 10px; top: 64px; background: var(--surface-1); border: 1px solid var(--border-subtle);
              border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3); font-size: var(--text-xs); color: var(--text-secondary); max-width: 240px; }
    .legend[hidden] { display: none; }
    .legend .lg-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
    .legend .sw.hatch { background: repeating-linear-gradient(45deg, #9ca3af 0 2px, transparent 2px 5px); }
    .vertex-icon { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #16a34a; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .vertex-icon.first { border-color: #1d4ed8; }
    .start-icon { width: 18px; height: 18px; border-radius: 50%; background: #1d4ed8; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .cell-detail .fiche-body { padding: var(--sp-3) 0; border-bottom: 1px solid var(--border-subtle); }
    .leaflet-container { font-family: var(--font-sans); }
    .picking #map { cursor: crosshair; }
    @media (max-width: 900px) {
      .map-page { flex-direction: column-reverse; min-height: 0; }
      .map-wrap { height: 58vh; flex: none; }
      .map-side { width: 100%; border-right: none; border-top: 1px solid var(--border-subtle); overflow: visible; }
      .app-content.map-content { overflow: visible; }
    }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content map-content" id="appContent">
      <div class="map-page">

        <!-- ===== Side panel ========================================== -->
        <aside class="map-side" aria-live="polite">

          <!-- Parcel list -->
          <section class="side-view" id="viewList">
            <div class="side-hdr">
              <h2 data-i18n="map.panel.title"></h2>
              <button type="button" class="btn btn-primary" id="newParcelBtn" data-i18n="map.panel.new"></button>
            </div>
            <div class="banner-warn" id="offlineBanner" hidden data-i18n="map.panel.offline"></div>
            <div class="note" id="pendingOps"></div>
            <ul class="parcel-list" id="parcelList"></ul>
            <p class="note" id="parcelEmpty" hidden data-i18n="map.panel.empty"></p>
          </section>

          <!-- One parcel -->
          <section class="side-view" id="viewParcel" hidden>
            <button type="button" class="link-btn" data-back="list">← <span data-i18n="map.panel.title"></span></button>
            <div class="side-hdr">
              <h2 id="pName"></h2>
              <span class="sync-badge" id="pSync"></span>
            </div>
            <div id="pConflict" class="banner-err" hidden>
              <p data-i18n="map.form.conflict" style="margin:0 0 var(--sp-2);"></p>
              <div class="row">
                <button type="button" class="btn" id="applyDraftBtn" data-i18n="map.form.apply_draft"></button>
                <button type="button" class="btn" id="discardDraftBtn" data-i18n="map.form.discard_draft"></button>
              </div>
            </div>
            <div id="pError" class="banner-err" hidden></div>
            <dl class="stats">
              <div><dt data-i18n="map.parcel.area"></dt><dd id="pArea">—</dd></div>
              <div><dt data-i18n="map.parcel.perimeter"></dt><dd id="pPerimeter">—</dd></div>
              <div><dt data-i18n="map.parcel.crop"></dt><dd id="pCrop">—</dd></div>
              <div><dt data-i18n="map.parcel.region"></dt><dd id="pRegion">—</dd></div>
              <div><dt data-i18n="map.parcel.sowing"></dt><dd id="pSowing">—</dd></div>
              <div><dt data-i18n="nav.history"></dt><dd id="pAnalyses">—</dd></div>
            </dl>
            <p class="note" id="pNotes"></p>
            <div class="row">
              <button type="button" class="btn" id="zoomBtn" data-i18n="map.parcel.zoom"></button>
              <button type="button" class="btn" id="editBtn" data-i18n="map.parcel.edit"></button>
            </div>
            <button type="button" class="btn btn-primary" id="gridBtn" data-i18n="map.parcel.grid"></button>
            <p class="note" id="gridUnsynced" hidden data-i18n="map.parcel.unsynced"></p>
            <h3 style="font-size:var(--text-sm);margin:var(--sp-2) 0 0;" data-i18n="map.mission.list_title"></h3>
            <div id="missionList" style="display:flex;flex-direction:column;gap:var(--sp-2);"></div>
          </section>

          <!-- Create / edit form -->
          <section class="side-view" id="viewForm" hidden>
            <div class="side-hdr"><h2 id="formTitle"></h2></div>
            <div class="note" id="formMeasures"></div>
            <div class="banner-warn" id="formOverlap" hidden></div>
            <div class="field">
              <label for="fName" data-i18n="map.form.name"></label>
              <input type="text" id="fName" class="form-input" maxlength="255" data-i18n-placeholder="map.form.name_placeholder" />
            </div>
            <div class="field">
              <label for="fCrop" data-i18n="map.form.crop"></label>
              <select id="fCrop" class="form-input">
                <option value="" data-i18n="map.form.crop_none"></option>
                <option value="Maize" data-i18n="map.form.crops.Maize"></option>
                <option value="Cassava" data-i18n="map.form.crops.Cassava"></option>
                <option value="Tomato" data-i18n="map.form.crops.Tomato"></option>
                <option value="Groundnut" data-i18n="map.form.crops.Groundnut"></option>
                <option value="Plantain" data-i18n="map.form.crops.Plantain"></option>
                <option value="Other" data-i18n="map.form.crops.Other"></option>
              </select>
            </div>
            <div class="field">
              <label for="fSowing" data-i18n="map.form.sowing_date"></label>
              <input type="date" id="fSowing" class="form-input" />
            </div>
            <div class="field">
              <label for="fNotes" data-i18n="map.form.notes"></label>
              <textarea id="fNotes" class="form-input" rows="3" maxlength="2000"></textarea>
            </div>
            <div class="field">
              <span class="lbl" data-i18n="map.form.region"></span>
              <span class="note" id="fRegion"></span>
            </div>
            <div class="banner-err" id="formError" hidden></div>
            <div class="row">
              <button type="button" class="btn btn-primary" id="saveParcelBtn" data-i18n="map.form.save"></button>
              <button type="button" class="btn" id="cancelFormBtn" data-i18n="map.draw.cancel"></button>
            </div>
            <div class="row" id="formEditActions">
              <button type="button" class="btn" id="redrawBtn" data-i18n="map.form.redraw"></button>
              <button type="button" class="btn" id="deleteParcelBtn" style="color:var(--color-error);" data-i18n="map.form.delete"></button>
            </div>
          </section>

          <!-- Grid -->
          <section class="side-view" id="viewGrid" hidden>
            <button type="button" class="link-btn" data-back="parcel">← <span data-i18n="map.mission.back"></span></button>
            <div class="side-hdr"><h2 data-i18n="map.grid.title"></h2></div>
            <div class="banner-warn" id="gridOffline" hidden data-i18n="map.grid.offline"></div>
            <div class="field">
              <label for="cellSize"><span data-i18n="map.grid.cell_size"></span> : <strong id="cellSizeVal"></strong></label>
              <input type="range" id="cellSize" min="1" max="50" step="1" value="5" />
              <span class="note" data-i18n="map.grid.cell_help"></span>
            </div>
            <div class="field">
              <label for="speed"><span data-i18n="map.grid.speed"></span> : <strong id="speedVal"></strong></label>
              <input type="range" id="speed" min="0.1" max="2" step="0.1" value="0.5" />
            </div>
            <div class="field">
              <span class="lbl" data-i18n="map.grid.start"></span>
              <div class="row">
                <button type="button" class="btn" id="pickStartBtn" data-i18n="map.grid.start_choose"></button>
                <span class="note" id="startInfo"></span>
              </div>
              <span class="note" data-i18n="map.grid.start_help"></span>
            </div>
            <button type="button" class="btn" id="previewBtn" data-i18n="map.grid.preview"></button>
            <div class="note" id="gridSummary"></div>
            <div class="banner-err" id="gridError" hidden></div>
            <button type="button" class="btn btn-primary" id="createMissionBtn" disabled data-i18n="map.grid.create"></button>
          </section>

          <!-- Mission + heatmap -->
          <section class="side-view" id="viewMission" hidden>
            <button type="button" class="link-btn" data-back="parcel">← <span data-i18n="map.mission.back"></span></button>
            <div class="side-hdr"><h2 id="mName"></h2></div>
            <div class="note" id="mSummary"></div>
            <div class="progress"><div id="mProgressBar" style="width:0"></div></div>
            <div class="note" id="mProgress"></div>
            <div class="field">
              <label for="mStatus" data-i18n="map.mission.status_label"></label>
              <select id="mStatus" class="form-input">
                <option value="draft" data-i18n="map.mission.status.draft"></option>
                <option value="ready" data-i18n="map.mission.status.ready"></option>
                <option value="running" data-i18n="map.mission.status.running"></option>
                <option value="done" data-i18n="map.mission.status.done"></option>
              </select>
            </div>
            <div class="row">
              <button type="button" class="btn" id="exportJsonBtn" data-i18n="map.mission.export_json"></button>
              <button type="button" class="btn" id="exportGeoBtn" data-i18n="map.mission.export_geojson"></button>
            </div>
            <a class="btn btn-primary" id="analyseMissionLink" href="/camera" data-i18n="map.mission.analyse"></a>

            <h3 style="font-size:var(--text-sm);margin:var(--sp-2) 0 0;" data-i18n="map.heat.title"></h3>
            <div class="field">
              <label for="heatIndicator" data-i18n="map.heat.indicator"></label>
              <select id="heatIndicator" class="form-input">
                <option value="rate" data-i18n="map.heat.rate"></option>
                <option value="alert" data-i18n="map.heat.alert"></option>
                <option value="dominant" data-i18n="map.heat.dominant"></option>
              </select>
            </div>
            <div class="field">
              <label for="heatDisease" data-i18n="map.heat.disease"></label>
              <select id="heatDisease" class="form-input"></select>
            </div>
            <div class="row">
              <div class="field"><label for="heatFrom" data-i18n="map.heat.from"></label><input type="date" id="heatFrom" class="form-input" /></div>
              <div class="field"><label for="heatTo" data-i18n="map.heat.to"></label><input type="date" id="heatTo" class="form-input" /></div>
            </div>
            <button type="button" class="btn" id="heatApplyBtn" data-i18n="map.heat.apply"></button>
            <p class="note" data-i18n="map.heat.note"></p>
            <div id="cellDetail" class="cell-detail"></div>
            <button type="button" class="link-btn" id="deleteMissionBtn" style="color:var(--color-error);" data-i18n="map.mission.delete"></button>
          </section>
        </aside>

        <!-- ===== Map ================================================ -->
        <div class="map-wrap">
          <div id="map" role="application" aria-label="GREEN Map"></div>

          <div class="draw-bar" id="drawBar" hidden>
            <div class="db-status"><span data-i18n="map.draw.title"></span> · <span id="drawCount"></span></div>
            <div class="db-msg" data-i18n="map.draw.help"></div>
            <div class="db-msg" id="drawMsg" role="status"></div>
            <div class="row">
              <button type="button" class="btn" id="undoPointBtn" data-i18n="map.draw.undo"></button>
              <button type="button" class="btn" id="myPositionBtn" data-i18n="map.draw.my_position"></button>
              <button type="button" class="btn btn-primary" id="finishDrawBtn" data-i18n="map.draw.finish"></button>
              <button type="button" class="btn" id="cancelDrawBtn" data-i18n="map.draw.cancel"></button>
            </div>
          </div>

          <div class="legend" id="legend" hidden></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/fiche.js"></script>
<script src="/js/parcel-store.js"></script>
<script>
/* ============================================================
   GREEN Map — controller
   ============================================================ */
Layout.init({ page: 'map', titleKey: 'nav.map', subtitleKey: 'map.subtitle' });

const $ = id => document.getElementById(id);
const S = {
  parcels: [],            // ParcelStore records
  selectedKey: null,
  view: 'list',
  draw: null,             // { points: [L.Marker], editKey, base }
  pendingGeometry: null,  // validated polygon waiting for the form
  pickingStart: false,
  start: null,            // {lat, lng}
  preview: null,
  mission: null,          // full mission
  heat: null,             // heatmap payload
  missions: [],
};

/* ---- Formatting ------------------------------------------- */
const fmtHa = v => v == null ? '—' : I18n.t('map.units.ha', { v: I18n.number(v, { maximumFractionDigits: v < 10 ? 2 : 1 }) });
function fmtDistance(m) {
  if (m == null) return '—';
  return m < 1000 ? I18n.t('map.units.m', { v: I18n.number(Math.round(m)) })
                  : I18n.t('map.units.km', { v: I18n.number(m / 1000, { maximumFractionDigits: 2 }) });
}
function fmtDuration(s) {
  const min = Math.round(s / 60);
  return min < 60 ? I18n.t('map.units.min', { v: min }) : I18n.t('map.units.h', { h: Math.floor(min / 60), m: min % 60 });
}
const cropLabel = c => c ? (I18n.has(`map.form.crops.${c}`) ? I18n.t(`map.form.crops.${c}`) : c) : I18n.t('map.panel.no_crop');

/* ---- Map ---------------------------------------------------- */
const map = L.map('map', { zoomControl: true }).setView([5.6, 12.3], 6);   // Cameroon
const baseLayers = {
  streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
  }),
};
baseLayers.streets.addTo(map);
const parcelLayer = L.featureGroup().addTo(map);
const gridLayer = L.featureGroup().addTo(map);
const drawLayer = L.featureGroup().addTo(map);
const analysesLayer = L.featureGroup();
let layerControl = null;

function buildLayerControl() {
  if (layerControl) layerControl.remove();
  layerControl = L.control.layers(
    { [I18n.t('map.layers.streets')]: baseLayers.streets, [I18n.t('map.layers.satellite')]: baseLayers.satellite },
    { [I18n.t('map.layers.analyses')]: analysesLayer },
    { position: 'topright' }).addTo(map);
}

// SVG pattern for "not analysed" cells (hatched grey)
function ensureHatch() {
  const svg = map.getPanes().overlayPane.querySelector('svg');
  if (!svg || svg.querySelector('#green-hatch')) return;
  const ns = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = '<pattern id="green-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<rect width="6" height="6" fill="rgba(156,163,175,.15)"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/></pattern>';
  svg.insertBefore(defs, svg.firstChild);
}

/* ---- Views ---------------------------------------------------- */
function showView(name) {
  S.view = name;
  for (const v of ['List', 'Parcel', 'Form', 'Grid', 'Mission']) $(`view${v}`).hidden = v.toLowerCase() !== name;
  if (name !== 'grid' && name !== 'mission') { gridLayer.clearLayers(); $('legend').hidden = true; }
  if (name !== 'grid') stopPickStart();
}
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.back === 'list') { S.selectedKey = null; showView('list'); renderParcels(); }
  else openParcel(S.selectedKey);
}));

/* ---- Parcels: list & map ------------------------------------- */
async function loadParcels(fromServer = true) {
  try { S.parcels = await ParcelStore.list(fromServer); } catch (e) { S.parcels = []; }
  await renderParcels();
}

function parcelStyle(p, selected) {
  const color = p.sync === 'synced' ? '#16a34a' : p.sync === 'pending' ? '#d97706' : '#dc2626';
  return { color, weight: selected ? 3 : 2, fillOpacity: selected ? 0.12 : 0.18, dashArray: p.sync === 'pending' ? '6 4' : null };
}

async function renderParcels() {
  $('offlineBanner').hidden = navigator.onLine;
  let pending = 0;
  try { pending = await ParcelStore.pendingCount(); } catch (_) {}
  $('pendingOps').textContent = pending ? I18n.t('map.panel.pending_ops', { count: pending }) : '';

  parcelLayer.clearLayers();
  const list = $('parcelList');
  list.innerHTML = '';
  $('parcelEmpty').hidden = S.parcels.length > 0;
  S.parcels.forEach(p => {
    if (p.geometry) {
      const layer = L.geoJSON(p.geometry, { style: parcelStyle(p, p.key === S.selectedKey) });
      layer.on('click', () => { if (!S.draw && !S.pickingStart) openParcel(p.key); });
      layer.bindTooltip(escapeHtml(p.name), { sticky: true });
      parcelLayer.addLayer(layer);
    }
    const li = document.createElement('li');
    const last = p.last_analysis_at ? I18n.t('map.panel.last_analysis', { date: I18n.date(p.last_analysis_at) })
                                    : I18n.t('map.panel.no_analysis');
    li.innerHTML = `
      <button type="button" class="parcel-item" data-key="${escapeHtml(p.key)}">
        <div class="pi-top"><span class="pi-name">${escapeHtml(p.name)}</span>
          <span class="sync-badge sync-${p.sync}">${escapeHtml(I18n.t(`map.sync.${p.sync}`))}</span></div>
        <div class="pi-meta">${escapeHtml(cropLabel(p.crop_type))} · ${escapeHtml(fmtHa(p.area_ha))}</div>
        <div class="pi-meta">${escapeHtml(last)}</div>
      </button>`;
    li.querySelector('button').addEventListener('click', () => openParcel(p.key, true));
    list.appendChild(li);
  });
  if (S.view === 'parcel' && S.selectedKey) renderParcelView();
}

/* ---- Drawing --------------------------------------------------- */
$('newParcelBtn').addEventListener('click', () => startDraw(null));

function vertexIcon(first) {
  return L.divIcon({ className: '', html: `<div class="vertex-icon${first ? ' first' : ''}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] });
}

function startDraw(editKey, initial) {
  stopDraw();
  showView(editKey ? 'form' : 'list');
  S.draw = { points: [], editKey };
  drawLayer.clearLayers();
  (initial || []).forEach(([lng, lat]) => addPoint(L.latLng(lat, lng)));
  $('drawBar').hidden = false;
  document.body.classList.add('picking');
  updateDraw();
}

function stopDraw() {
  S.draw = null;
  drawLayer.clearLayers();
  $('drawBar').hidden = true;
  $('drawMsg').textContent = '';
  document.body.classList.remove('picking');
}

function addPoint(latlng) {
  const m = L.marker(latlng, { draggable: true, icon: vertexIcon(S.draw.points.length === 0), keyboard: false });
  m.on('drag', updateDraw);
  m.on('dragend', updateDraw);
  drawLayer.addLayer(m);
  S.draw.points.push(m);
  updateDraw();
}

function drawRing() {
  return S.draw.points.map(m => [m.getLatLng().lng, m.getLatLng().lat]);
}

/** Turf checks: returns { polygon, error, warning, area_ha, perimeter_m } */
function checkRing(ring) {
  if (ring.length < 3) return { error: I18n.t('map.draw.need_three') };
  const poly = turf.polygon([[...ring, ring[0]]]);
  if (turf.kinks(poly).features.length) return { polygon: poly, error: I18n.t('map.draw.kinks') };
  const area_ha = turf.area(poly) / 10000;
  const perimeter_m = turf.length(turf.polygonToLine(poly), { units: 'kilometers' }) * 1000;
  let warning = null;
  for (const other of S.parcels) {
    if (!other.geometry || (S.draw && other.key === S.draw.editKey)) continue;
    try {
      if (turf.booleanOverlap(poly, other.geometry) || turf.booleanContains(other.geometry, poly)
          || turf.booleanContains(poly, other.geometry)) {
        warning = I18n.t('map.draw.overlap', { name: other.name });
        break;
      }
    } catch (_) { /* malformed legacy geometry */ }
  }
  return { polygon: poly, area_ha, perimeter_m, warning };
}

function updateDraw() {
  if (!S.draw) return;
  drawLayer.eachLayer(l => { if (!(l instanceof L.Marker)) drawLayer.removeLayer(l); });
  const pts = S.draw.points.map(m => m.getLatLng());
  if (pts.length >= 2) L.polyline(pts, { color: '#16a34a', weight: 2, dashArray: '4 4' }).addTo(drawLayer);
  if (pts.length >= 3) L.polygon(pts, { color: '#16a34a', weight: 1, fillOpacity: 0.15, interactive: false }).addTo(drawLayer);
  $('drawCount').textContent = I18n.t('map.draw.points', { count: pts.length });
  const res = checkRing(drawRing());
  $('finishDrawBtn').disabled = !!res.error;
  $('undoPointBtn').disabled = pts.length === 0;
  if (pts.length >= 3) {
    $('drawMsg').textContent = res.error || [I18n.t('map.draw.area', {
      ha: I18n.number(res.area_ha, { maximumFractionDigits: 3 }), m: I18n.number(Math.round(res.perimeter_m)) }), res.warning]
      .filter(Boolean).join(' · ');
  }
}

map.on('click', e => {
  if (S.pickingStart) { setStart(e.latlng); return; }
  if (S.draw) addPoint(e.latlng);
});
$('undoPointBtn').addEventListener('click', () => {
  const m = S.draw && S.draw.points.pop();
  if (m) drawLayer.removeLayer(m);
  updateDraw();
});
$('cancelDrawBtn').addEventListener('click', () => {
  const editKey = S.draw && S.draw.editKey;
  stopDraw();
  if (editKey) openForm(S.parcels.find(p => p.key === editKey)); else showView('list');
});
$('myPositionBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { $('drawMsg').textContent = I18n.t('map.draw.geo_unavailable'); return; }
  $('drawMsg').textContent = I18n.t('map.draw.locating');
  navigator.geolocation.getCurrentPosition(pos => {
    if (!S.draw) return;
    const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
    addPoint(ll);
    map.setView(ll, Math.max(map.getZoom(), 18));
    const acc = Math.round(pos.coords.accuracy);
    $('drawMsg').textContent = I18n.t(acc > 15 ? 'map.draw.accuracy_warning' : 'map.draw.accuracy', { m: acc });
  }, () => { $('drawMsg').textContent = I18n.t('map.draw.geo_unavailable'); },
  { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
});
$('finishDrawBtn').addEventListener('click', () => {
  const res = checkRing(drawRing());
  if (res.error) { $('drawMsg').textContent = res.error; return; }
  const editKey = S.draw.editKey;
  S.pendingGeometry = { geometry: res.polygon.geometry, area_ha: res.area_ha, perimeter_m: res.perimeter_m, warning: res.warning };
  stopDraw();
  openForm(editKey ? S.parcels.find(p => p.key === editKey) : null, true);
});

/* ---- Grid drawing + heatmap colours --------------------------- */
const RATE_COLORS = ['#1a9850', '#91cf60', '#fee08b', '#fc8d59', '#d73027'];
const ALERT_COLORS = { none: '#1a9850', low: '#4575b4', medium: '#fdae61', high: '#d73027' };
const CAT_COLORS = ['#7570b3', '#e7298a', '#66a61e', '#e6ab02', '#a6761d', '#1b9e77', '#d95f02', '#666666'];
const rateColor = r => RATE_COLORS[Math.min(4, Math.floor(r * 5))];

function cellColor(stat, indicator, diseases) {
  if (!stat) return null;
  if (indicator === 'alert') return ALERT_COLORS[stat.max_alert] || ALERT_COLORS.none;
  if (indicator === 'dominant') {
    if (!stat.dominant) return ALERT_COLORS.none;
    return CAT_COLORS[diseases.indexOf(stat.dominant) % CAT_COLORS.length];
  }
  return stat.diseased === 0 ? RATE_COLORS[0] : rateColor(stat.rate);
}

function drawGrid(cells, waypoints, heat) {
  gridLayer.clearLayers();
  if (startMarker && S.view === 'grid') startMarker.addTo(gridLayer);
  const stats = heat ? Object.fromEntries(heat.cells.map(c => [c.index, c])) : {};
  const indicator = $('heatIndicator').value;
  const diseases = heat ? heat.diseases : [];
  cells.forEach(c => {
    const stat = stats[c.index];
    const color = heat ? cellColor(stat, indicator, diseases) : null;
    const layer = L.polygon(c.polygon.map(([lng, lat]) => [lat, lng]), {
      color: heat ? '#374151' : '#2563eb', weight: heat ? 0.6 : 1,
      fillColor: color || '#2563eb', fillOpacity: heat ? (color ? 0.75 : 1) : 0.08,
    });
    layer.bindTooltip(I18n.t('map.grid.cell_label', { n: c.index }), { sticky: true });
    if (heat) layer.on('click', () => showCell(c.index, stat));
    gridLayer.addLayer(layer);
    if (heat && !color && layer._path) {   // not analysed: hatched (pattern lives in the SVG renderer)
      ensureHatch();
      layer._path.setAttribute('fill', 'url(#green-hatch)');
    }
  });
  if (waypoints && waypoints.length) {
    L.polyline(waypoints.map(w => [w.lat, w.lng]), { color: '#111827', weight: 1.5, opacity: 0.7, dashArray: '3 4', interactive: false }).addTo(gridLayer);
    L.circleMarker([waypoints[0].lat, waypoints[0].lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#1d4ed8', fillOpacity: 1 })
      .bindTooltip(I18n.t('map.grid.start')).addTo(gridLayer);
  }
  renderLegend(heat, indicator, diseases);
}

function renderLegend(heat, indicator, diseases) {
  const lg = $('legend');
  if (!heat) { lg.hidden = true; return; }
  const row = (color, label) => `<div class="lg-row"><span class="sw" style="background:${color}"></span>${escapeHtml(label)}</div>`;
  let html = `<strong>${escapeHtml(I18n.t(`map.heat.${indicator}`))}</strong>`;
  if (indicator === 'rate') {
    ['0–20 %', '20–40 %', '40–60 %', '60–80 %', '80–100 %'].forEach((l, i) => { html += row(RATE_COLORS[i], l); });
  } else if (indicator === 'alert') {
    ['none', 'low', 'medium', 'high'].forEach(l => { html += row(ALERT_COLORS[l], alertLabel(l)); });
  } else {
    html += row(ALERT_COLORS.none, I18n.t('map.heat.healthy'));
    diseases.forEach((d, i) => { html += row(CAT_COLORS[i % CAT_COLORS.length], classLabel(d)); });
  }
  html += '<div class="lg-row"><span class="sw hatch"></span>' + escapeHtml(I18n.t('map.heat.not_analysed')) + '</div>';
  lg.innerHTML = html;
  lg.hidden = false;
}

/* ---- Missions ------------------------------------------------------- */
async function loadMissions() {
  const p = selected();
  const box = $('missionList');
  box.innerHTML = '';
  if (!p || !p.id || !navigator.onLine) { S.missions = []; return; }
  const { data } = await API.missions.list(p.id);
  S.missions = Array.isArray(data) ? data : [];
  renderMissionList();
}

function renderMissionList() {
  const box = $('missionList');
  if (!S.missions.length) { box.innerHTML = `<p class="note">${escapeHtml(I18n.t('map.mission.none'))}</p>`; return; }
  box.innerHTML = S.missions.map(m => `
    <div class="mission-item">
      <div class="mi-top"><strong>${escapeHtml(m.name || '#' + m.id)}</strong>
        <span class="sync-badge sync-synced">${escapeHtml(I18n.t(`map.mission.status.${m.status}`))}</span></div>
      <div class="progress"><div style="width:${Math.round(m.progress.ratio * 100)}%"></div></div>
      <div class="note">${escapeHtml(I18n.t('map.mission.progress', { done: m.progress.analysed_cells, total: m.progress.total_cells }))}
        · ${escapeHtml(I18n.t('map.grid.cells', { count: m.cells_total }))} · ${escapeHtml(I18n.t('map.units.m', { v: m.cell_size_m }))}</div>
      <button type="button" class="link-btn" data-mission="${m.id}">${escapeHtml(I18n.t('map.mission.open'))} →</button>
    </div>`).join('');
  box.querySelectorAll('[data-mission]').forEach(b => b.addEventListener('click', () => openMission(parseInt(b.dataset.mission, 10))));
}

async function openMission(id) {
  const { data, error } = await API.missions.get(id);
  if (error || !data) { App.toast(error || I18n.t('common.errors.generic'), 'error'); return; }
  S.mission = data;
  showView('mission');
  $('cellDetail').innerHTML = '';
  $('mStatus').value = data.status;
  $('analyseMissionLink').href = `/camera?parcel_id=${data.parcel_id}&mission_id=${data.id}`;
  renderMissionHeader();
  await loadHeat();
  map.fitBounds(L.geoJSON({ type: 'MultiPolygon', coordinates: data.grid.map(c => [c.polygon]) }).getBounds(), { padding: [20, 20], maxZoom: 20 });
}

function renderMissionHeader() {
  const m = S.mission;
  if (!m) return;
  $('mName').textContent = m.name || `#${m.id}`;
  $('mSummary').textContent = I18n.t('map.grid.summary', {
    cells: I18n.t('map.grid.cells', { count: m.cells_total }), distance: fmtDistance(m.distance_m), duration: fmtDuration(m.duration_s) });
  const prog = (S.heat && S.heat.mission.progress) || m.progress;
  $('mProgressBar').style.width = `${Math.round(prog.ratio * 100)}%`;
  $('mProgress').textContent = I18n.t('map.mission.progress', { done: prog.analysed_cells, total: prog.total_cells });
}

async function loadHeat() {
  const m = S.mission;
  const { data, error } = await API.missions.heatmap(m.id, {
    disease: $('heatDisease').value, date_from: $('heatFrom').value, date_to: $('heatTo').value });
  if (error) { App.toast(error, 'error'); return; }
  S.heat = data;
  fillDiseaseFilter();
  renderMissionHeader();
  drawGrid(m.grid, m.waypoints, data);
}

function fillDiseaseFilter() {
  const sel = $('heatDisease');
  const current = sel.value;
  const known = new Set([...(S.heat ? S.heat.diseases : []), current].filter(Boolean));
  sel.innerHTML = `<option value="">${escapeHtml(I18n.t('map.heat.all_diseases'))}</option>`
    + [...known].sort().map(d => `<option value="${escapeHtml(d)}">${escapeHtml(classLabel(d))}</option>`).join('');
  sel.value = current;
}

$('heatApplyBtn').addEventListener('click', loadHeat);
$('heatIndicator').addEventListener('change', () => { if (S.mission && S.heat) drawGrid(S.mission.grid, S.mission.waypoints, S.heat); });
$('mStatus').addEventListener('change', async () => {
  const { error } = await API.missions.update(S.mission.id, { status: $('mStatus').value });
  if (error) App.toast(error, 'error'); else S.mission.status = $('mStatus').value;
});
$('deleteMissionBtn').addEventListener('click', async () => {
  if (!App.confirm(I18n.t('map.mission.delete_confirm'))) return;
  const { error } = await API.missions.delete(S.mission.id);
  if (error) { App.toast(error, 'error'); return; }
  S.mission = null;
  openParcel(S.selectedKey);
});

function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$('exportJsonBtn').addEventListener('click', async () => {
  const { data, error } = await API.missions.waypoints(S.mission.id);
  if (error) { App.toast(error, 'error'); return; }
  download(`green-mission-${S.mission.id}-waypoints.json`, JSON.stringify(data, null, 2), 'application/json');
});
$('exportGeoBtn').addEventListener('click', async () => {
  const { data, error } = await API.missions.exportGeojson(S.mission.id);
  if (error) { App.toast(error, 'error'); return; }
  download(`green-mission-${S.mission.id}.geojson`, JSON.stringify(data), 'application/geo+json');
});

async function showCell(index, stat) {
  const box = $('cellDetail');
  const title = `<h4 style="margin:var(--sp-3) 0 var(--sp-1);">${escapeHtml(I18n.t('map.heat.cell_title', { n: index }))}</h4>`;
  if (!stat) { box.innerHTML = title + `<p class="note">${escapeHtml(I18n.t('map.heat.cell_empty'))}</p>`; return; }
  box.innerHTML = title + `<p class="note">${escapeHtml(I18n.t('map.heat.cell_stats', { n: stat.analyses, rate: I18n.percent(stat.rate) }))}</p>`
    + `<p class="note">${escapeHtml(I18n.t('map.heat.loading'))}</p>`;
  const items = await Promise.all(stat.analysis_ids.map(id => API.analysis.get(id).then(r => r.data).catch(() => null)));
  box.innerHTML = title + `<p class="note">${escapeHtml(I18n.t('map.heat.cell_stats', { n: stat.analyses, rate: I18n.percent(stat.rate) }))}</p>`
    + items.filter(Boolean).map(a => Fiche.html(a, { compact: true })
      .replace('<div class="fiche-body">', `<div class="fiche-body"><a class="note" href="/history?id=${a.id}">#${a.id} · ${escapeHtml(I18n.dateTime(a.created_at))}</a>`)).join('');
  if (window.innerWidth <= 900) box.scrollIntoView({ behavior: 'smooth' });
}

/* ---- Geolocated analyses overlay ----------------------------------- */
async function loadAnalysesOverlay() {
  if (!navigator.onLine) return;
  const { data } = await API.parcels.geoAnalyses();
  analysesLayer.clearLayers();
  (Array.isArray(data) ? data : []).forEach(a => {
    const color = isHealthy(a) ? '#16a34a' : (ALERT_COLORS[alertLevel(a)] || '#d73027');
    L.circleMarker([a.latitude, a.longitude], { radius: 6, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9 })
      .bindPopup(`<strong>${escapeHtml(analysisLabel(a))}</strong><br>${escapeHtml(I18n.dateTime(a.created_at))}<br>`
        + `<a href="/history?id=${a.id}">${escapeHtml(I18n.t('common.actions.view'))}</a>`)
      .addTo(analysesLayer);
  });
}

/* ---- Wiring ---------------------------------------------------------- */
ParcelStore.on('changed', () => loadParcels(false));
ParcelStore.on('conflict', p => App.toast(p.error || I18n.t('map.form.conflict'), 'warning', 6000));
ParcelStore.on('error', p => App.toast(p.error || I18n.t('common.errors.generic'), 'error', 6000));
window.addEventListener('online', () => { renderParcels(); loadParcels(true); });
window.addEventListener('offline', renderParcels);

window.addEventListener('languageChanged', () => {
  buildLayerControl();
  renderParcels();
  if (S.view === 'grid') { renderGridLabels(); }
  if (S.view === 'mission' && S.mission) { renderMissionHeader(); fillDiseaseFilter(); drawGrid(S.mission.grid, S.mission.waypoints, S.heat); }
  if (S.view === 'form') $('fRegion').textContent = formParcel && formParcel.region ? regionLabel(formParcel.region) : I18n.t('map.form.region_auto');
  updateDraw();
  loadAnalysesOverlay();
});

document.addEventListener('DOMContentLoaded', async () => {
  buildLayerControl();
  await loadParcels(true);
  const bounds = parcelLayer.getBounds();
  if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 18 });
  ParcelStore.sync();
  loadAnalysesOverlay();
  // deep links: /map?parcel=<id>&mission=<id>
  const q = new URLSearchParams(location.search);
  const pid = parseInt(q.get('parcel'), 10);
  const p = pid && S.parcels.find(x => x.id === pid);
  if (p) { await openParcel(p.key, true); if (q.get('mission')) openMission(parseInt(q.get('mission'), 10)); }
});
</script>
</body>
