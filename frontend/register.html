<!DOCTYPE html>
<html lang="fr">
<!--
  GREEN App — Register Page
  New enterprise users create their account here.
  Fields: first name, last name, phone (required), email (optional),
          company name, Cameroon region, password + confirmation.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.register">GREEN</title>

  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <script src="/js/theme-init.js"></script>

  <style>
    /* Register page specific: right panel scrolls, not full-height centered */
    .auth-right { justify-content: flex-start; padding-top: var(--sp-10); padding-bottom: var(--sp-10); }
    @media (min-width: 901px) { .auth-right { justify-content: center; } }

    /* Register page specific: keep the left-side branding content tightly grouped */
    .auth-left-content { gap: var(--sp-3); }
    .auth-headline { justify-content: flex-start; }

    /* Stronger override for the branding logo and title on this page */
    .auth-left .auth-logo img {
      width: 4.25rem !important;
      height: 4.25rem !important;
    }
    .auth-left .auth-logo-name {
      font-size: 2.5rem !important;
    }

    /* ---- Multi-step form (register) --------------------------- */
    .form-steps-indicator {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin-bottom: var(--sp-6);
    }
    .step-indicator-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      opacity: 0.85;   /* inactive step stays readable (AA) */
      transition: opacity var(--dur-base) var(--ease-out);
    }
    .step-indicator-item.active,
    .step-indicator-item.completed { opacity: 1; }
    .step-indicator-num {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      border: 1.5px solid var(--border-default);
      color: var(--text-secondary);
      transition: background-color var(--dur-base), border-color var(--dur-base), color var(--dur-base);
    }
    .step-indicator-item.active .step-indicator-num,
    .step-indicator-item.completed .step-indicator-num {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: #ffffff;
    }
    .step-indicator-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .step-indicator-item.active .step-indicator-label { color: var(--text-primary); }
    .step-indicator-line {
      flex: 1;
      height: 1.5px;
      background: var(--border-default);
    }
    .form-step { display: flex; flex-direction: column; gap: var(--sp-5); }
    .step-actions {
      display: flex;
      gap: var(--sp-3);
      margin-top: var(--sp-2);
    }
    .step-actions .btn-ghost { flex: 0 0 auto; min-width: 110px; }
    .step-actions .btn-submit { flex: 1; }
    .consent-check {
      display: flex;
      gap: var(--sp-3);
      align-items: flex-start;
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.45;
      cursor: pointer;
    }
    .consent-check input { margin-top: 3px; width: 16px; height: 16px; flex: none; accent-color: var(--brand-primary); }
  </style>
</head>

<body>
  <div class="auth-page">

    <!-- Language selector (top right) -->
    <div class="auth-lang-switch">
      <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_switch_aria">
        <button type="button" class="lang-switch-btn" data-lang="fr" lang="fr" title="Français">FR</button>
        <button type="button" class="lang-switch-btn" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </div>

    <!-- =========================================================
         LEFT PANEL — Branding
         ========================================================= -->
    <aside class="auth-left" aria-hidden="true">
      <div class="auth-left-pattern"></div>

      <div class="auth-left-content">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/logo.png" alt="GREEN" />
          <span class="auth-logo-name">GREEN</span>
        </div>

        <div class="auth-headline">
          <div class="auth-tag">
            <span class="auth-tag-dot"></span>
            <span data-i18n="auth.panel.register_tag"></span>
          </div>

          <h1 class="auth-title">
            <span data-i18n="auth.panel.register_title_1"></span><br />
            <span data-i18n="auth.panel.register_title_2"></span>
          </h1>

          <p class="auth-subtitle" data-i18n="auth.panel.register_subtitle"></p>

          <!-- What you get -->
          <div class="auth-features">
            <div class="auth-feature">
              <div class="auth-feature-icon">
                <!-- Leaf icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
                  <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_bot_title"></h4>
                <p data-i18n="auth.panel.feature_bot_text"></p>
              </div>
            </div>

            <div class="auth-feature">
              <div class="auth-feature-icon">
                <!-- Shield icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_calendar_title"></h4>
                <p data-i18n="auth.panel.feature_calendar_text"></p>
              </div>
            </div>

            <div class="auth-feature">
              <div class="auth-feature-icon">
                <!-- Users icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_progress_title"></h4>
                <p data-i18n="auth.panel.feature_progress_text"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- =========================================================
         RIGHT PANEL — Registration Form
         ========================================================= -->
    <main class="auth-right">
      <div class="auth-card">

        <!-- Mobile logo -->
        <div class="auth-mobile-logo">
          <img src="assets/logo.png" alt="GREEN" />
          <span class="auth-mobile-logo-name">GREEN</span>
        </div>

        <!-- Card header -->
        <div class="auth-card-header">
          <h2 class="auth-greeting" data-i18n="auth.register.greeting"></h2>
          <p class="auth-description" data-i18n="auth.register.description"></p>
        </div>

        <!-- Global alert -->
        <div id="registerAlert" class="alert" style="display:none;" role="alert"></div>

        <!-- Step indicator -->
        <div class="form-steps-indicator" id="formStepsIndicator">
          <div class="step-indicator-item active" data-step-indicator="1">
            <span class="step-indicator-num">1</span>
            <span class="step-indicator-label" data-i18n="auth.register.step_personal"></span>
          </div>
          <div class="step-indicator-line"></div>
          <div class="step-indicator-item" data-step-indicator="2">
            <span class="step-indicator-num">2</span>
            <span class="step-indicator-label" data-i18n="auth.register.step_farm"></span>
          </div>
        </div>

        <!-- Register form -->
        <form id="registerForm" class="auth-form" novalidate>

        <!-- =========================================================
             STEP 1 — Personal Information + Contact
             ========================================================= -->
        <div class="form-step" id="registerStep1" data-step="1">

          <!-- ---- SECTION: Personal Information --------------- -->
          <div class="form-section-label" data-i18n="auth.register.section_personal"></div>

          <!-- First & Last Name (side by side) -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="first_name" data-i18n="auth.register.first_name"></label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input
                  type="text"
                  id="first_name"
                  name="first_name"
                  class="form-input"
                  data-i18n-placeholder="auth.register.first_name_placeholder"
                  autocomplete="given-name"
                  required
                />
              </div>
              <span id="first_name_error" class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="last_name" data-i18n="auth.register.last_name"></label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input
                  type="text"
                  id="last_name"
                  name="last_name"
                  class="form-input"
                  data-i18n-placeholder="auth.register.last_name_placeholder"
                  autocomplete="family-name"
                  required
                />
              </div>
              <span id="last_name_error" class="field-error"></span>
            </div>
          </div><!-- /form-row -->

          <!-- ---- SECTION: Contact ---------------------------- -->
          <div class="form-section-label" style="margin-top: var(--sp-2);" data-i18n="auth.register.section_contact"></div>

          <!-- Phone (required) -->
          <div class="form-group">
            <label class="form-label" for="phone">
              <span data-i18n="auth.register.phone"></span> <span style="color: var(--color-error-text);">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input
                type="tel"
                id="phone"
                name="phone"
                class="form-input"
                data-i18n-placeholder="auth.register.phone_placeholder"
                autocomplete="tel"
                inputmode="tel"
                required
              />
            </div>
            <span id="phone_error" class="field-error"></span>
          </div>

          <!-- Email (optional) -->
          <div class="form-group">
            <label class="form-label" for="email">
              <span data-i18n="auth.register.email"></span>
              <span style="color: var(--text-muted); font-weight: var(--weight-regular);">(<span data-i18n="common.optional"></span>)</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                data-i18n-placeholder="auth.register.email_placeholder"
                autocomplete="email"
                inputmode="email"
              />
            </div>
            <span id="email_error" class="field-error"></span>
          </div>

          <!-- Step 1 actions -->
          <div class="step-actions">
            <button type="button" id="registerNextBtn" class="btn btn-primary btn-full" data-i18n="auth.register.next"></button>
          </div>

        </div><!-- /registerStep1 -->

        <!-- =========================================================
             STEP 2 — Enterprise Details + Security
             ========================================================= -->
        <div class="form-step" id="registerStep2" data-step="2" style="display:none;">

          <!-- ---- SECTION: Enterprise Details ----------------- -->
          <div class="form-section-label" data-i18n="auth.register.section_farm"></div>

          <!-- Company name -->
          <div class="form-group">
            <label class="form-label" for="company_name">
              <span data-i18n="auth.register.company"></span>
              <span style="color: var(--text-muted); font-weight: var(--weight-regular);">(<span data-i18n="common.optional"></span>)</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                  <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
              </span>
              <input
                type="text"
                id="company_name"
                name="company_name"
                class="form-input"
                data-i18n-placeholder="auth.register.company_placeholder"
              />
            </div>
          </div>

          <!-- Region of Cameroon -->
          <div class="form-group">
            <label class="form-label" for="region">
              <span data-i18n="auth.register.region"></span>
              <span style="color: var(--text-muted); font-weight: var(--weight-regular);">(<span data-i18n="common.optional"></span>)</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="2" y1="12" x2="22" y2="12"/>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
              </span>
              <select id="region" name="region" class="form-select" data-placeholder-key="auth.register.region_placeholder"></select>
            </div>
          </div>

          <!-- ---- SECTION: Security --------------------------- -->
          <div class="form-section-label" style="margin-top: var(--sp-2);" data-i18n="auth.register.section_security"></div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">
              <span data-i18n="auth.register.password"></span> <span style="color: var(--color-error-text);">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input has-action"
                data-i18n-placeholder="auth.register.password_placeholder"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="input-action"
                data-i18n-aria-label="auth.show_password"
              >
                <svg class="icon-eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-close" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <!-- Password strength bars -->
            <div id="passwordStrengthBars" class="password-strength">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
            <span id="passwordStrengthLabel" class="strength-label"></span>
            <span id="password_error" class="field-error"></span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm_password">
              <span data-i18n="auth.register.confirm_password"></span> <span style="color: var(--color-error-text);">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 12l2 2 4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
                </svg>
              </span>
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                class="form-input has-action"
                data-i18n-placeholder="auth.register.confirm_password_placeholder"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                id="toggleConfirmPassword"
                class="input-action"
                data-i18n-aria-label="auth.show_password"
              >
                <svg class="icon-eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-close" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span id="confirm_password_error" class="field-error"></span>
          </div>

          <!-- ---- SECTION: Consent (optional, off by default) ---- -->
          <div class="form-section-label" style="margin-top: var(--sp-2);" data-i18n="auth.register.section_consent"></div>
          <label class="consent-check">
            <input type="checkbox" id="dataset_consent" name="dataset_consent" />
            <span data-i18n="auth.register.dataset_consent"></span>
          </label>

          <!-- Step 2 actions -->
          <div class="step-actions">
            <button type="button" id="registerBackBtn" class="btn btn-ghost" data-i18n="auth.register.back"></button>
            <button
              type="submit"
              id="registerSubmitBtn"
              class="btn btn-primary btn-submit"
            >
              <span class="spinner"></span>
              <span class="btn-text" data-i18n="auth.register.submit"></span>
            </button>
          </div>

        </div><!-- /registerStep2 -->

        </form><!-- /registerForm -->

        <!-- Sign in redirect -->
        <p class="auth-footer">
          <span data-i18n="auth.register.have_account"></span>
          <a href="/" data-i18n="auth.register.sign_in"></a>
        </p>

      </div><!-- /auth-card -->
    </main>

  </div><!-- /auth-page -->

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
