<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.chatbot">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    /* ============================================================
       GREENBOT — Chat UI
       Two-column: sessions sidebar (left) + chat pane (right)
       ============================================================ */

    /* Remove default page padding — chat fills viewport */
    #appContent { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ---- Top-level split ----------------------------------- */
    .chat-shell {
      display: flex;
      flex: 1;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
    }

    /* ---- Sessions sidebar ---------------------------------- */
    .sessions-sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-1);
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
    }
    .sessions-top {
      padding: var(--sp-4) var(--sp-4) var(--sp-3);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .sessions-top-title {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: var(--sp-3);
    }
    .sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-2) var(--sp-2);
      scrollbar-width: thin;
      scrollbar-color: var(--border-default) transparent;
    }
    .session-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-3);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--dur-base) var(--ease-out);
      position: relative;
    }
    .session-item:hover { background: var(--bg-subtle); }
    .session-item.active { background: rgba(46,204,113,.09); }
    .session-item.active .session-title { color: var(--brand-text); font-weight: var(--weight-semibold); }
    .session-ico {
      width: 30px; height: 30px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .session-item.active .session-ico { background: rgba(46,204,113,.15); color: var(--brand-text); }
    .session-info { flex: 1; min-width: 0; }
    .session-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .session-del {
      position: absolute;
      right: var(--sp-2);
      opacity: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 3px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      transition: opacity var(--dur-base), color var(--dur-base);
    }
    .session-item:hover .session-del { opacity: 1; }
    .session-del:hover { color: var(--color-error-text); }

    .sessions-empty {
      padding: var(--sp-8) var(--sp-4);
      text-align: center;
      color: var(--text-muted);
      font-size: var(--text-sm);
    }

    /* ---- Chat pane ----------------------------------------- */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-subtle);
    }

    /* Welcome state (no session selected) */
    .chat-welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-8);
      text-align: center;
    }
    .chat-welcome-logo {
      width: 72px; height: 72px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--brand-dark), var(--brand-mid));
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin-bottom: var(--sp-5);
      box-shadow: var(--shadow-brand);
    }
    .chat-welcome h2 {
      font-size: var(--text-2xl);
      font-weight: var(--weight-extrabold);
      color: var(--text-primary);
      letter-spacing: -.02em;
      margin: 0 0 var(--sp-2);
    }
    .chat-welcome p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      max-width: 400px;
      line-height: var(--leading-relaxed);
      margin: 0 0 var(--sp-6);
    }
    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      justify-content: center;
      max-width: 520px;
    }
    .chip {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: var(--sp-2) var(--sp-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color var(--dur-base), color var(--dur-base), background-color var(--dur-base);
    }
    .chip:hover { border-color: var(--brand-primary); color: var(--brand-text); background: rgba(46,204,113,.05); }

    /* Messages area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-6) var(--sp-8);
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      scrollbar-width: thin;
      scrollbar-color: var(--border-default) transparent;
    }

    /* Message bubble */
    .msg-row {
      display: flex;
      gap: var(--sp-3);
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      flex-shrink: 0;
    }
    .msg-avatar.bot {
      background: linear-gradient(135deg, var(--brand-dark), var(--brand-mid));
      color: #fff;
      font-size: 1rem;
    }
    .msg-avatar.user-av {
      background: var(--bg-muted);
      color: var(--text-secondary);
      font-size: var(--text-xs);
    }

    .msg-bubble {
      max-width: 68%;
      padding: var(--sp-4) var(--sp-5);
      border-radius: var(--radius-lg);
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
    }
    .msg-row.bot .msg-bubble {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-top-left-radius: var(--radius-xs);
    }
    .msg-row.user .msg-bubble {
      background: var(--brand-dark);
      color: #fff;
      border-top-right-radius: var(--radius-xs);
    }

    /* Markdown-ish: format lists inside bot messages */
    .msg-bubble ul { padding-left: var(--sp-5); margin: var(--sp-2) 0; }
    .msg-bubble li { margin-bottom: var(--sp-1); }
    .msg-bubble p  { margin: 0 0 var(--sp-2); }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong { font-weight: var(--weight-semibold); }

    .msg-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: var(--sp-1);
      padding: 0 var(--sp-1);
    }
    .msg-row.user .msg-time { text-align: right; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-2) 0;
    }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--brand-primary);
      animation: dot-bounce 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -.16s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0); opacity: .5; }
      40%            { transform: scale(1); opacity: 1; }
    }

    /* Input bar */
    .chat-input-bar {
      flex-shrink: 0;
      padding: var(--sp-4) var(--sp-8);
      background: var(--surface-1);
      border-top: 1px solid var(--border-subtle);
    }
    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: var(--sp-3);
      background: var(--bg-subtle);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-3) var(--sp-4);
      transition: border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .chat-input-row:focus-within {
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px var(--input-ring);
      background: var(--input-bg);
    }
    #chatInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      color: var(--text-primary);
      line-height: var(--leading-relaxed);
      max-height: 140px;
      min-height: 24px;
    }
    #chatInput::placeholder { color: var(--input-placeholder); }
    .send-btn {
      width: 36px; height: 36px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      background: var(--brand-primary);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      transition: background-color var(--dur-base), transform var(--dur-fast);
    }
    .send-btn:hover:not(:disabled) { background: var(--brand-mid); transform: scale(1.05); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .chat-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: var(--sp-2);
      text-align: center;
    }

    /* Context banner (when analysis_id is linked) */
    .analysis-ctx-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-2) var(--sp-8);
      background: rgba(46,204,113,.07);
      border-bottom: 1px solid rgba(46,204,113,.15);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .analysis-ctx-bar span { font-weight: var(--weight-semibold); color: var(--brand-text); }
    .ctx-clear-btn {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }
    .ctx-clear-btn:hover { color: var(--color-error-text); }

    /* RAG badge on bot messages */
    .rag-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 1px 7px;
      margin-top: var(--sp-2);
    }

    /* ---- Conversations sidebar drawer (mobile) ----------------- */
    .conv-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 130;
    }
    .conv-backdrop.open { display: block; }

    @media (max-width: 768px) {
      /* Conversations sidebar becomes a bottom sheet / left drawer */
      .sessions-sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: 80vw;
        max-width: 300px;
        z-index: 140;
        transform: translateX(-100%);
        transition: transform .25s ease-out;
        box-shadow: 4px 0 24px rgba(0,0,0,.18);
      }
      .sessions-sidebar.mob-open {
        transform: translateX(0);
      }
      .chat-messages { padding: var(--sp-4); }
      .chat-input-bar { padding: var(--sp-3) var(--sp-4); }
    }
      .conv-toggle { display: none; align-items: center; gap: var(--sp-2); margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-2) var(--sp-3);
                   border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--surface-1);
                   color: var(--text-secondary); font: 500 var(--text-sm) var(--font-sans); cursor: pointer; align-self: flex-start; }
    .conv-close { display: none; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: var(--radius-sm); }
    @media (max-width: 768px) { .conv-toggle, .conv-close { display: inline-flex; } }
    .bot-notice { margin: var(--sp-3) var(--sp-4) 0; padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-md);
                  background: var(--color-warning-bg); color: #92400E; font-size: var(--text-sm); }
    [data-theme="dark"] .bot-notice { background: rgba(245,158,11,.12); color: #FCD34D; }
    .bot-disclaimer { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--sp-4); }
    .msg-row.error .msg-bubble { border: 1px solid var(--color-error-border); background: var(--color-error-bg); color: #991B1B; }
    [data-theme="dark"] .msg-row.error .msg-bubble { background: rgba(239,68,68,.12); color: #FCA5A5; }
    .sessions-empty { padding: var(--sp-4); font-size: var(--text-sm); color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Backdrop for conversations drawer (mobile) -->
      <div class="conv-backdrop" id="convBackdrop"></div>

      <div class="chat-shell">

        <!-- ===== Sessions sidebar ========================= -->
        <div class="sessions-sidebar" id="sessionsSidebar">
          <div class="sessions-top">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);">
              <div class="sessions-top-title" style="margin-bottom:0;" data-i18n="chatbot.conversations"></div>
              <button type="button" id="closeSidebarBtn" class="conv-close" data-i18n-aria-label="chatbot.close">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
            <button type="button" class="btn btn-primary" style="width:100%;font-size:var(--text-sm);" id="newSessionBtn" data-i18n="chatbot.new"></button>
          </div>
          <div class="sessions-list" id="sessionsList"></div>
          <div class="sessions-empty" id="sessionsEmpty" data-i18n="chatbot.none"></div>
        </div>

        <!-- ===== Chat pane ================================ -->
        <div class="chat-pane" id="chatPane">

          <button type="button" class="conv-toggle" id="convToggle">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span data-i18n="chatbot.show_conversations"></span>
          </button>

          <div class="bot-notice" id="notConfigured" style="display:none;" role="status" data-i18n="chatbot.not_configured"></div>

          <!-- Welcome state -->
          <div class="chat-welcome" id="chatWelcome">
            <div class="chat-welcome-logo">
              <svg width="28" height="28" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg>
            </div>
            <h2>GreenBot</h2>
            <p data-i18n="chatbot.welcome"></p>
            <div class="suggestion-chips" id="suggestions">
              <button type="button" class="chip" data-i18n="chatbot.suggestions.cassava"></button>
              <button type="button" class="chip" data-i18n="chatbot.suggestions.maize"></button>
              <button type="button" class="chip" data-i18n="chatbot.suggestions.tomato"></button>
              <button type="button" class="chip" data-i18n="chatbot.suggestions.calendar"></button>
              <button type="button" class="chip" data-i18n="chatbot.suggestions.result"></button>
            </div>
            <p class="bot-disclaimer" data-i18n="chatbot.disclaimer"></p>
          </div>

          <!-- Active chat -->
          <div id="chatActive" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
            <div class="analysis-ctx-bar" id="ctxBar" style="display:none;">
              <span data-i18n="chatbot.ctx"></span>&nbsp;<a id="ctxLabel" href="#"></a>
              <button type="button" class="ctx-clear-btn" id="ctxClear" data-i18n="chatbot.ctx_remove"></button>
            </div>
            <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
          </div>

          <!-- Input bar -->
          <div class="chat-input-bar" id="chatInputBar" style="display:none;">
            <div class="chat-input-row">
              <textarea id="chatInput" rows="1" maxlength="4000"
                        data-i18n-placeholder="chatbot.placeholder" data-i18n-aria-label="chatbot.input_label"></textarea>
              <button type="button" class="send-btn" id="sendBtn" data-i18n-title="chatbot.send" data-i18n-aria-label="chatbot.send">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
            <div class="chat-hint"><span data-i18n="chatbot.hint"></span> · <span data-i18n="chatbot.disclaimer"></span></div>
          </div>

        </div><!-- /chat-pane -->
      </div><!-- /chat-shell -->

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'chatbot', titleKey: 'nav.chatbot', subtitleKey: 'chatbot.subtitle' });

/* ---- State ---------------------------------------------------- */
let currentSessionId = null;
let sessions         = [];
let messages         = [];      // messages of the open session (re-rendered on language change)
let linkedAnalysis   = null;    // {id, label} — only for the conversation opened from an analysis
let contextSessionId = null;    // conversation the analysis context belongs to
let isSending        = false;
let botEnabled       = true;
const $ = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', async () => {
  $('newSessionBtn').addEventListener('click', newSession);
  $('sendBtn').addEventListener('click', sendMessage);
  $('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $('chatInput').addEventListener('input', e => autoResize(e.target));
  $('ctxClear').addEventListener('click', clearAnalysisContext);
  $('convToggle').addEventListener('click', openMobileSidebar);
  $('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
  $('convBackdrop').addEventListener('click', closeMobileSidebar);
  document.querySelectorAll('#suggestions .chip').forEach(chip =>
    chip.addEventListener('click', () => startWithSuggestion(chip.textContent)));

  API.health().then(({ data }) => {
    botEnabled = !(data && data.services && data.services.greenbot === false);
    $('notConfigured').style.display = botEnabled ? 'none' : '';
    $('sendBtn').disabled = !botEnabled;
    $('chatInput').disabled = !botEnabled;
  });

  const aid = parseInt(new URLSearchParams(location.search).get('analysis_id'), 10);
  if (aid) {
    const { data } = await API.analysis.get(aid);
    if (data) linkedAnalysis = { id: aid, data };
  }

  await loadSessions();
  // Arriving from an analysis: a fresh conversation about it; otherwise the latest one
  if (linkedAnalysis) await newSession();
  else if (sessions.length) await openSession(sessions[0].id);
});

window.addEventListener('languageChanged', () => {
  renderSessions();
  renderMessages();
  renderCtxBar();
});

/* ---- Sessions ------------------------------------------------- */
async function loadSessions() {
  const { data } = await API.chat.sessions();
  sessions = Array.isArray(data) ? data : [];
  renderSessions();
}

function renderSessions() {
  const list = $('sessionsList');
  $('sessionsEmpty').style.display = sessions.length ? 'none' : '';
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}" tabindex="0" role="button">
      <div class="session-ico">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="session-info">
        <div class="session-title">${escapeHtml(s.title && s.title !== 'New conversation' ? s.title : I18n.t('chatbot.untitled'))}</div>
        <div class="session-date">${escapeHtml(I18n.relative(s.updated_at))} · ${escapeHtml(I18n.t('chatbot.messages', { count: s.message_count }))}</div>
      </div>
      <button type="button" class="session-del" data-del="${s.id}" title="${escapeHtml(I18n.t('chatbot.delete'))}" aria-label="${escapeHtml(I18n.t('chatbot.delete'))}">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
    </div>`).join('');
  list.querySelectorAll('.session-item').forEach(el => {
    const open = () => openSession(parseInt(el.dataset.id, 10));
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  });
  list.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    deleteSession(parseInt(btn.dataset.del, 10));
  }));
}

async function openSession(id) {
  const { data, error } = await API.chat.getSession(id);
  if (error || !data) { App.toast(error || I18n.t('chatbot.load_error'), 'error'); return; }
  currentSessionId = id;
  messages = data.messages || [];
  renderSessions();
  showChatPane();
  renderMessages();
  closeMobileSidebar();
}

async function newSession() {
  const { data, error } = await API.chat.createSession();
  if (error || !data) { App.toast(error || I18n.t('common.errors.generic'), 'error'); return false; }
  currentSessionId = data.id;
  contextSessionId = linkedAnalysis ? data.id : null;
  messages = [];
  await loadSessions();
  showChatPane();
  renderMessages();
  closeMobileSidebar();
  $('chatInput').focus();
  return true;
}

async function deleteSession(id) {
  if (!App.confirm(I18n.t('chatbot.delete_confirm'))) return;
  const { error } = await API.chat.deleteSession(id);
  if (error) { App.toast(error, 'error'); return; }
  if (currentSessionId === id) {
    currentSessionId = null;
    messages = [];
    hideChatPane();
  }
  if (contextSessionId === id) clearAnalysisContext();
  await loadSessions();
  App.toast(I18n.t('chatbot.deleted'), 'success');
}

/* ---- Messages ------------------------------------------------- */
async function sendMessage() {
  if (isSending || !botEnabled) return;
  const input = $('chatInput');
  const content = input.value.trim();
  if (!content) return;
  if (!currentSessionId && !(await newSession())) return;

  input.value = '';
  autoResize(input);
  isSending = true;
  $('sendBtn').disabled = true;
  messages.push({ role: 'user', content, created_at: new Date().toISOString() });
  renderMessages();
  const typing = showTyping();

  const analysisId = contextSessionId === currentSessionId && linkedAnalysis ? linkedAnalysis.id : null;
  const { data, error } = await API.chat.sendMessage(currentSessionId, content, analysisId);

  typing.remove();
  isSending = false;
  $('sendBtn').disabled = !botEnabled;

  if (error) {
    // Shown in the conversation, in the user's language (translated by the server)
    messages.push({ role: 'assistant', error: true, content: `${I18n.t('chatbot.send_error')} ${error}`,
                    created_at: new Date().toISOString() });
  } else {
    messages.push({ role: 'assistant', content: data.content, created_at: data.created_at, rag_used: data.rag_used });
  }
  renderMessages();
  await loadSessions();
}

function renderMessages() {
  const container = $('chatMessages');
  container.innerHTML = '';
  messages.forEach(appendMessage);
  container.scrollTop = container.scrollHeight;
}

function appendMessage(m) {
  const isUser = m.role === 'user';
  const user = Auth.getUser() || {};
  const row = document.createElement('div');
  row.className = `msg-row ${isUser ? 'user' : 'bot'}${m.error ? ' error' : ''}`;
  const avatar = isUser
    ? `<div class="msg-avatar user-av">${escapeHtml(getInitials(user.first_name, user.last_name) || '?')}</div>`
    : `<div class="msg-avatar bot"><svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg></div>`;
  const rag = !isUser && m.rag_used
    ? `<div class="rag-badge">${escapeHtml(I18n.t('chatbot.kb_badge'))}</div>` : '';
  const time = m.created_at ? I18n.date(m.created_at, { hour: '2-digit', minute: '2-digit' }) : '';
  row.innerHTML = `${avatar}<div><div class="msg-bubble">${formatMarkdown(m.content)}${rag}</div><div class="msg-time">${escapeHtml(time)}</div></div>`;
  $('chatMessages').appendChild(row);
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg-row bot';
  el.innerHTML = `
    <div class="msg-avatar bot"><svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg></div>
    <div class="msg-bubble" style="padding:var(--sp-3) var(--sp-4);">
      <div class="typing-indicator"><div class="typing-dots"><span></span><span></span><span></span></div>
      <span style="font-size:var(--text-xs);color:var(--text-muted);">${escapeHtml(I18n.t('chatbot.thinking'))}</span></div>
    </div>`;
  $('chatMessages').appendChild(el);
  $('chatMessages').scrollTop = $('chatMessages').scrollHeight;
  return el;
}

async function startWithSuggestion(text) {
  if (!botEnabled) return;
  if (!(await newSession())) return;
  $('chatInput').value = text;
  await sendMessage();
}

/* ---- Analysis context ----------------------------------------- */
function renderCtxBar() {
  const show = linkedAnalysis && contextSessionId === currentSessionId && currentSessionId;
  $('ctxBar').style.display = show ? 'flex' : 'none';
  if (!show) return;
  const a = linkedAnalysis.data;
  $('ctxLabel').textContent = `${analysisLabel(a)} — ${I18n.date(a.created_at, { day: 'numeric', month: 'short' })}`;
  $('ctxLabel').href = `/history?id=${encodeURIComponent(a.id)}`;
}

function clearAnalysisContext() {
  linkedAnalysis = null;
  contextSessionId = null;
  renderCtxBar();
}

/* ---- Panes ---------------------------------------------------- */
function showChatPane() {
  $('chatWelcome').style.display = 'none';
  $('chatActive').style.display = 'flex';
  $('chatInputBar').style.display = 'block';
  renderCtxBar();
}

function hideChatPane() {
  $('chatWelcome').style.display = 'flex';
  $('chatActive').style.display = 'none';
  $('chatInputBar').style.display = 'none';
}

function openMobileSidebar() {
  $('sessionsSidebar').classList.add('mob-open');
  $('convBackdrop').classList.add('open');
}

function closeMobileSidebar() {
  $('sessionsSidebar').classList.remove('mob-open');
  $('convBackdrop').classList.remove('open');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

/** Minimal markdown on escaped text: bold, italics, lists, paragraphs. No links or HTML. */
function formatMarkdown(text) {
  let html = escapeHtml(text || '');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  html = html.replace(/^#{1,4}\s*(.+)$/gm, '<strong>$1</strong>');
  html = html.replace(/^\s*[-*]\s+/gm, '• ');
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}
