<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.camera">GREEN</title>
  <!-- Theme flash prevention -->
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/camera.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    .ctx-box { display: flex; flex-direction: column; gap: var(--sp-3); padding-bottom: var(--sp-4); border-bottom: 1px solid var(--border-subtle); }
    .check-row { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--text-sm); color: var(--text-secondary); cursor: pointer; }
    .check-row input { width: 16px; height: 16px; accent-color: var(--brand-primary); }
    .gps-info { font-size: var(--text-xs); color: var(--text-muted); }
    .auto-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; font-size: var(--text-sm); color: var(--text-secondary); }
    .auto-row select { width: auto; height: 32px; padding: 0 var(--sp-2); }
    .warn-box { font-size: var(--text-xs); line-height: 1.5; padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-md);
                background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.3); color: #92400E; }
    [data-theme="dark"] .warn-box { color: #FCD34D; }
    .err-box { font-size: var(--text-xs); line-height: 1.5; padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-md);
               background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.2); color: var(--color-error); }
    .queue-card { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
    .queue-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border-subtle); }
    .queue-card-hdr h3 { margin: 0; font-size: var(--text-base); }
    .queue-list { list-style: none; margin: 0; padding: var(--sp-2) var(--sp-5); }
    .queue-item { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
    .queue-item:last-child { border-bottom: none; }
    .queue-item img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--radius-sm, 6px); flex: none; background: var(--bg-muted); }
    .queue-item .qi-main { flex: 1; min-width: 0; }
    .queue-item .qi-status { font-size: var(--text-xs); font-weight: 600; }
    .queue-item .qi-status.failed { color: var(--color-error); }
    .queue-item .qi-status.pending { color: var(--color-warning); }
    .queue-item .qi-err { font-size: var(--text-xs); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-empty { padding: var(--sp-4) var(--sp-5); font-size: var(--text-sm); color: var(--text-muted); }
    .capture-btn { width: 100%; }
    #resultBody .empty-state { padding: var(--sp-8) var(--sp-5); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
<div class="app-main" id="appMain">
<main class="app-content" id="appContent">

  <!-- ══ BANNER ══════════════════════════════════════════════ -->
  <div class="page-banner" style="
    background: linear-gradient(135deg, var(--brand-darker) 0%, var(--brand-dark) 60%, var(--brand-mid) 100%);
    border-radius: var(--radius-lg); padding: var(--sp-8); margin-bottom: var(--sp-6);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: var(--sp-6); overflow: hidden; position: relative;">
    <div style="position:absolute;width:260px;height:260px;background:rgba(255,255,255,.05);border-radius:50%;right:-40px;top:-80px;pointer-events:none;"></div>
    <div style="position:relative;z-index:1;min-width:0;">
      <span style="font-size:var(--text-xs);font-weight:var(--weight-semibold);text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.7);" data-i18n="camera.banner_kicker"></span>
      <h2 style="font-size:var(--text-2xl);font-weight:var(--weight-extrabold);color:#fff;margin:var(--sp-2) 0;letter-spacing:-.02em;" data-i18n="camera.banner_title"></h2>
      <p style="font-size:var(--text-sm);color:rgba(255,255,255,.85);margin:0;max-width:560px;line-height:var(--leading-relaxed);" data-i18n="camera.banner_text"></p>
    </div>
    <a href="/history" class="btn-banner btn-banner-secondary" style="position:relative;z-index:1;" data-i18n="camera.view_history"></a>
  </div>

  <!-- ══ STATUS ROW ══════════════════════════════════════════ -->
  <div class="rover-status-row">
    <div class="rover-stat">
      <div class="rover-stat-icon kpi-icon-green">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </div>
      <div>
        <div class="rover-stat-label" data-i18n="camera.status.network"></div>
        <div class="rover-stat-value"><span class="conn-dot off" id="netDot"></span> <span id="netLabel">—</span></div>
      </div>
    </div>
    <div class="rover-stat">
      <div class="rover-stat-icon kpi-icon-orange">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
      </div>
      <div>
        <div class="rover-stat-label" data-i18n="camera.status.queue"></div>
        <div class="rover-stat-value" id="queueStat" aria-live="polite">—</div>
      </div>
    </div>
    <div class="rover-stat">
      <div class="rover-stat-icon kpi-icon-blue">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div>
        <div class="rover-stat-label" data-i18n="camera.status.last"></div>
        <div class="rover-stat-value" id="statLast">—</div>
      </div>
    </div>
  </div>

  <!-- ══ MAIN GRID ═══════════════════════════════════════════ -->
  <div class="rover-grid">

    <!-- LEFT — capture controls -->
    <aside class="control-panel">
      <div class="control-panel-header"><h3 data-i18n="camera.panel_title"></h3></div>
      <div class="control-panel-body">

        <!-- Context attached to every capture -->
        <div class="ctx-box">
          <div>
            <label class="f-lbl" for="parcelSelect" data-i18n="camera.parcel"></label>
            <select id="parcelSelect" class="device-select">
              <option value="" data-i18n="camera.no_parcel"></option>
            </select>
          </div>
          <div id="missionBox" hidden>
            <label class="f-lbl" for="missionSelect" data-i18n="camera.mission"></label>
            <select id="missionSelect" class="device-select">
              <option value="" data-i18n="camera.no_mission"></option>
            </select>
          </div>
          <div id="cellBox" hidden>
            <label class="f-lbl" for="cellInput" data-i18n="camera.cell"></label>
            <div class="auto-row">
              <input type="number" id="cellInput" class="form-input" min="1" style="width:90px;" />
              <span id="cellTotal" class="gps-info"></span>
              <button type="button" class="btn" id="nextCellBtn" style="font-size:var(--text-xs);" data-i18n="camera.next_cell"></button>
            </div>
            <label class="check-row" style="margin-top:var(--sp-2);"><input type="checkbox" id="autoAdvance" checked /> <span data-i18n="camera.auto_advance"></span></label>
            <div class="gps-info" data-i18n="camera.cell_hint"></div>
          </div>
          <label class="check-row"><input type="checkbox" id="gpsToggle" /> <span data-i18n="camera.attach_gps"></span></label>
          <div class="gps-info" id="gpsInfo"></div>
        </div>

        <!-- Mode selector -->
        <div>
          <span class="f-lbl" data-i18n="camera.mode_label"></span>
          <div class="mode-tabs" role="tablist">
            <button type="button" class="mode-tab active" id="tabDevice" data-mode="device" role="tab" data-i18n="camera.modes.device"></button>
            <button type="button" class="mode-tab" id="tabPhotos" data-mode="photos" role="tab" data-i18n="camera.modes.photos"></button>
            <button type="button" class="mode-tab" id="tabRover" data-mode="rover" role="tab" data-i18n="camera.modes.rover"></button>
          </div>
        </div>

        <!-- DEVICE CAMERA -->
        <div id="sectionDevice" class="mode-section" style="display:flex;flex-direction:column;gap:var(--sp-3);">
          <div class="camera-note" data-i18n="camera.device.note"></div>
          <div id="camError" class="err-box" style="display:none;" role="alert"></div>
          <div>
            <label class="f-lbl" for="deviceSelect" data-i18n="camera.device.select"></label>
            <div class="device-row">
              <select class="device-select" id="deviceSelect"></select>
            </div>
          </div>
          <button type="button" class="cam-btn connect-btn" id="permBtn" data-i18n="camera.device.permission"></button>
          <button type="button" class="connect-btn primary" id="startCamBtn" data-i18n="camera.device.start"></button>
          <button type="button" class="connect-btn" id="stopCamBtn" style="display:none;" data-i18n="camera.device.stop"></button>
        </div>

        <!-- PHOTOS -->
        <div id="sectionPhotos" class="mode-section" style="display:none;">
          <label class="upload-zone" id="uploadZone">
            <input type="file" id="uploadInput" accept="image/jpeg,image/png,image/webp" multiple />
            <p data-i18n="camera.photos.drop"></p>
            <p class="up-hint" data-i18n="camera.photos.hint"></p>
          </label>
        </div>

        <!-- ROVER STREAM -->
        <div id="sectionRover" class="mode-section" style="display:none;flex-direction:column;gap:var(--sp-3);">
          <div class="warn-box" id="httpsWarning" style="display:none;" data-i18n="camera.rover.https_warning"></div>
          <div class="camera-note" data-i18n="camera.rover.note"></div>
          <div>
            <label class="f-lbl" for="camIp" data-i18n="camera.rover.ip"></label>
            <div class="ip-row">
              <input type="text" id="camIp" class="form-input" inputmode="decimal" placeholder="192.168.10.1" style="font-family:var(--font-mono);" />
              <input type="number" id="camPort" class="form-input port-input" placeholder="8080" min="1" max="65535" />
            </div>
          </div>
          <div id="roverError" class="err-box" style="display:none;" role="alert"></div>
          <button type="button" class="connect-btn primary" id="startRoverBtn" data-i18n="camera.rover.start"></button>
          <button type="button" class="connect-btn" id="stopRoverBtn" style="display:none;" data-i18n="camera.rover.stop"></button>
        </div>

        <!-- Capture (device camera and rover) -->
        <div id="captureBox" style="display:none;flex-direction:column;gap:var(--sp-3);border-top:1px solid var(--border-subtle);padding-top:var(--sp-4);">
          <button type="button" class="connect-btn primary capture-btn" id="captureBtn" data-i18n="camera.capture"></button>
          <label class="auto-row">
            <input type="checkbox" id="autoToggle" />
            <span data-i18n="camera.auto"></span>
            <select id="autoInterval" class="form-input">
              <option value="10"></option><option value="20"></option><option value="30" selected></option><option value="60"></option>
            </select>
          </label>
        </div>

      </div>
    </aside>

    <!-- RIGHT — preview, result, local queue -->
    <section class="viewer-panel">

      <div class="feed-card">
        <div class="feed-card-header">
          <h3 data-i18n="camera.viewer"></h3>
          <span class="live-badge hidden" id="liveBadge"><span class="rec-dot"></span> <span data-i18n="camera.live"></span></span>
        </div>
        <div class="viewport" id="viewport">
          <div class="vp-placeholder" id="vpPlaceholder"><p id="vpHint"></p></div>
          <img class="stream-img" id="streamImg" alt="" crossorigin="anonymous" />
          <video class="cam-video" id="camVideo" autoplay playsinline muted></video>
          <canvas class="capture-canvas" id="captureCanvas"></canvas>
          <div class="analysing-overlay" id="analysingOverlay"><div class="spin-ring"></div><span data-i18n="camera.sending"></span></div>
        </div>
      </div>

      <div class="results-card" id="resultsCard" style="display:block;">
        <div class="results-card-header">
          <h3 data-i18n="camera.result_title"></h3>
          <a href="/history" id="resultHistoryLink" style="font-size:var(--text-xs);color:var(--brand-primary);font-weight:var(--weight-semibold);text-decoration:none;" data-i18n="camera.view_history"></a>
        </div>
        <div id="resultBody" aria-live="polite">
          <div class="empty-state"><p data-i18n="camera.result_empty"></p></div>
        </div>
      </div>

      <div class="queue-card">
        <div class="queue-card-hdr">
          <h3 data-i18n="camera.queue.title"></h3>
          <button type="button" class="btn" id="retryAllBtn" style="display:none;font-size:var(--text-sm);" data-i18n="camera.queue.retry_all"></button>
        </div>
        <ul class="queue-list" id="queueList"></ul>
        <div class="queue-empty" id="queueEmpty" data-i18n="camera.queue.empty"></div>
      </div>

    </section>

    <!-- FULL WIDTH — recent analyses -->
    <div class="recent-section">
      <div class="recent-section-hdr">
        <h3 data-i18n="camera.recent"></h3>
        <a href="/history" style="font-size:var(--text-xs);color:var(--brand-primary);font-weight:var(--weight-semibold);text-decoration:none;"><span data-i18n="common.actions.view_all"></span> →</a>
      </div>
      <div class="rv-tbl-scroll table-scroll">
        <table class="rv-tbl" id="recentTbl" style="display:none;">
          <thead>
            <tr>
              <th data-i18n="history.col_result"></th>
              <th data-i18n="history.col_plant"></th>
              <th data-i18n="history.col_confidence"></th>
              <th data-i18n="history.col_alert"></th>
              <th data-i18n="history.col_source"></th>
              <th data-i18n="history.col_date"></th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
      <div id="recentEmpty" class="empty-state" style="padding:var(--sp-8);"><p data-i18n="camera.recent_empty"></p></div>
    </div>

  </div><!-- /rover-grid -->

</main>
</div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/fiche.js"></script>
<script src="/js/upload-queue.js"></script>
<script>
/* ============================================================
   Camera analysis — page controller
   Every capture goes through UploadQueue (IndexedDB): it is kept on the
   device and sent when the network allows (prémisse P1-a).
   ============================================================ */
Layout.init({ page: 'camera', titleKey: 'nav.camera', subtitleKey: 'camera.subtitle' });

const $ = id => document.getElementById(id);
const S = {
  mode: 'device',
  stream: null,          // MediaStream of the device camera
  roverOn: false,
  autoTimer: null,
  position: null,        // last GeolocationPosition
  watchId: null,
  lastResult: null,      // last analysis (for re-render)
  recent: null,
};
const objectUrls = new Map();   // queue item id → preview URL

document.addEventListener('DOMContentLoaded', () => {
  let ip = null, port = null;
  try { ip = localStorage.getItem('green_pref_default_ip'); port = localStorage.getItem('green_pref_default_port'); } catch (_) {}
  $('camIp').value = ip || '192.168.10.1';
  $('camPort').value = port || '8080';
  $('httpsWarning').style.display = location.protocol === 'https:' ? '' : 'none';

  document.querySelectorAll('.mode-tab').forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));
  $('permBtn').addEventListener('click', requestCameraPermission);
  $('startCamBtn').addEventListener('click', startCamera);
  $('stopCamBtn').addEventListener('click', stopCamera);
  $('startRoverBtn').addEventListener('click', startRover);
  $('stopRoverBtn').addEventListener('click', stopRover);
  $('captureBtn').addEventListener('click', captureFrame);
  $('autoToggle').addEventListener('change', updateAuto);
  $('autoInterval').addEventListener('change', updateAuto);
  $('gpsToggle').addEventListener('change', toggleGps);
  $('uploadInput').addEventListener('change', e => queueFiles(e.target.files));
  $('retryAllBtn').addEventListener('click', () => UploadQueue.retryFailed());
  $('missionSelect').addEventListener('change', () => { $('cellInput').value = ''; onMissionChange(); });
  $('nextCellBtn').addEventListener('click', nextCell);
  const zone = $('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); queueFiles(e.dataTransfer.files); });

  UploadQueue.on('changed', renderQueue);
  UploadQueue.on('sending', () => $('analysingOverlay').classList.add('active'));
  UploadQueue.on('uploaded', ({ response }) => {
    $('analysingOverlay').classList.remove('active');
    S.lastResult = Fiche.fromUpload(response);
    renderResult();
    $('statLast').textContent = I18n.dateTime(new Date());
    loadRecent();
  });
  UploadQueue.on('retry', () => $('analysingOverlay').classList.remove('active'));
  UploadQueue.on('failed', item => {
    $('analysingOverlay').classList.remove('active');
    App.toast(item.last_error || I18n.t('common.errors.generic'), 'error');
  });
  window.addEventListener('online', renderNetwork);
  window.addEventListener('offline', renderNetwork);

  renderStatic();
  renderNetwork();
  renderQueue();
  switchMode('device');
  loadParcels();
  listDevices();
  loadRecent();
  UploadQueue.process();
});

window.addEventListener('languageChanged', () => {
  renderStatic();
  renderNetwork();
  renderQueue();
  renderResult();
  renderRecent();
  renderGps();
  onMissionChange();
  $('vpHint').textContent = I18n.t(`camera.vp_hint.${S.mode}`);
});

/* ---- Static labels built in JS ------------------------------ */
function renderStatic() {
  [...$('autoInterval').options].forEach(o => { o.textContent = I18n.t('camera.seconds', { n: o.value }); });
  const sel = $('deviceSelect');
  if (!sel.options.length || !sel.value) {
    [...sel.options].forEach((o, i) => { if (!o.dataset.label) o.textContent = I18n.t('camera.device.default_label', { n: i + 1 }); });
  }
}

/* ---- Network & queue status --------------------------------- */
function renderNetwork() {
  $('netDot').className = `conn-dot ${navigator.onLine ? 'on' : 'off'}`;
  $('netLabel').textContent = I18n.t(navigator.onLine ? 'camera.status.online' : 'camera.status.offline');
}

async function renderQueue() {
  let items = [];
  try { items = await UploadQueue.all(); } catch (_) { /* IndexedDB unavailable */ }
  const pending = items.filter(i => i.status === 'pending').length;
  const failed = items.filter(i => i.status === 'failed').length;
  $('queueStat').textContent = I18n.t('camera.status.queue_value', { count: pending })
    + (failed ? ` · ${I18n.t('camera.status.queue_failed', { count: failed })}` : '');
  $('retryAllBtn').style.display = items.length ? '' : 'none';
  $('queueEmpty').style.display = items.length ? 'none' : '';

  // free previews of items that are gone
  for (const [id, url] of objectUrls) {
    if (!items.some(i => i.id === id)) { URL.revokeObjectURL(url); objectUrls.delete(id); }
  }
  const list = $('queueList');
  list.innerHTML = '';
  items.sort((a, b) => a.created - b.created).forEach(item => {
    if (!objectUrls.has(item.id)) objectUrls.set(item.id, URL.createObjectURL(item.blob));
    const li = document.createElement('li');
    li.className = 'queue-item';
    li.innerHTML = `
      <img src="${objectUrls.get(item.id)}" alt="" />
      <div class="qi-main">
        <div class="qi-status ${item.status}">${escapeHtml(I18n.t(`camera.queue.${item.status}`))}</div>
        <div class="qi-err">${escapeHtml(item.status === 'failed' && item.last_error ? item.last_error
          : I18n.t('camera.queue.captured_at', { date: I18n.dateTime(item.meta.captured_at) }))}</div>
      </div>
      <button type="button" class="btn" style="font-size:var(--text-xs);">${escapeHtml(I18n.t('camera.queue.delete'))}</button>`;
    li.querySelector('button').addEventListener('click', () => UploadQueue.remove(item.id));
    list.appendChild(li);
  });
}

/* ---- Context: parcel + GPS ----------------------------------- */
async function loadParcels() {
  const { data } = await API.parcels.list();
  const sel = $('parcelSelect');
  (Array.isArray(data) ? data : []).forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    sel.appendChild(o);
  });
  const q = new URLSearchParams(location.search);
  if (q.get('parcel_id')) sel.value = q.get('parcel_id');
  sel.addEventListener('change', () => loadMissions(null));
  await loadMissions(q.get('mission_id'));
}

/* Missions of the chosen parcel: images are tagged with mission + cell */
let missions = [];
async function loadMissions(wanted) {
  const parcel = $('parcelSelect').value;
  const sel = $('missionSelect');
  sel.querySelectorAll('option:not([value=""])').forEach(o => o.remove());
  missions = [];
  if (parcel) {
    const { data } = await API.missions.list(parcel);
    missions = Array.isArray(data) ? data : [];
  }
  missions.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.name || `#${m.id}`;
    sel.appendChild(o);
  });
  $('missionBox').hidden = !missions.length;
  if (wanted && missions.some(m => String(m.id) === String(wanted))) sel.value = wanted;
  onMissionChange();
}

function currentMission() {
  return missions.find(m => String(m.id) === $('missionSelect').value) || null;
}

function onMissionChange() {
  const m = currentMission();
  $('cellBox').hidden = !m;
  if (m) {
    $('cellInput').max = m.cells_total;
    $('cellTotal').textContent = I18n.t('camera.cell_of', { n: m.cells_total });
    if (!$('cellInput').value) $('cellInput').value = 1;
  } else {
    $('cellInput').value = '';
  }
}

function nextCell() {
  const m = currentMission();
  const v = parseInt($('cellInput').value, 10) || 0;
  if (m && v < m.cells_total) $('cellInput').value = v + 1;
}

function toggleGps() {
  if ($('gpsToggle').checked && navigator.geolocation) {
    S.watchId = navigator.geolocation.watchPosition(
      pos => { S.position = pos; renderGps(); },
      () => { S.position = null; renderGps(true); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  } else {
    if (S.watchId !== null) navigator.geolocation.clearWatch(S.watchId);
    S.watchId = null;
    S.position = null;
    renderGps();
  }
}

function renderGps(failed) {
  const el = $('gpsInfo');
  if (!$('gpsToggle').checked) { el.textContent = ''; return; }
  if (S.position) el.textContent = I18n.t('camera.gps_accuracy', { m: Math.round(S.position.coords.accuracy) });
  else el.textContent = failed ? I18n.t('camera.gps_unavailable') : I18n.t('common.loading');
}

function captureMeta(source) {
  const meta = { source };
  const parcel = $('parcelSelect').value;
  if (parcel) meta.parcel_id = parcel;
  const mission = currentMission();
  if (mission) {
    meta.mission_id = mission.id;
    const cell = parseInt($('cellInput').value, 10);
    if (cell >= 1 && cell <= mission.cells_total) meta.cell_index = cell;
  }
  if ($('gpsToggle').checked && S.position) {
    meta.latitude = S.position.coords.latitude.toFixed(7);
    meta.longitude = S.position.coords.longitude.toFixed(7);
  }
  return meta;
}

async function enqueue(blob, source) {
  try {
    await UploadQueue.add(blob, captureMeta(source));
    if (currentMission() && $('autoAdvance').checked && source !== 'upload') nextCell();
    App.toast(I18n.t(navigator.onLine ? 'camera.captured' : 'camera.queued_offline'), 'info', 2500);
  } catch (e) {
    App.toast(I18n.t('common.errors.generic'), 'error');
  }
}

/* ---- Modes ----------------------------------------------------- */
function switchMode(m) {
  if (S.mode !== m) { stopCamera(); stopRover(); }
  S.mode = m;
  for (const [mode, id] of [['device', 'Device'], ['photos', 'Photos'], ['rover', 'Rover']]) {
    $(`tab${id}`).classList.toggle('active', mode === m);
    $(`tab${id}`).setAttribute('aria-selected', mode === m ? 'true' : 'false');
    $(`section${id}`).style.display = mode === m ? 'flex' : 'none';
  }
  $('sectionPhotos').style.display = m === 'photos' ? 'block' : 'none';
  $('vpHint').textContent = I18n.t(`camera.vp_hint.${m}`);
  updateCaptureBox();
}

function updateCaptureBox() {
  const live = (S.mode === 'device' && S.stream) || (S.mode === 'rover' && S.roverOn);
  $('captureBox').style.display = live ? 'flex' : 'none';
  $('liveBadge').classList.toggle('hidden', !live);
  if (!live) { $('autoToggle').checked = false; updateAuto(); }
}

function updateAuto() {
  clearInterval(S.autoTimer);
  S.autoTimer = null;
  if ($('autoToggle').checked) {
    S.autoTimer = setInterval(captureFrame, parseInt($('autoInterval').value, 10) * 1000);
  }
}

/* ---- Device camera ------------------------------------------- */
function showCamError(key) {
  $('camError').textContent = key ? I18n.t(key) : '';
  $('camError').style.display = key ? '' : 'none';
}

async function listDevices() {
  const sel = $('deviceSelect');
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    sel.innerHTML = '';
    cams.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId;
      if (d.label) { o.textContent = d.label; o.dataset.label = '1'; }
      else o.textContent = I18n.t('camera.device.default_label', { n: i + 1 });
      sel.appendChild(o);
    });
    // labels are only exposed once the permission is granted
    $('permBtn').style.display = cams.length && cams[0].label ? 'none' : '';
  } catch (_) {
    $('permBtn').style.display = '';
  }
}

async function requestCameraPermission() {
  showCamError(null);
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    tmp.getTracks().forEach(t => t.stop());
    await listDevices();
  } catch (e) {
    showCamError(e.name === 'NotAllowedError' ? 'camera.device.denied'
      : e.name === 'NotFoundError' ? 'camera.device.not_found' : 'camera.device.error');
  }
}

async function startCamera() {
  showCamError(null);
  const id = $('deviceSelect').value;
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video: id ? { deviceId: { exact: id } } : { facingMode: 'environment' }, audio: false });
  } catch (e) {
    showCamError(e.name === 'NotAllowedError' ? 'camera.device.denied'
      : e.name === 'NotFoundError' ? 'camera.device.not_found' : 'camera.device.error');
    return;
  }
  const video = $('camVideo');
  video.srcObject = S.stream;
  video.style.display = 'block';
  $('vpPlaceholder').style.display = 'none';
  $('startCamBtn').style.display = 'none';
  $('stopCamBtn').style.display = '';
  listDevices();
  updateCaptureBox();
}

function stopCamera() {
  if (S.stream) S.stream.getTracks().forEach(t => t.stop());
  S.stream = null;
  $('camVideo').srcObject = null;
  $('camVideo').style.display = 'none';
  $('startCamBtn').style.display = '';
  $('stopCamBtn').style.display = 'none';
  if (S.mode === 'device') $('vpPlaceholder').style.display = 'flex';
  updateCaptureBox();
}

/* ---- Rover stream (local network only) ----------------------- */
function showRoverError(key) {
  $('roverError').textContent = key ? I18n.t(key) : '';
  $('roverError').style.display = key ? '' : 'none';
}

function startRover() {
  showRoverError(null);
  const ip = $('camIp').value.trim();
  const port = $('camPort').value.trim() || '8080';
  if (!ip) return;
  const img = $('streamImg');
  img.onerror = () => { if (S.roverOn) { stopRover(); showRoverError('camera.rover.lost'); } };
  img.onload = () => { $('vpPlaceholder').style.display = 'none'; };
  img.src = `http://${ip}:${port}/?t=${Date.now()}`;
  img.style.display = 'block';
  S.roverOn = true;
  $('startRoverBtn').style.display = 'none';
  $('stopRoverBtn').style.display = '';
  updateCaptureBox();
}

function stopRover() {
  S.roverOn = false;
  const img = $('streamImg');
  img.onerror = null;
  img.removeAttribute('src');
  img.style.display = 'none';
  $('startRoverBtn').style.display = '';
  $('stopRoverBtn').style.display = 'none';
  if (S.mode === 'rover') $('vpPlaceholder').style.display = 'flex';
  updateCaptureBox();
}

/* ---- Capture ------------------------------------------------- */
async function captureFrame() {
  const source = S.mode === 'rover' ? 'rover' : 'camera';
  const el = source === 'rover' ? $('streamImg') : $('camVideo');
  const w = el.videoWidth || el.naturalWidth;
  const h = el.videoHeight || el.naturalHeight;
  if (!w || !h) return;   // nothing displayed yet: never send an empty frame
  const canvas = $('captureCanvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(el, 0, 0, w, h);
  let blob;
  try {
    blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('empty')), 'image/jpeg', 0.9));
  } catch (e) {
    // tainted canvas: the rover does not send CORS headers
    if (source === 'rover') showRoverError('camera.rover.cors');
    $('autoToggle').checked = false;
    updateAuto();
    return;
  }
  enqueue(blob, source);
}

function queueFiles(files) {
  const images = [...(files || [])].filter(f => f.type.startsWith('image/'));
  images.forEach(f => enqueue(f, 'upload'));
  if (images.length) App.toast(I18n.t('camera.photos.added', { count: images.length }), 'info', 2500);
  $('uploadInput').value = '';
}

/* ---- Results --------------------------------------------------- */
function renderResult() {
  if (!S.lastResult) return;
  $('resultBody').innerHTML = Fiche.html(S.lastResult);
  $('resultHistoryLink').href = `/history?id=${encodeURIComponent(S.lastResult.id)}`;
}

async function loadRecent() {
  const { data, error } = await API.analysis.history(5, 0);
  S.recent = error ? null : (data && data.items) || [];
  renderRecent();
}

function renderRecent() {
  const items = S.recent || [];
  $('recentTbl').style.display = items.length ? '' : 'none';
  $('recentEmpty').style.display = items.length ? 'none' : '';
  $('recentBody').innerHTML = items.map(a => {
    const level = alertLevel(a);
    return `<tr>
      <td class="${isHealthy(a) ? 'td-healthy' : 'td-primary'}"><a href="/history?id=${encodeURIComponent(a.id)}" style="color:inherit;">${escapeHtml(analysisLabel(a))}</a></td>
      <td class="td-muted">${escapeHtml(plantLabel(a.plant_type))}</td>
      <td class="td-muted">${a.confidence != null ? escapeHtml(I18n.percent(a.confidence)) : '—'}</td>
      <td><span class="sev-tag ${level}">${escapeHtml(alertLabel(level, true))}</span></td>
      <td class="td-muted">${escapeHtml(I18n.t(`fiche.sources.${a.source || 'upload'}`))}</td>
      <td class="td-muted" style="white-space:nowrap;">${escapeHtml(I18n.dateTime(a.created_at))}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
