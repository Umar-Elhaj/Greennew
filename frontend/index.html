<!DOCTYPE html>
<html lang="fr">
<!--
  GREEN App — Login Page
  Entry point of the platform. Users sign in with phone/email + password.
  Theme is applied immediately (before render) via utils.js to prevent flash.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.login">GREEN</title>
  <meta name="description" content="Connectez-vous à GREEN, la plateforme d'intelligence agricole pour les exploitations camerounaises." />

  <!-- Favicon (using the logo) -->
  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <!-- Apply theme before DOM renders to avoid flash of wrong theme -->
  <script>
    (function () {
      const saved = localStorage.getItem('green_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <div class="auth-page">

    <!-- Language selector (top right) -->
    <div class="auth-lang-switch">
      <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_switch_aria">
        <button type="button" class="lang-switch-btn" data-lang="fr" lang="fr" title="Français">FR</button>
        <button type="button" class="lang-switch-btn" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </div>

    <style>
      /* Stronger login-page branding sizing */
      .auth-page .auth-logo img {
        width: 4.25rem !important;
        height: 4.25rem !important;
        min-width: 4.25rem;
      }
      .auth-page .auth-logo-name {
        font-size: 2.5rem !important;
        line-height: 1;
      }
    </style>

    <!-- =========================================================
         LEFT PANEL — Branding & Value Proposition
         ========================================================= -->
    <aside class="auth-left" aria-hidden="true">
      <!-- Subtle grid pattern overlay -->
      <div class="auth-left-pattern"></div>

      <div class="auth-left-content">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/logo.png" alt="GREEN" />
          <span class="auth-logo-name">GREEN</span>
        </div>

        <!-- Headline section -->
        <div class="auth-headline">
          <div class="auth-tag">
            <span class="auth-tag-dot"></span>
            <span data-i18n="auth.panel.tag">Plateforme agricole d'IA</span>
          </div>

          <h1 class="auth-title">
            <span data-i18n="auth.panel.title_1">L'agriculture de précision</span><br />
            <span data-i18n="auth.panel.title_2">pour les champs d'Afrique.</span>
          </h1>

          <p class="auth-subtitle" data-i18n="auth.panel.subtitle"></p>

          <!-- Feature list -->
          <div class="auth-features">
            <div class="auth-feature">
              <div class="auth-feature-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 7l-7 5 7 5V7z"/>
                  <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_camera_title"></h4>
                <p data-i18n="auth.panel.feature_camera_text"></p>
              </div>
            </div>

            <div class="auth-feature">
              <div class="auth-feature-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_map_title"></h4>
                <p data-i18n="auth.panel.feature_map_text"></p>
              </div>
            </div>

            <div class="auth-feature">
              <div class="auth-feature-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"/>
                  <line x1="12" y1="20" x2="12" y2="4"/>
                  <line x1="6"  y1="20" x2="6"  y2="14"/>
                </svg>
              </div>
              <div class="auth-feature-text">
                <h4 data-i18n="auth.panel.feature_dashboard_title"></h4>
                <p data-i18n="auth.panel.feature_dashboard_text"></p>
              </div>
            </div>
          </div><!-- /auth-features -->
        </div><!-- /auth-headline -->

      </div><!-- /auth-left-content -->
    </aside>

    <!-- =========================================================
         RIGHT PANEL — Login Form
         ========================================================= -->
    <main class="auth-right">
      <div class="auth-card">

        <!-- Mobile logo (visible only when left panel is hidden) -->
        <div class="auth-mobile-logo">
          <img src="assets/logo.png" alt="GREEN" />
          <span class="auth-mobile-logo-name">GREEN</span>
        </div>

        <!-- Card header -->
        <div class="auth-card-header">
          <h2 class="auth-greeting" data-i18n="auth.login.greeting"></h2>
          <p class="auth-description" data-i18n="auth.login.description"></p>
        </div>

        <!-- Global alert (shown on API error or success) -->
        <div id="loginAlert" class="alert" style="display:none;" role="alert"></div>

        <!-- Login form -->
        <form id="loginForm" class="auth-form" novalidate>

          <!-- Identifier: phone or email -->
          <div class="form-group">
            <label class="form-label" for="identifier" data-i18n="auth.login.identifier"></label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input
                type="text"
                id="identifier"
                name="identifier"
                class="form-input"
                data-i18n-placeholder="auth.login.identifier_placeholder"
                autocomplete="username"
                autocapitalize="off"
                spellcheck="false"
                required
              />
            </div>
            <span id="identifier_error" class="field-error"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password" data-i18n="auth.login.password"></label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input has-action"
                data-i18n-placeholder="auth.login.password_placeholder"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="input-action"
                data-i18n-aria-label="auth.show_password"
              >
                <svg class="icon-eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span id="password_error" class="field-error"></span>
          </div>

          <!-- Submit button -->
          <button
            type="submit"
            id="loginSubmitBtn"
            class="btn btn-primary btn-full btn-submit"
          >
            <span class="spinner"></span>
            <span class="btn-text" data-i18n="auth.login.submit"></span>
          </button>

        </form><!-- /loginForm -->

        <!-- Sign up redirect -->
        <p class="auth-footer">
          <span data-i18n="auth.login.no_account"></span>
          <a href="/register" data-i18n="auth.login.create_one"></a>
        </p>

      </div><!-- /auth-card -->
    </main>

  </div><!-- /auth-page -->

  <!-- Scripts (load after DOM) -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
