<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.benchmark">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <style>
    .prog-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
    .prog-kpi { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-5); }
    .prog-kpi-label { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .prog-kpi-value { font-size: var(--text-2xl); font-weight: 800; color: var(--text-primary); margin: var(--sp-2) 0; }
    .prog-kpi-value.small { font-size: var(--text-base); font-weight: 700; }
    .prog-kpi-sub { font-size: var(--text-xs); color: var(--text-muted); }
    .prog-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-6); }
    .prog-card { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-5); min-width: 0; }
    .prog-card h3 { font-size: var(--text-sm); margin: 0 0 var(--sp-4); color: var(--text-primary); }
    .prog-chart { position: relative; height: 240px; }
    .prog-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .prog-table th { text-align: left; font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border-subtle); }
    .prog-table td { padding: var(--sp-3); border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); }
    .prog-empty { background: var(--surface-1); border: 1px dashed var(--border-default); border-radius: var(--radius-lg); padding: var(--sp-8); text-align: center; color: var(--text-muted); margin-bottom: var(--sp-6); }
    .prog-method { font-size: var(--text-xs); color: var(--text-muted); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <div class="page-banner" style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-6);position:relative;overflow:hidden;">
        <div style="position:absolute;width:280px;height:280px;background:rgba(255,255,255,.05);border-radius:50%;right:-50px;top:-80px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="benchmark.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="benchmark.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.75);" data-i18n="benchmark.banner_text"></div>
        </div>
      </div>

      <div class="prog-empty" id="progEmpty" style="display:none;"></div>

      <div id="progContent" style="display:none;">
        <div class="prog-kpis">
          <div class="prog-kpi">
            <div class="prog-kpi-label" data-i18n="benchmark.this_month"></div>
            <div class="prog-kpi-value" id="kThisMonth">—</div>
            <div class="prog-kpi-sub" id="kThisMonthSub"></div>
          </div>
          <div class="prog-kpi">
            <div class="prog-kpi-label" data-i18n="benchmark.disease_rate"></div>
            <div class="prog-kpi-value" id="kRate">—</div>
            <div class="prog-kpi-sub" id="kRateSub"></div>
          </div>
          <div class="prog-kpi">
            <div class="prog-kpi-label" data-i18n="benchmark.top_disease"></div>
            <div class="prog-kpi-value small" id="kTop">—</div>
            <div class="prog-kpi-sub" id="kTopSub"></div>
          </div>
          <div class="prog-kpi">
            <div class="prog-kpi-label" data-i18n="benchmark.parcels"></div>
            <div class="prog-kpi-value" id="kParcels">—</div>
            <div class="prog-kpi-sub" data-i18n="benchmark.parcels_hint"></div>
          </div>
        </div>

        <div class="prog-charts">
          <div class="prog-card">
            <h3 data-i18n="benchmark.monthly_title"></h3>
            <div class="prog-chart"><canvas id="monthlyChart" role="img" data-i18n-aria-label="benchmark.monthly_title"></canvas></div>
          </div>
          <div class="prog-card">
            <h3 data-i18n="benchmark.rate_title"></h3>
            <div class="prog-chart"><canvas id="rateChart" role="img" data-i18n-aria-label="benchmark.rate_title"></canvas></div>
          </div>
        </div>

        <div class="prog-card" style="margin-bottom:var(--sp-4);">
          <h3 data-i18n="benchmark.plants_title"></h3>
          <div class="table-scroll">
            <table class="prog-table">
              <thead><tr><th data-i18n="benchmark.col_plant"></th><th data-i18n="benchmark.col_analyses"></th><th data-i18n="benchmark.col_rate"></th></tr></thead>
              <tbody id="plantRows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <p class="prog-method" data-i18n="benchmark.method"></p>

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'benchmark', titleKey: 'nav.benchmark', subtitleKey: 'benchmark.subtitle' });

const MIN_ANALYSES = 3;   // below this, show an explicit empty state instead of charts
let progress;             // undefined = loading, null = error
const charts = {};

document.addEventListener('DOMContentLoaded', async () => {
  const { data, error } = await API.dashboard.progress(6);
  progress = error ? null : data;
  render();
});
window.addEventListener('languageChanged', render);

function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return I18n.date(new Date(y, m - 1, 15), { month: 'short', year: '2-digit' });
}

function render() {
  if (progress === undefined) return;
  const empty = document.getElementById('progEmpty');
  const content = document.getElementById('progContent');
  if (!progress || progress.total < MIN_ANALYSES) {
    content.style.display = 'none';
    empty.style.display = '';
    empty.textContent = progress ? I18n.t('benchmark.empty', { count: progress.total }) : I18n.t('benchmark.error');
    return;
  }
  empty.style.display = 'none';
  content.style.display = '';

  const months = progress.months;
  const cur = months[months.length - 1];
  const prev = months.slice(0, -1);
  const prevTotal = prev.reduce((s, m) => s + m.analyses, 0);
  const prevDiseases = prev.reduce((s, m) => s + m.diseases, 0);
  const set = (id, v) => { document.getElementById(id).textContent = v; };

  set('kThisMonth', I18n.number(cur.analyses));
  set('kThisMonthSub', I18n.t('benchmark.vs_avg', { avg: I18n.number(prevTotal / prev.length, { maximumFractionDigits: 1 }) }));
  set('kRate', cur.analyses ? I18n.percent(cur.diseases / cur.analyses) : '—');
  set('kRateSub', I18n.t('benchmark.disease_rate_prev', { rate: prevTotal ? I18n.percent(prevDiseases / prevTotal) : '—' }));
  set('kTop', progress.top_disease ? classLabel(progress.top_disease.code) : I18n.t('benchmark.none'));
  set('kTopSub', progress.top_disease ? I18n.t('benchmark.top_disease_count', { count: progress.top_disease.count }) : '');
  set('kParcels', I18n.number(progress.parcels_analysed));

  document.getElementById('plantRows').innerHTML = progress.plants.map(p => `
    <tr>
      <td>${escapeHtml(plantLabel(p.plant))}</td>
      <td>${escapeHtml(I18n.number(p.analyses))}</td>
      <td>${escapeHtml(I18n.percent(p.diseases / p.analyses))}</td>
    </tr>`).join('');

  if (typeof Chart === 'undefined') { window.addEventListener('load', render, { once: true }); return; }
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const grid = isDark ? '#21262D' : '#F3F4F6';
  const tick = isDark ? '#8B949E' : '#6B7280';
  const labels = months.map(m => monthLabel(m.month));
  const common = {
    responsive: true, maintainAspectRatio: false, locale: I18n.locale,
    plugins: { legend: { labels: { color: tick, boxWidth: 12 } } },
  };
  Object.values(charts).forEach(c => c.destroy());

  charts.monthly = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: I18n.t('benchmark.diseases'), data: months.map(m => m.diseases), backgroundColor: 'rgba(239,68,68,.6)', stack: 's', borderRadius: 4 },
      { label: I18n.t('benchmark.healthy'), data: months.map(m => m.healthy), backgroundColor: 'rgba(46,204,113,.55)', stack: 's', borderRadius: 4 },
    ] },
    options: { ...common, scales: {
      x: { stacked: true, grid: { color: grid }, ticks: { color: tick } },
      y: { stacked: true, beginAtZero: true, grid: { color: grid }, ticks: { color: tick, precision: 0 } } } },
  });

  charts.rate = new Chart(document.getElementById('rateChart'), {
    type: 'line',
    data: { labels, datasets: [{
      label: I18n.t('benchmark.rate'),
      data: months.map(m => m.analyses ? Math.round(1000 * m.diseases / m.analyses) / 10 : null),
      borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,.1)', spanGaps: true, tension: .3, fill: true,
    }] },
    options: { ...common, plugins: { ...common.plugins, tooltip: { callbacks: { label: c => ' ' + I18n.percent(c.parsed.y / 100) } } },
      scales: {
        x: { grid: { color: grid }, ticks: { color: tick } },
        y: { min: 0, max: 100, grid: { color: grid }, ticks: { color: tick, callback: v => I18n.percent(v / 100) } } } },
  });
}
</script>
</body>
</html>
