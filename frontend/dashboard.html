<!DOCTYPE html>
<html lang="fr">
<!--
  GREEN App — Dashboard Page
  First inner page. Shows the full app shell (sidebar + header).
  Phase 2: layout only, skeleton placeholders.
  Phase 3: Real KPIs, charts, and live data.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.dashboard">GREEN</title>

  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />

  <!-- Prevent theme flash -->
  <script>
    (function () {
      const saved = localStorage.getItem('green_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <!-- Chart.js 4.4.0 (exact version, CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>

  <style>
    /* ---- Dashboard-specific styles ------------------------- */

    /* Welcome banner */
    .welcome-banner {
      background: linear-gradient(135deg, var(--brand-darker) 0%, var(--brand-dark) 60%, var(--brand-mid) 100%);
      border-radius: var(--radius-xl);
      padding: var(--sp-8) var(--sp-10);
      margin-bottom: var(--sp-8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-6);
      overflow: hidden;
      position: relative;
    }

    /* Decorative circle on banner */
    .welcome-banner::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      right: -60px;
      top: -80px;
      pointer-events: none;
    }
    .welcome-banner::after {
      content: '';
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
      right: 120px;
      bottom: -60px;
      pointer-events: none;
    }

    .welcome-text { position: relative; z-index: 1; }
    .welcome-greeting {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.65);
      font-weight: var(--weight-medium);
      margin-bottom: var(--sp-2);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .welcome-title {
      font-size: var(--text-3xl);
      font-weight: var(--weight-extrabold);
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: var(--sp-2);
    }
    .welcome-subtitle {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.60);
      line-height: var(--leading-relaxed);
      max-width: 480px;
    }

    /* Quick actions in welcome banner */
    .welcome-actions {
      display: flex;
      gap: var(--sp-3);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .btn-banner {
      height: 40px;
      padding: 0 var(--sp-5);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      border: none;
      transition: all var(--dur-base) var(--ease-out);
    }
    .btn-banner-primary {
      background: #ffffff;
      color: var(--brand-darker);
    }
    .btn-banner-primary:hover { background: rgba(255,255,255,0.90); transform: translateY(-1px); }
    .btn-banner-secondary {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.20);
    }
    .btn-banner-secondary:hover { background: rgba(255,255,255,0.20); transform: translateY(-1px); }

    /* ---- Section title ------------------------------------- */
    .section-title {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .section-title-line {
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    /* ---- Quick access tiles -------------------------------- */
    .quick-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--sp-4);
      margin-bottom: var(--sp-8);
    }
    .quick-tile {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      text-decoration: none;
      cursor: pointer;
      transition:
        border-color var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out),
        transform var(--dur-base) var(--ease-out);
    }
    .quick-tile:hover {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-glow-lg);
      transform: translateY(-2px);
    }
    .quick-tile-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quick-tile-label {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }
    .quick-tile-desc {
      font-size: var(--text-xs);
      color: var(--text-muted);
      line-height: var(--leading-relaxed);
    }

    /* ---- Charts area --------------------------------------- */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: var(--sp-6);
      margin-bottom: var(--sp-8);
    }
    @media (max-width: 1100px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-container {
      position: relative;
      height: 240px;
    }

    /* ---- Recent activity table ----------------------------- */
    .activity-table { width: 100%; border-collapse: collapse; }
    .activity-table th {
      text-align: left;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0 var(--sp-4) var(--sp-3);
      border-bottom: 1px solid var(--border-subtle);
    }
    .activity-table td {
      padding: var(--sp-3) var(--sp-4);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    .activity-table tr:last-child td { border-bottom: none; }
    .activity-table tr:hover td { background: var(--bg-hover); }

    .disease-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    /* Status pills */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: var(--weight-semibold);
    }
    .pill-high    { background: rgba(239,68,68,0.12);  color: var(--color-error); }
    .pill-medium  { background: rgba(245,158,11,0.12); color: var(--color-warning); }
    .pill-low     { background: rgba(59,130,246,0.12); color: var(--color-info); }
    .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chart-empty  { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); font-size: var(--text-sm); padding: var(--sp-4); }
    .pill-healthy { background: rgba(46,204,113,0.12); color: var(--brand-primary); }

    /* Weather widget */
    .weather-widget {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-5) var(--sp-6);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }
    .weather-header { display: flex; align-items: center; justify-content: space-between; }
    .weather-location { font-size: var(--text-xs); color: var(--text-muted); }
    .weather-temp {
      font-size: 2.5rem;
      font-weight: var(--weight-extrabold);
      color: var(--text-primary);
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .weather-desc { font-size: var(--text-sm); color: var(--text-secondary); }
    .weather-details {
      display: flex;
      gap: var(--sp-6);
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .weather-detail { display: flex; align-items: center; gap: 4px; }

    @media (max-width: 768px) {
      .welcome-actions { display: none; }
      .welcome-banner { padding: var(--sp-6); }
      .welcome-title { font-size: var(--text-2xl); }
      .quick-tiles { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <!-- =========================================================
       APP SHELL — sidebar injected by layout.js
       ========================================================= -->
  <div class="app-layout" id="appLayout">

    <!-- Sidebar injected here by Layout.init() -->

    <div class="app-main" id="appMain">

      <!-- Header injected here by Layout.init() -->

      <!-- =====================================================
           PAGE CONTENT
           ===================================================== -->
      <main class="app-content" id="appContent">

        <!-- ---- Welcome Banner ----------------------------- -->
        <div class="welcome-banner" id="welcomeBanner">
          <div class="welcome-text">
            <div class="welcome-greeting" id="welcomeGreeting"></div>
            <div class="welcome-title" id="welcomeTitle"></div>
            <div class="welcome-subtitle" id="welcomeSubtitle" data-i18n="dashboard.banner.loading"></div>
          </div>
          <div class="welcome-actions">
            <a class="btn-banner btn-banner-primary" href="/camera">&#9654; <span data-i18n="dashboard.actions.analyse"></span></a>
            <a class="btn-banner btn-banner-secondary" href="/chatbot" data-i18n="dashboard.actions.ask_bot"></a>
          </div>
        </div>

        <!-- ---- KPI Cards ---------------------------------- -->
        <div class="section-title">
          <span data-i18n="dashboard.kpi.title"></span>
          <div class="section-title-line"></div>
        </div>

        <div class="kpi-grid" id="kpiGrid">
          <!-- KPI 1 — Active Parcels -->
          <div class="kpi-card">
            <div class="kpi-header">
              <span class="kpi-label" data-i18n="dashboard.kpi.parcels"></span>
              <div class="kpi-icon-wrap kpi-icon-green">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
            </div>
            <div class="kpi-value" id="kpiParcels">—</div>
            <div class="kpi-change neutral">
              <span class="kpi-change-label" data-i18n="dashboard.kpi.parcels_hint"></span>
            </div>
          </div>

          <!-- KPI 2 — Total Analyses -->
          <div class="kpi-card">
            <div class="kpi-header">
              <span class="kpi-label" data-i18n="dashboard.kpi.analyses"></span>
              <div class="kpi-icon-wrap kpi-icon-blue">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </div>
            </div>
            <div class="kpi-value" id="kpiAnalyses">—</div>
            <div id="kpiAnalysesChange" class="kpi-change neutral">
              <span class="kpi-change-label" data-i18n="dashboard.kpi.total_hint"></span>
            </div>
          </div>

          <!-- KPI 3 — Diseases Detected -->
          <div class="kpi-card">
            <div class="kpi-header">
              <span class="kpi-label" data-i18n="dashboard.kpi.diseases"></span>
              <div class="kpi-icon-wrap kpi-icon-orange">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                  <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
              </div>
            </div>
            <div class="kpi-value" id="kpiDiseases">—</div>
            <div id="kpiDiseasesChange" class="kpi-change neutral">
              <span class="kpi-change-label" data-i18n="dashboard.kpi.total_hint"></span>
            </div>
          </div>

          <!-- KPI 4 — Healthy Plants -->
          <div class="kpi-card">
            <div class="kpi-header">
              <span class="kpi-label" data-i18n="dashboard.kpi.healthy"></span>
              <div class="kpi-icon-wrap kpi-icon-orange">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </div>
            </div>
            <div class="kpi-value" id="kpiHealthy">—</div>
            <div id="kpiHealthyChange" class="kpi-change neutral">
              <span class="kpi-change-label" data-i18n="dashboard.kpi.total_hint"></span>
            </div>
          </div>

          <!-- KPI 5 — GreenBot Sessions -->
          <div class="kpi-card">
            <div class="kpi-header">
              <span class="kpi-label" data-i18n="dashboard.kpi.chats"></span>
              <div class="kpi-icon-wrap kpi-icon-purple">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
            </div>
            <div class="kpi-value" id="kpiChatSessions">—</div>
            <div id="kpiChatsChange" class="kpi-change neutral">
              <span class="kpi-change-label" data-i18n="dashboard.kpi.total_hint"></span>
            </div>
          </div>
        </div>

        <!-- ---- Charts + Weather Row ----------------------- -->
        <div class="section-title">
          <span data-i18n="dashboard.trend.section"></span>
          <div class="section-title-line"></div>
        </div>

        <div class="charts-grid">
          <!-- Disease trend chart -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title" data-i18n="dashboard.trend.title"></div>
                <div class="card-subtitle" data-i18n="dashboard.trend.subtitle"></div>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="diseaseTrendChart" role="img" data-i18n-aria-label="dashboard.trend.title"></canvas>
              <div class="chart-empty" id="trendEmpty" style="display:none;"></div>
            </div>
          </div>

          <!-- Weather widget -->
          <div class="weather-widget" id="weatherWidget">
            <div class="weather-header">
              <div>
                <div class="card-title" data-i18n="dashboard.weather.title"></div>
                <div class="weather-location" id="weatherLocation"></div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning)" stroke-width="2">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
            </div>
            <div>
              <div class="weather-temp" id="weatherTemp">—</div>
              <div class="weather-desc" id="weatherDesc" data-i18n="dashboard.weather.loading"></div>
            </div>
            <div class="weather-details">
              <div class="weather-detail">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
                <span id="weatherHumidity">—</span>
              </div>
              <div class="weather-detail">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                </svg>
                <span id="weatherWind">—</span>
              </div>
            </div>
            <div style="margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--border-subtle);">
              <div style="font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--sp-2);" data-i18n="dashboard.weather.tip"></div>
              <div style="font-size: var(--text-sm); color: var(--text-secondary);" id="weatherTip">—</div>
            </div>
          </div>
        </div>

        <!-- ---- Quick Access ------------------------------ -->
        <div class="section-title">
          <span data-i18n="dashboard.quick.title"></span>
          <div class="section-title-line"></div>
        </div>

        <div class="quick-tiles">
          <a href="/camera" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-green kpi-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M2 12h2M20 12h2M12 2v2M12 20v2"/><circle cx="6" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.camera"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.camera_desc"></div>
          </a>

          <a href="/chatbot" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-purple kpi-icon-wrap" style="background:rgba(139,92,246,0.12);color:#8B5CF6;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.chatbot"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.chatbot_desc"></div>
          </a>

          <a href="/map" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-blue kpi-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.map"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.map_desc"></div>
          </a>

          <a href="/calendar" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-orange kpi-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.calendar"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.calendar_desc"></div>
          </a>

          <a href="/history" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-wrap" style="background:rgba(107,114,128,0.12);color:var(--text-muted);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.history"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.history_desc"></div>
          </a>

          <a href="/diseases" class="quick-tile">
            <div class="quick-tile-icon kpi-icon-red kpi-icon-wrap">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="quick-tile-label" data-i18n="dashboard.quick.diseases"></div>
            <div class="quick-tile-desc" data-i18n="dashboard.quick.diseases_desc"></div>
          </a>
        </div>

        <!-- ---- Recent Analyses ---------------------------- -->
        <div class="section-title">
          <span data-i18n="dashboard.recent.title"></span>
          <div class="section-title-line"></div>
          <a href="/history" style="font-size:var(--text-sm); color:var(--brand-primary); font-weight:500; white-space:nowrap; margin-left: auto;">
            <span data-i18n="common.actions.view_all"></span> &rarr;
          </a>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div id="recentAnalysesContainer">
            <!-- Empty state shown until analyses are loaded -->
            <div class="empty-state" id="recentAnalysesEmpty">
              <div class="empty-state-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </div>
              <div class="empty-state-title" data-i18n="dashboard.recent.empty_title"></div>
              <div class="empty-state-description" data-i18n="dashboard.recent.empty_text"></div>
              <a href="/camera" class="btn btn-primary" style="margin-top: var(--sp-2);" data-i18n="dashboard.recent.start"></a>
            </div>
          </div>
        </div>

      </main><!-- /appContent -->
    </div><!-- /appMain -->
  </div><!-- /appLayout -->

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>

  <script>
    /* ---- Initialise layout -------------------------------- */
    Layout.init({ page: 'dashboard', titleKey: 'nav.dashboard', subtitleKey: 'dashboard.subtitle' });

    let dashStats = null;      // last /stats payload (null = error, undefined = loading)
    let trendData = null;
    let trendChart = null;
    let recentItems = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderGreeting();
      loadDashboardStats();
      loadTrend();
      loadWeather();
      loadRecentAnalyses();
    });

    // Everything rendered from JS is re-rendered in the new language
    window.addEventListener('languageChanged', () => {
      renderGreeting();
      renderStats();
      renderTrend();
      renderRecent();
      loadWeather();   // descriptions and tips come from the server in the request language
    });

    function renderGreeting() {
      const user = Auth.getUser() || {};
      const hour = new Date().getHours();
      const part = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
      document.getElementById('welcomeGreeting').textContent = I18n.t(`dashboard.greeting.${part}`);
      document.getElementById('welcomeTitle').textContent =
        user.first_name ? `${user.first_name} ${user.last_name || ''}`.trim() : I18n.t('dashboard.welcome');
    }

    /* ---- KPI cards ---------------------------------------- */
    async function loadDashboardStats() {
      const { data, error } = await API.dashboard.stats();
      dashStats = error ? null : data;
      renderStats();
    }

    function renderStats() {
      const sub = document.getElementById('welcomeSubtitle');
      sub.removeAttribute('data-i18n');
      const ids = { kpiParcels: 'parcels', kpiAnalyses: 'analyses', kpiDiseases: 'diseases',
                    kpiHealthy: 'healthy', kpiChatSessions: 'chat_sessions' };
      if (!dashStats) {
        // Never show zeros as if they were real figures
        Object.keys(ids).forEach(id => { document.getElementById(id).textContent = '—'; });
        sub.textContent = I18n.t('dashboard.banner.unavailable');
        return;
      }
      for (const [id, field] of Object.entries(ids)) {
        document.getElementById(id).textContent = I18n.number(dashStats[field] ?? 0);
      }
      _setKpiChange('kpiAnalysesChange', dashStats.new_analyses_week);
      _setKpiChange('kpiDiseasesChange', dashStats.new_diseases_week, true);
      _setKpiChange('kpiHealthyChange',  dashStats.new_healthy_week);
      _setKpiChange('kpiChatsChange',    dashStats.new_chats_week);

      if (!dashStats.analyses) sub.textContent = I18n.t('dashboard.banner.no_analyses');
      else if (dashStats.new_diseases_week > 0)
        sub.textContent = I18n.t('dashboard.banner.alerts_week', { count: dashStats.new_diseases_week });
      else sub.textContent = I18n.t('dashboard.banner.no_alert_week');
    }

    function _setKpiChange(elId, count, isWarning = false) {
      const el = document.getElementById(elId);
      if (!el) return;
      const span = document.createElement('span');
      if (count > 0) {
        span.textContent = I18n.t('dashboard.kpi.new_week', { count });
        el.className = `kpi-change ${isWarning ? 'down' : 'up'}`;
      } else {
        span.className = 'kpi-change-label';
        span.textContent = I18n.t('dashboard.kpi.total_hint');
        el.className = 'kpi-change neutral';
      }
      el.replaceChildren(span);
    }

    /* ---- Trend chart -------------------------------------- */
    async function loadTrend() {
      const { data, error } = await API.dashboard.diseaseTrends(28);
      trendData = error ? null : data;
      // Chart.js is loaded with defer: wait for it if needed
      if (typeof Chart === 'undefined') window.addEventListener('load', renderTrend, { once: true });
      else renderTrend();
    }

    function renderTrend() {
      const canvas = document.getElementById('diseaseTrendChart');
      const empty  = document.getElementById('trendEmpty');
      if (trendChart) { trendChart.destroy(); trendChart = null; }
      if (!trendData || typeof Chart === 'undefined') {
        canvas.style.display = 'none';
        empty.style.display = '';
        empty.textContent = I18n.t(trendData ? 'common.states.error' : 'dashboard.trend.error');
        return;
      }
      if (!trendData.total_analyses) {
        canvas.style.display = 'none';
        empty.style.display = '';
        empty.textContent = I18n.t('dashboard.trend.empty');
        return;
      }
      canvas.style.display = '';
      empty.style.display = 'none';

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const gridColor  = isDark ? '#21262D' : '#F3F4F6';
      const tickColor  = isDark ? '#8B949E' : '#6B7280';
      const labels = (trendData.week_starts || []).map(d =>
        I18n.t('dashboard.trend.week_of', { date: I18n.date(d, { day: 'numeric', month: 'short' }) }));

      trendChart = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: I18n.t('dashboard.trend.diseases'), data: trendData.detections,
              backgroundColor: 'rgba(239, 68, 68, 0.60)', borderColor: '#EF4444', borderWidth: 1.5, borderRadius: 6, order: 1 },
            { label: I18n.t('dashboard.trend.healthy'), data: trendData.healthy,
              backgroundColor: 'rgba(46, 204, 113, 0.55)', borderColor: '#2ECC71', borderWidth: 1.5, borderRadius: 6, order: 2 },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          locale: I18n.locale,
          plugins: {
            legend: { position: 'top', labels: { color: tickColor, font: { family: 'Inter', size: 12 }, boxWidth: 12, padding: 16 } },
            tooltip: {
              backgroundColor: isDark ? '#161B22' : '#FFFFFF',
              borderColor: isDark ? '#30363D' : '#E5E7EB',
              borderWidth: 1,
              titleColor: isDark ? '#E6EDF3' : '#0E1117',
              bodyColor:  isDark ? '#8B949E' : '#6B7280',
              callbacks: {
                label: c => ' ' + I18n.t('dashboard.trend.tooltip', { label: c.dataset.label, count: c.parsed.y }),
              }
            }
          },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 12 } } },
            y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 12 }, precision: 0 }, beginAtZero: true }
          }
        }
      });
    }

    /* ---- Weather (server proxy, user's region) ------------ */
    async function loadWeather() {
      const user = Auth.getUser() || {};
      const { data, error, status } = await API.weather.current(null, null, null, user.region || null);
      const desc = document.getElementById('weatherDesc');
      desc.removeAttribute('data-i18n');
      if (error || !data) {
        document.getElementById('weatherTemp').textContent = '—';
        document.getElementById('weatherLocation').textContent = '';
        desc.textContent = I18n.t(status === 503 ? 'dashboard.weather.not_configured' : 'dashboard.weather.unavailable');
        document.getElementById('weatherHumidity').textContent = '—';
        document.getElementById('weatherWind').textContent = '—';
        document.getElementById('weatherTip').textContent = '—';
        return;
      }
      document.getElementById('weatherTemp').textContent     = `${I18n.number(data.temp)}°C`;
      document.getElementById('weatherHumidity').textContent = I18n.t('dashboard.weather.humidity', { value: data.humidity });
      document.getElementById('weatherWind').textContent     = I18n.t('dashboard.weather.wind', { value: data.wind_speed });
      document.getElementById('weatherLocation').textContent = data.label || data.city;
      desc.textContent = data.description;
      document.getElementById('weatherTip').textContent      = data.agro_tip?.message || '—';
    }

    /* ---- Recent analyses ---------------------------------- */
    async function loadRecentAnalyses() {
      const { data, error } = await API.dashboard.recentActivity();
      recentItems = error ? null : (Array.isArray(data) ? data : []);
      renderRecent();
    }

    function renderRecent() {
      const container = document.getElementById('recentAnalysesContainer');
      const emptyEl   = document.getElementById('recentAnalysesEmpty');
      container.querySelectorAll('.table-scroll, .card-error').forEach(el => el.remove());
      if (recentItems === null) {
        emptyEl.style.display = 'none';
        container.insertAdjacentHTML('beforeend',
          `<div class="card-error empty-state">${escapeHtml(I18n.t('dashboard.recent.error'))}</div>`);
        return;
      }
      if (!recentItems.length) { emptyEl.style.display = ''; return; }
      emptyEl.style.display = 'none';

      const color = lvl => lvl === 'high' ? 'var(--color-error)' : lvl === 'medium' ? 'var(--color-warning)'
                         : lvl === 'low' ? 'var(--color-info)' : 'var(--color-success)';
      container.insertAdjacentHTML('beforeend', `
        <div class="table-scroll"><table class="activity-table">
          <thead>
            <tr>
              <th>${escapeHtml(I18n.t('dashboard.recent.result'))}</th>
              <th>${escapeHtml(I18n.t('dashboard.recent.plant'))}</th>
              <th title="${escapeHtml(I18n.t('model.alert.help'))}">${escapeHtml(I18n.t('dashboard.recent.alert'))}</th>
              <th>${escapeHtml(I18n.t('dashboard.recent.confidence'))}</th>
              <th>${escapeHtml(I18n.t('dashboard.recent.date'))}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${recentItems.map(a => {
              const lvl = alertLevel(a);
              return `
              <tr>
                <td><span class="disease-dot" style="background:${color(lvl)}"></span>${escapeHtml(analysisLabel(a))}</td>
                <td>${escapeHtml(plantLabel(a.plant_type))}</td>
                <td><span class="pill pill-${lvl === 'none' ? 'healthy' : lvl}">${escapeHtml(alertLabel(lvl))}</span></td>
                <td>${a.confidence != null ? escapeHtml(I18n.percent(a.confidence)) : '—'}</td>
                <td style="white-space:nowrap;">${escapeHtml(I18n.date(a.created_at, { day: 'numeric', month: 'short' }))}</td>
                <td><a href="/history?id=${encodeURIComponent(a.id)}" style="color:var(--brand-primary);font-size:var(--text-sm);">${escapeHtml(I18n.t('common.actions.view'))}</a></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table></div>`);
    }
  </script>
</body>
</html>
