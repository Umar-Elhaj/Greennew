<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.profile">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    /* ---- Profile two-column layout ------------------------- */
    .profile-grid {
      display: grid;
      grid-template-columns: 288px 1fr;
      gap: var(--sp-6);
      align-items: start;
    }
    @media (max-width: 900px) { .profile-grid { grid-template-columns: 1fr; } }

    /* ---- Shared card shell --------------------------------- */
    .p-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .p-card-hdr {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
    }
    .p-card-hdr h3 { font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--text-primary); margin: 0; }
    .p-card-hdr svg { color: var(--brand-text); flex-shrink: 0; }
    .p-card-body { padding: var(--sp-6); }

    /* ---- Avatar section (gradient top of left card) -------- */
    .avatar-section {
      padding: var(--sp-8) var(--sp-6);
      background: linear-gradient(135deg, var(--brand-darker) 0%, var(--brand-dark) 65%, var(--brand-mid) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .avatar-section::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      background: rgba(255,255,255,.05);
      border-radius: 50%;
      right: -40px; top: -50px;
      pointer-events: none;
    }
    .avatar-circle {
      position: relative;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      border: 3px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: var(--weight-extrabold); color: #fff;
      margin-bottom: var(--sp-4);
    }
    .avatar-name { font-size: var(--text-base); font-weight: var(--weight-bold); color: #fff; line-height: 1.2; }
    .avatar-role { font-size: var(--text-xs); color: rgba(255,255,255,.7); margin-top: var(--sp-1); }

    /* ---- Info list ----------------------------------------- */
    .info-list { display: flex; flex-direction: column; gap: var(--sp-4); }
    .info-item { display: flex; align-items: flex-start; gap: var(--sp-3); }
    .info-icon { color: var(--brand-text); flex-shrink: 0; margin-top: 1px; }
    .info-label { font-size: 11px; font-weight: var(--weight-semibold); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
    .info-value { font-size: var(--text-sm); color: var(--text-primary); font-weight: var(--weight-medium); margin-top: 1px; }

    /* ---- Stats row ----------------------------------------- */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-subtle);
    }
    .stat-cell {
      padding: var(--sp-5) var(--sp-4);
      text-align: center;
      border-right: 1px solid var(--border-subtle);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: var(--text-2xl); font-weight: var(--weight-extrabold); color: var(--brand-text); line-height: 1; }
    .stat-lbl { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--sp-1); }

    /* ---- Form ------------------------------------------------ */
    .form-section { margin-bottom: var(--sp-6); }
    .form-section:last-child { margin-bottom: 0; }
    .form-section-title {
      font-size: 11px;
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      padding-bottom: var(--sp-3);
      margin-bottom: var(--sp-4);
      border-bottom: 1px solid var(--border-subtle);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: var(--sp-1); }
    .form-group label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-secondary);
    }

    /* ---- Danger zone --------------------------------------- */
    .danger-zone {
      background: var(--surface-1);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: var(--radius-lg);
      padding: var(--sp-6);
    }
    .danger-zone h4 { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-error-text); margin: 0 0 var(--sp-2); }
    .danger-zone p  { font-size: var(--text-sm); color: var(--text-muted); margin: 0 0 var(--sp-4); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Banner -->
      <div style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-8);position:relative;overflow:hidden;">
        <div style="position:absolute;width:240px;height:240px;background:rgba(255,255,255,.05);border-radius:50%;right:-30px;top:-70px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:var(--weight-semibold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="profile.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:var(--weight-extrabold);color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="profile.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.7);" data-i18n="profile.banner_text"></div>
        </div>
      </div>

      <div class="profile-grid">

        <!-- LEFT — Avatar + Info + Stats -->
        <div style="display:flex;flex-direction:column;gap:var(--sp-4);">

          <div class="p-card">
            <!-- Avatar gradient header -->
            <div class="avatar-section">
              <div class="avatar-circle" id="avatarCircle">—</div>
              <div class="avatar-name" id="avatarName"></div>
              <div class="avatar-role" id="avatarRole">—</div>
            </div>

            <!-- Quick info -->
            <div class="p-card-body">
              <div class="info-list">
                <div class="info-item">
                  <svg class="info-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1 19.79 19.79 0 0 1 1.61 4.48 2 2 0 0 1 3.6 2.25h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  <div><div class="info-label" data-i18n="profile.phone"></div><div class="info-value" id="infoPhone">—</div></div>
                </div>
                <div class="info-item">
                  <svg class="info-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                  <div><div class="info-label" data-i18n="profile.email"></div><div class="info-value" id="infoEmail">—</div></div>
                </div>
                <div class="info-item">
                  <svg class="info-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                  <div><div class="info-label" data-i18n="profile.company"></div><div class="info-value" id="infoCompany">—</div></div>
                </div>
                <div class="info-item">
                  <svg class="info-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                  <div><div class="info-label" data-i18n="profile.region"></div><div class="info-value" id="infoRegion">—</div></div>
                </div>
              </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
              <div class="stat-cell"><div class="stat-val" id="statAnalyses">—</div><div class="stat-lbl" data-i18n="profile.stats_analyses"></div></div>
              <div class="stat-cell"><div class="stat-val" id="statDiseases">—</div><div class="stat-lbl" data-i18n="profile.stats_diseases"></div></div>
              <div class="stat-cell"><div class="stat-val" id="statHealthy">—</div><div class="stat-lbl" data-i18n="profile.stats_healthy"></div></div>
            </div>
          </div>

        </div><!-- /left -->

        <!-- RIGHT — Edit form + Password + Danger zone -->
        <div style="display:flex;flex-direction:column;gap:var(--sp-4);">

          <!-- Edit profile -->
          <div class="p-card">
            <div class="p-card-hdr">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <h3 data-i18n="profile.edit"></h3>
            </div>
            <div class="p-card-body">
              <div id="profileAlert" class="alert" role="alert" style="display:none;margin-bottom:var(--sp-4);"></div>

              <div class="form-section">
                <div class="form-section-title" data-i18n="profile.section_personal"></div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="firstName" data-i18n="profile.first_name"></label>
                    <input type="text" id="firstName" class="form-input" autocomplete="given-name" />
                  </div>
                  <div class="form-group">
                    <label for="lastName" data-i18n="profile.last_name"></label>
                    <input type="text" id="lastName" class="form-input" autocomplete="family-name" />
                  </div>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-title" data-i18n="profile.section_contact"></div>
                <div class="form-group">
                  <label for="email" data-i18n="profile.email_optional"></label>
                  <input type="email" id="email" class="form-input" data-i18n-placeholder="profile.email_placeholder" autocomplete="email" />
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-title" data-i18n="profile.section_farm"></div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="companyName" data-i18n="profile.company_name"></label>
                    <input type="text" id="companyName" class="form-input" data-i18n-placeholder="profile.company_placeholder" />
                  </div>
                  <div class="form-group">
                    <label for="region" data-i18n="profile.region"></label>
                    <select id="region" class="form-input" data-placeholder-key="profile.region_placeholder"></select>
                  </div>
                </div>
              </div>

              <button class="btn btn-primary" onclick="saveProfile()" id="saveBtn">
                <span class="spinner"></span><span class="btn-text" data-i18n="profile.save"></span>
              </button>
            </div>
          </div>

          <!-- Change password -->
          <div class="p-card">
            <div class="p-card-hdr">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <h3 data-i18n="profile.password_title"></h3>
            </div>
            <div class="p-card-body">
              <div id="pwdAlert" class="alert" role="alert" style="display:none;margin-bottom:var(--sp-4);"></div>
              <div style="display:flex;flex-direction:column;gap:var(--sp-4);">
                <div class="form-group">
                  <label for="currentPwd" data-i18n="profile.current_password"></label>
                  <input type="password" id="currentPwd" class="form-input" autocomplete="current-password" />
                </div>
                <div class="form-group">
                  <label for="newPwd" data-i18n="profile.new_password"></label>
                  <input type="password" id="newPwd" class="form-input" autocomplete="new-password" minlength="8" />
                </div>
                <div class="form-group">
                  <label for="confirmPwd" data-i18n="profile.confirm_password"></label>
                  <input type="password" id="confirmPwd" class="form-input" autocomplete="new-password" />
                </div>
                <div>
                  <button class="btn btn-primary" onclick="changePassword()" id="pwdBtn"><span class="spinner"></span><span class="btn-text" data-i18n="profile.update_password"></span></button>
                </div>
              </div>
            </div>
          </div>

          <!-- Danger zone -->
          <div class="danger-zone">
            <h4 data-i18n="profile.danger_title"></h4>
            <p data-i18n="profile.danger_text"></p>
            <button class="btn" onclick="deactivateAccount()"
                    style="border-color:rgba(239,68,68,.35);color:var(--color-error-text);background:rgba(239,68,68,.05);" data-i18n="profile.deactivate"></button>
          </div>

        </div><!-- /right -->
      </div><!-- /profile-grid -->

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'profile', titleKey: 'nav.profile', subtitleKey: 'profile.subtitle' });

let profileUser = null;

document.addEventListener('DOMContentLoaded', async () => {
  fillRegionSelect(document.getElementById('region'));
  await loadProfile();
  await loadStats();
});

window.addEventListener('languageChanged', () => {
  fillRegionSelect(document.getElementById('region'));
  renderProfileCard();
});

async function loadProfile() {
  const { data } = await API.auth.me();
  if (!data) return;
  profileUser = data;
  Auth.updateUser(data);
  renderProfileCard();
  document.getElementById('firstName').value   = data.first_name   || '';
  document.getElementById('lastName').value    = data.last_name    || '';
  document.getElementById('email').value       = data.email        || '';
  document.getElementById('companyName').value = data.company_name || '';
  fillRegionSelect(document.getElementById('region'), data.region || '');
}

function renderProfileCard() {
  const user = profileUser;
  if (!user) return;
  document.getElementById('avatarCircle').textContent = getInitials(user.first_name || '', user.last_name || '');
  document.getElementById('avatarName').textContent   = `${user.first_name || ''} ${user.last_name || ''}`.trim();
  document.getElementById('avatarRole').textContent   = I18n.t(`profile.roles.${user.role || 'farmer'}`);
  document.getElementById('infoPhone').textContent    = user.phone        || '—';
  document.getElementById('infoEmail').textContent    = user.email        || '—';
  document.getElementById('infoCompany').textContent  = user.company_name || '—';
  document.getElementById('infoRegion').textContent   = user.region ? regionLabel(user.region) : '—';
}

async function loadStats() {
  const { data } = await API.dashboard.stats();
  if (!data) return;
  document.getElementById('statAnalyses').textContent = I18n.number(data.analyses);
  document.getElementById('statDiseases').textContent = I18n.number(data.diseases);
  document.getElementById('statHealthy').textContent  = I18n.number(data.healthy);
}

async function saveProfile() {
  hideAlert('profileAlert');
  setButtonLoading('saveBtn', true);
  // Empty optional fields are sent as "" so that the server clears them
  const { error } = await API.auth.updateProfile({
    first_name:   document.getElementById('firstName').value.trim(),
    last_name:    document.getElementById('lastName').value.trim(),
    email:        document.getElementById('email').value.trim(),
    company_name: document.getElementById('companyName').value.trim(),
    region:       document.getElementById('region').value,
  });
  setButtonLoading('saveBtn', false);
  if (error) { showAlert('profileAlert', error, 'error'); return; }
  showAlert('profileAlert', I18n.t('profile.saved'), 'success');
  await loadProfile();
  Layout.refreshUser();
}

async function changePassword() {
  const cur  = document.getElementById('currentPwd').value;
  const nw   = document.getElementById('newPwd').value;
  const conf = document.getElementById('confirmPwd').value;
  hideAlert('pwdAlert');
  if (!cur || !nw || !conf) { showAlert('pwdAlert', I18n.t('profile.err_fill'), 'error'); return; }
  if (nw !== conf)          { showAlert('pwdAlert', I18n.t('profile.err_mismatch'), 'error'); return; }
  if (nw.length < 8)        { showAlert('pwdAlert', I18n.t('profile.err_length'), 'error'); return; }
  setButtonLoading('pwdBtn', true);
  const { error } = await API.auth.changePassword({ current_password: cur, new_password: nw });
  setButtonLoading('pwdBtn', false);
  if (error) { showAlert('pwdAlert', error, 'error'); return; }
  showAlert('pwdAlert', I18n.t('profile.password_changed'), 'success');
  ['currentPwd', 'newPwd', 'confirmPwd'].forEach(id => { document.getElementById(id).value = ''; });
}

async function deactivateAccount() {
  if (!App.confirm(I18n.t('profile.deactivate_confirm'))) return;
  const { error } = await API.auth.deleteAccount();
  if (error) { App.toast(error, 'error'); return; }
  App.logout();
}
</script>
</body>
</html>
