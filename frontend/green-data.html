<!DOCTYPE html>
<html lang="fr">
<!--
  GREEN App — GREEN Data (partner / admin)
  Aggregated, consent-only statistics. Every figure based on fewer than
  k analyses arrives masked from the server and is shown as "< k".
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.green_data">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <!-- Chart.js 4.4.0 and Leaflet 1.9.4, vendored: see /vendor/README.md -->
  <script src="/vendor/chart.js-4.4.0/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
  <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
  <style>
    .gd-filters { display: flex; flex-wrap: wrap; gap: var(--sp-3); align-items: flex-end; background: var(--surface-1);
                  border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-4); margin-bottom: var(--sp-5); }
    .gd-filters .field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1 1 130px; }
    .gd-filters label { font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); }
    .gd-filters .form-input { height: 36px; padding: 0 var(--sp-2); }
    .gd-filters .actions { display: flex; gap: var(--sp-2); flex: 0 0 auto; }
    .gd-check { display: flex; align-items: center; gap: 6px; font-size: var(--text-sm); color: var(--text-secondary); }
    .gd-method { background: var(--surface-1); border: 1px solid var(--border-subtle); border-left: 3px solid var(--color-info);
                 border-radius: var(--radius-md); padding: var(--sp-4); margin-bottom: var(--sp-5); font-size: var(--text-sm); color: var(--text-secondary); }
    .gd-method h2 { font-size: var(--text-sm); margin: 0 0 var(--sp-2); color: var(--text-primary); }
    .gd-method ul { margin: 0; padding-left: var(--sp-5); display: flex; flex-direction: column; gap: 4px; }
    .gd-method .demo { color: var(--color-error-text); font-weight: 600; }
    .gd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-5); }
    .gd-kpi { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-4); }
    .gd-kpi .lbl { font-size: var(--text-xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .gd-kpi .val { font-size: var(--text-2xl); font-weight: 800; color: var(--text-primary); margin-top: var(--sp-1); }
    .gd-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-4); }
    .gd-card { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-5); min-width: 0; }
    .gd-card h2 { font-size: var(--text-base); margin: 0 0 var(--sp-3); color: var(--text-primary); }
    .gd-card h3 { font-size: var(--text-sm); margin: var(--sp-4) 0 var(--sp-2); color: var(--text-primary); }
    .gd-chart { position: relative; height: 260px; }
    .gd-empty { font-size: var(--text-sm); color: var(--text-muted); padding: var(--sp-6) 0; text-align: center; }
    .gd-note { font-size: var(--text-xs); color: var(--text-muted); margin: var(--sp-2) 0 0; }
    .gd-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    .gd-table th, .gd-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); text-align: left; }
    .gd-table th { font-size: var(--text-xs); color: var(--text-muted); font-weight: 600; }
    .gd-table td.num, .gd-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .gd-heat td.cell { text-align: center; font-variant-numeric: tabular-nums; min-width: 44px; border: 2px solid var(--surface-1); }
    .gd-heat td.cell.masked { color: var(--text-muted); background: repeating-linear-gradient(45deg, transparent 0 3px, var(--bg-muted) 3px 5px); }
    .gd-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: baseline; }
    details.gd-tv { margin-top: var(--sp-3); font-size: var(--text-sm); }
    details.gd-tv summary { cursor: pointer; color: var(--brand-text); font-weight: 600; font-size: var(--text-xs); }
    #regionMap { height: 320px; border-radius: var(--radius-md); background: var(--bg-muted); }
    .gd-alert { padding: var(--sp-3); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: var(--sp-2); font-size: var(--text-sm); }
    .gd-alert::before { content: '⚠ '; color: #d03b3b; font-weight: 700; }
    .gd-forbidden { background: var(--surface-1); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-8); text-align: center; color: var(--text-secondary); }
    .table-scroll { width: 100%; overflow-x: auto; }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <div class="page-banner" style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-5);position:relative;overflow:hidden;">
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="green_data.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="green_data.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.8);max-width:720px;" data-i18n="green_data.banner_text"></div>
        </div>
      </div>

      <div class="gd-forbidden" id="forbidden" hidden data-i18n="green_data.forbidden"></div>

      <div id="gdContent" hidden>
        <!-- Filters: one row above the charts -->
        <form class="gd-filters" id="filters" aria-labelledby="filtersTitle">
          <span id="filtersTitle" class="sr-only" data-i18n="green_data.filters.title" hidden></span>
          <div class="field"><label for="fFrom" data-i18n="green_data.filters.from"></label><input type="date" id="fFrom" class="form-input" /></div>
          <div class="field"><label for="fTo" data-i18n="green_data.filters.to"></label><input type="date" id="fTo" class="form-input" /></div>
          <div class="field"><label for="fRegion" data-i18n="green_data.filters.region"></label><select id="fRegion" class="form-input"></select></div>
          <div class="field"><label for="fPlant" data-i18n="green_data.filters.plant"></label><select id="fPlant" class="form-input"></select></div>
          <div class="field"><label for="fDisease" data-i18n="green_data.filters.disease"></label><select id="fDisease" class="form-input"></select></div>
          <div class="field"><label for="fSource" data-i18n="green_data.filters.source"></label><select id="fSource" class="form-input"></select></div>
          <div class="field"><label for="fModel" data-i18n="green_data.filters.model"></label><select id="fModel" class="form-input"></select></div>
          <label class="gd-check" id="demoBox" hidden><input type="checkbox" id="fDemo" /> <span data-i18n="green_data.filters.demo"></span></label>
          <div class="actions">
            <button type="submit" class="btn btn-primary" data-i18n="green_data.filters.apply"></button>
            <button type="button" class="btn" id="resetBtn" data-i18n="green_data.filters.reset"></button>
          </div>
        </form>

        <section class="gd-method" aria-live="polite">
          <h2 data-i18n="green_data.method.title"></h2>
          <ul>
            <li data-i18n="green_data.method.consent"></li>
            <li id="mKanon"></li>
            <li data-i18n="green_data.method.geo"></li>
            <li data-i18n="green_data.method.prediction"></li>
            <li id="mPeriod"></li>
            <li id="mDemo" class="demo" hidden data-i18n="green_data.method.demo"></li>
          </ul>
        </section>

        <div class="gd-kpis" id="kpis"></div>

        <div class="gd-grid">
          <section class="gd-card"><h2 data-i18n="green_data.volume.title"></h2><div id="volumeBox"></div></section>
          <section class="gd-card"><h2 data-i18n="green_data.volume.rate_title"></h2><div id="rateBox"></div></section>
        </div>
        <div class="gd-grid">
          <section class="gd-card"><h2 data-i18n="green_data.plants.title"></h2><div id="plantsBox"></div></section>
          <section class="gd-card"><h2 data-i18n="green_data.diseases.title"></h2><div id="diseasesBox"></div></section>
        </div>
        <section class="gd-card" style="margin-bottom:var(--sp-4);"><h2 data-i18n="green_data.diseases.matrix"></h2><div id="matrixBox"></div></section>
        <div class="gd-grid">
          <section class="gd-card">
            <h2 data-i18n="green_data.regions.title"></h2>
            <div class="row" style="display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);">
              <label for="regionMetric" style="font-size:var(--text-xs);color:var(--text-secondary);font-weight:600;" data-i18n="green_data.regions.map_metric"></label>
              <select id="regionMetric" class="form-input" style="height:32px;width:auto;">
                <option value="analyses" data-i18n="green_data.regions.metric_analyses"></option>
                <option value="rate" data-i18n="green_data.regions.metric_rate"></option>
              </select>
            </div>
            <div id="regionMap" role="img" data-i18n-aria-label="green_data.regions.title"></div>
            <div id="regionsBox"></div>
          </section>
          <section class="gd-card"><h2 data-i18n="green_data.alerts.title"></h2><div id="alertsBox"></div></section>
        </div>
        <section class="gd-card" style="margin-bottom:var(--sp-4);"><h2 data-i18n="green_data.season.title"></h2><div id="seasonBox"></div></section>
        <div class="gd-grid">
          <section class="gd-card"><h2 data-i18n="green_data.confidence.title"></h2><div id="confidenceBox"></div></section>
          <section class="gd-card"><h2 data-i18n="green_data.quality.title"></h2><div id="qualityBox"></div></section>
        </div>
        <div class="gd-grid">
          <section class="gd-card"><h2 data-i18n="green_data.dataset.title"></h2><div id="datasetBox"></div></section>
          <section class="gd-card">
            <h2 data-i18n="green_data.export.title"></h2>
            <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
              <button type="button" class="btn btn-primary" id="csvBtn" data-i18n="green_data.export.csv"></button>
              <button type="button" class="btn" id="geoBtn" data-i18n="green_data.export.geojson"></button>
            </div>
            <p class="gd-note" id="exportNote"></p>
          </section>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/charts.js"></script>
<script>
Layout.init({ page: 'green-data', titleKey: 'nav.green_data', subtitleKey: 'green_data.subtitle' });

const $ = id => document.getElementById(id);
const gt = (k, p) => I18n.t(`green_data.${k}`, p);   // keys of this page
const D = {};                // last payloads by section
const charts = {};
let K = 5;
let regionMap = null;
let regionLayer = null;
let regionsGeo = null;

/* ---- helpers ------------------------------------------------- */
const mv = m => !m ? '—' : m.masked ? gt('masked', { k: K }) : I18n.number(m.value);
const mr = m => !m ? '—' : m.masked ? gt('masked', { k: K }) : I18n.percent(m.value, 1);
const val = m => (m && !m.masked ? m.value : null);
const plantName = p => p === 'unknown' ? I18n.t('common.unknown') : plantLabel(p);
const empty = n => `<p class="gd-empty">${escapeHtml(gt('not_enough', { n: I18n.number(n || 0) }))}</p>`;

function table(headers, rows, numeric = []) {
  return `<div class="table-scroll"><table class="gd-table"><thead><tr>${headers.map((h, i) =>
    `<th${numeric.includes(i) ? ' class="num"' : ''}>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r =>
    `<tr>${r.map((c, i) => `<td${numeric.includes(i) ? ' class="num"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function tableView(headers, rows, numeric) {
  return `<details class="gd-tv"><summary>${escapeHtml(gt('table_view'))}</summary>${table(headers, rows, numeric)}</details>`;
}

function chart(id, box, config) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  box.insertAdjacentHTML('afterbegin', `<div class="gd-chart"><canvas id="${id}" role="img"></canvas></div>`);
  charts[id] = new Chart($(id), config);
}

function currentFilters() {
  return {
    date_from: $('fFrom').value, date_to: $('fTo').value, region: $('fRegion').value, plant: $('fPlant').value,
    disease: $('fDisease').value, source: $('fSource').value, model_version: $('fModel').value,
    include_demo: $('fDemo').checked ? 'true' : '',
  };
}

function fillSelect(sel, values, label) {
  const keep = sel.value;
  sel.innerHTML = `<option value="">${escapeHtml(gt('filters.all'))}</option>`
    + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(label(v))}</option>`).join('');
  sel.value = values.includes(keep) ? keep : '';
}

/* ---- loading -------------------------------------------------- */
const SECTIONS = ['meta', 'overview', 'plants', 'diseases', 'regions', 'seasonality', 'confidence', 'model-quality', 'alerts', 'dataset'];

async function loadAll() {
  const f = currentFilters();
  const results = await Promise.all(SECTIONS.map(s => API.greenData.get(s, f)));
  if (results.some(r => r.status === 403)) { $('forbidden').hidden = false; $('gdContent').hidden = true; return; }
  SECTIONS.forEach((s, i) => { D[s] = results[i].error ? null : results[i].data; });
  if (!regionsGeo) {
    const g = await API.greenData.download('export.geojson', {});
    if (g.blob) regionsGeo = JSON.parse(await g.blob.text());
  }
  $('gdContent').hidden = false;
  renderAll();
}

function renderAll() {
  const meta = D.meta;
  if (!meta) return;
  K = meta.k_anonymity;
  fillSelect($('fRegion'), meta.regions, regionLabel);
  fillSelect($('fPlant'), meta.plants, plantName);
  fillSelect($('fDisease'), meta.diseases, classLabel);
  fillSelect($('fSource'), meta.sources, s => I18n.has(`green_data.sources.${s}`) ? gt(`sources.${s}`) : s);
  fillSelect($('fModel'), meta.model_versions, v => v);
  $('demoBox').hidden = !meta.demo_available;
  $('mDemo').hidden = !meta.include_demo;
  $('mKanon').textContent = gt('method.kanon', { k: K });
  $('mPeriod').textContent = meta.n
    ? gt('method.period', { from: I18n.date(meta.period.from), to: I18n.date(meta.period.to), n: I18n.number(meta.n) })
    : gt('method.period_empty');
  $('exportNote').textContent = gt('export.note', { k: K });
  renderKpis();
  renderVolume();
  renderPlants();
  renderDiseases();
  renderRegions();
  renderAlerts();
  renderSeason();
  renderConfidence();
  renderQuality();
  renderDataset();
}

/* ---- sections ------------------------------------------------- */
function renderKpis() {
  const o = D.overview;
  if (!o) { $('kpis').innerHTML = ''; return; }
  const tiles = [
    ['kpi.analyses', mv(o.analyses)], ['kpi.farmers', mv(o.farmers)], ['kpi.parcels', mv(o.parcels)],
    ['kpi.area', o.area_ha.masked ? gt('masked', { k: K }) : `${I18n.number(o.area_ha.value, { maximumFractionDigits: 1 })} ha`],
    ['kpi.disease_rate', mr(o.disease_rate)],
  ];
  $('kpis').innerHTML = tiles.map(([k, v]) =>
    `<div class="gd-kpi"><div class="lbl">${escapeHtml(gt(k))}</div><div class="val">${escapeHtml(v)}</div></div>`).join('');
}

function renderVolume() {
  const o = D.overview;
  const box = $('volumeBox'), rbox = $('rateBox');
  box.innerHTML = ''; rbox.innerHTML = '';
  if (!o || !o.series.length || D.meta.n < K) { box.innerHTML = empty(D.meta.n); rbox.innerHTML = empty(D.meta.n); return; }
  const labels = o.series.map(s => { const [y, m] = s.month.split('-'); return I18n.date(new Date(+y, +m - 1, 15), { month: 'short', year: '2-digit' }); });
  const base = VIZ.baseOptions();
  base.plugins.legend.display = false;
  chart('volChart', box, {
    type: 'bar',
    data: { labels, datasets: [{ label: gt('volume.analyses'), data: o.series.map(s => val(s.analyses)),
      backgroundColor: VIZ.slot(0), borderRadius: 4, maxBarThickness: 28 }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip,
      callbacks: { label: c => ` ${gt('volume.analyses')} : ${c.raw === null ? gt('masked', { k: K }) : I18n.number(c.raw)}` } } } },
  });
  box.insertAdjacentHTML('beforeend', tableView([gt('volume.month'), gt('volume.analyses'), gt('volume.farmers')],
    o.series.map((s, i) => [escapeHtml(labels[i]), escapeHtml(mv(s.analyses)), escapeHtml(mv(s.farmers))]), [1, 2]));

  const rbase = VIZ.baseOptions();
  rbase.plugins.legend.display = false;
  rbase.scales.y = { ...rbase.scales.y, max: 1, ticks: { ...rbase.scales.y.ticks, callback: v => I18n.percent(v) } };
  chart('rateChart', rbox, {
    type: 'line',
    data: { labels, datasets: [{ label: gt('volume.rate'), data: o.series.map(s => val(s.disease_rate)),
      borderColor: VIZ.slot(1), backgroundColor: VIZ.slot(1), borderWidth: 2, pointRadius: 4, spanGaps: false }] },
    options: { ...rbase, plugins: { ...rbase.plugins, tooltip: { ...rbase.plugins.tooltip,
      callbacks: { label: c => ` ${gt('volume.rate')} : ${c.raw === null ? gt('masked', { k: K }) : I18n.percent(c.raw, 1)}` } } } },
  });
  rbox.insertAdjacentHTML('beforeend', tableView([gt('volume.month'), gt('volume.rate')],
    o.series.map((s, i) => [escapeHtml(labels[i]), escapeHtml(mr(s.disease_rate))]), [1]));
}

function renderPlants() {
  const box = $('plantsBox');
  box.innerHTML = '';
  const rows = (D.plants || []).filter(p => !p.analyses.masked);
  if (!rows.length) { box.innerHTML = empty(D.meta.n); return; }
  const base = VIZ.baseOptions({ indexAxis: 'y' });
  base.scales.x.stacked = true; base.scales.y.stacked = true;
  chart('plantsChart', box, {
    type: 'bar',
    data: { labels: rows.map(p => plantName(p.plant)), datasets: [
      { label: gt('plants.diseased'), data: rows.map(p => val(p.diseased) ?? 0), backgroundColor: VIZ.slot(1), borderRadius: 4, maxBarThickness: 26 },
      { label: gt('plants.healthy'), data: rows.map(p => val(p.healthy) ?? 0), backgroundColor: VIZ.slot(2), borderRadius: 4, maxBarThickness: 26 },
    ] },
    options: base,
  });
  box.insertAdjacentHTML('beforeend', tableView([gt('plants.plant'), gt('volume.analyses'), gt('plants.diseased'), gt('plants.healthy'), gt('plants.rate')],
    (D.plants || []).map(p => [escapeHtml(plantName(p.plant)), escapeHtml(mv(p.analyses)), escapeHtml(mv(p.diseased)),
      escapeHtml(mv(p.healthy)), escapeHtml(mr(p.disease_rate))]), [1, 2, 3, 4]));
}

function renderDiseases() {
  const box = $('diseasesBox');
  box.innerHTML = '';
  const top = (D.diseases ? D.diseases.top : []).filter(d => !d.analyses.masked).slice(0, 8);
  if (!top.length) { box.innerHTML = empty(D.meta.n); } else {
    const base = VIZ.baseOptions({ indexAxis: 'y' });
    base.plugins.legend.display = false;
    chart('diseaseChart', box, {
      type: 'bar',
      data: { labels: top.map(d => classLabel(d.disease)), datasets: [{ label: gt('diseases.analyses'),
        data: top.map(d => d.analyses.value), backgroundColor: top.map(d => VIZ.disease(d.disease)), borderRadius: 4, maxBarThickness: 22 }] },
      options: base,
    });
    box.insertAdjacentHTML('beforeend', tableView([gt('diseases.disease'), gt('diseases.analyses')],
      (D.diseases.top || []).map(d => [`<span class="gd-swatch" style="background:${VIZ.disease(d.disease)}"></span>${escapeHtml(classLabel(d.disease))}`,
        escapeHtml(mv(d.analyses))]), [1]));
  }

  // plant x disease matrix (sequential cells, masked cells textured)
  const mbox = $('matrixBox');
  const m = D.diseases && D.diseases.matrix;
  if (!m || !m.cells.length) { mbox.innerHTML = empty(D.meta.n); return; }
  const cell = {};
  let max = 0;
  m.cells.forEach(c => { cell[`${c.plant}|${c.disease}`] = c.analyses; if (!c.analyses.masked) max = Math.max(max, c.analyses.value); });
  mbox.innerHTML = `<div class="table-scroll"><table class="gd-table gd-heat"><thead><tr><th></th>${m.diseases.map(d =>
    `<th class="num">${escapeHtml(d === 'healthy' ? gt('plants.healthy') : classLabel(d))}</th>`).join('')}</tr></thead><tbody>${m.plants.map(p =>
    `<tr><th>${escapeHtml(plantName(p))}</th>${m.diseases.map(d => {
      const c = cell[`${p}|${d}`];
      if (!c) return '<td class="cell">—</td>';
      if (c.masked) return `<td class="cell masked">${escapeHtml(gt('masked', { k: K }))}</td>`;
      const r = max ? c.value / max : 0;
      return `<td class="cell" style="background:${VIZ.seq(r)};color:${VIZ.seqText(r)}">${escapeHtml(I18n.number(c.value))}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function renderRegions() {
  const rows = D.regions || [];
  const byRegion = Object.fromEntries(rows.map(r => [r.region, r]));
  $('regionsBox').innerHTML = rows.length ? table([gt('regions.region'), gt('volume.analyses'), gt('plants.rate'), gt('regions.top')],
    rows.map(r => [escapeHtml(r.region === 'unknown' ? I18n.t('common.unknown') : regionLabel(r.region)), escapeHtml(mv(r.analyses)),
      escapeHtml(mr(r.disease_rate)), escapeHtml(r.top_disease ? classLabel(r.top_disease) : '—')]), [1, 2]) : empty(D.meta.n);

  if (!regionMap) {
    regionMap = L.map('regionMap', { zoomControl: false, attributionControl: true, scrollWheelZoom: false }).setView([7.3, 12.5], 5);
  }
  if (regionLayer) regionLayer.remove();
  if (!regionsGeo) return;
  const metric = $('regionMetric').value;
  const values = rows.map(r => metric === 'rate' ? val(r.disease_rate) : val(r.analyses)).filter(v => v !== null);
  const max = Math.max(1, ...values);
  regionLayer = L.geoJSON(regionsGeo, {
    attribution: 'geoBoundaries (CC BY 3.0)',
    style: f => {
      const r = byRegion[f.properties.region];
      const v = r ? (metric === 'rate' ? val(r.disease_rate) : val(r.analyses)) : null;
      const x = v === null ? null : (metric === 'rate' ? v : v / max);
      return { color: VIZ.theme().surface, weight: 1.5, fillOpacity: x === null ? 0.25 : 0.85,
               fillColor: x === null ? '#b5b3ad' : VIZ.seq(x) };
    },
    onEachFeature: (f, layer) => {
      const r = byRegion[f.properties.region];
      layer.bindTooltip(`<strong>${escapeHtml(regionLabel(f.properties.region))}</strong><br>`
        + (r ? `${escapeHtml(gt('volume.analyses'))} : ${escapeHtml(mv(r.analyses))}<br>${escapeHtml(gt('plants.rate'))} : ${escapeHtml(mr(r.disease_rate))}`
             : escapeHtml(gt('regions.no_data'))), { sticky: true });
    },
  }).addTo(regionMap);
  regionMap.fitBounds(regionLayer.getBounds());
}

function renderAlerts() {
  const a = D.alerts;
  const box = $('alertsBox');
  if (!a) { box.innerHTML = ''; return; }
  const items = a.alerts.map(x => `<div class="gd-alert">${escapeHtml(gt('alerts.item', {
    disease: classLabel(x.disease), region: x.region === 'unknown' ? I18n.t('common.unknown') : regionLabel(x.region),
    recent: x.recent_cases, baseline: I18n.number(x.baseline_per_period, { maximumFractionDigits: 1 }) }))}</div>`).join('');
  box.innerHTML = (items || `<p class="gd-empty">${escapeHtml(gt('alerts.none'))}</p>`)
    + `<p class="gd-note">${escapeHtml(a.rule[I18n.lang === 'fr' ? 'text_fr' : 'text_en'])}</p>`
    + `<p class="gd-note">${escapeHtml(gt('alerts.as_of', { date: I18n.date(a.as_of) }))}</p>`;
}

function renderSeason() {
  const rows = D.seasonality || [];
  const box = $('seasonBox');
  if (!rows.length) { box.innerHTML = empty(D.meta.n); return; }
  const diseases = [...new Set(rows.map(r => r.disease))].sort();
  const cell = {};
  let max = 0;
  rows.forEach(r => { cell[`${r.month}|${r.disease}`] = r.analyses; if (!r.analyses.masked) max = Math.max(max, r.analyses.value); });
  const months = [...Array(12).keys()].map(i => i + 1);
  box.innerHTML = `<div class="table-scroll"><table class="gd-table gd-heat"><thead><tr><th>${escapeHtml(gt('diseases.disease'))}</th>${months.map(m =>
    `<th class="num">${escapeHtml(I18n.date(new Date(2026, m - 1, 15), { month: 'short' }))}</th>`).join('')}</tr></thead><tbody>${diseases.map(d =>
    `<tr><th><span class="gd-swatch" style="background:${VIZ.disease(d)}"></span>${escapeHtml(classLabel(d))}</th>${months.map(m => {
      const c = cell[`${m}|${d}`];
      if (!c) return '<td class="cell"></td>';
      if (c.masked) return `<td class="cell masked">${escapeHtml(gt('masked', { k: K }))}</td>`;
      const r = max ? c.value / max : 0;
      return `<td class="cell" style="background:${VIZ.seq(r)};color:${VIZ.seqText(r)}">${escapeHtml(I18n.number(c.value))}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div><p class="gd-note">${escapeHtml(gt('season.note'))}</p>`;
}

function renderConfidence() {
  const c = D.confidence;
  const box = $('confidenceBox');
  box.innerHTML = '';
  if (!c || D.meta.n < K) { box.innerHTML = empty(D.meta.n); return; }
  const base = VIZ.baseOptions();
  base.plugins.legend.display = false;
  box.innerHTML = `<h3>${escapeHtml(gt('confidence.histogram'))}</h3><div id="histBox"></div>
    <h3>${escapeHtml(gt('confidence.levels'))}</h3>${table([I18n.t('model.alert.title'), gt('volume.analyses')],
      c.alert_levels.map(l => [`<span class="gd-swatch" style="background:${VIZ.status(l.level)}"></span>${escapeHtml(alertLabel(l.level))}`,
        escapeHtml(mv(l.analyses))]), [1])}
    <h3>${escapeHtml(gt('confidence.low_rate', { t: I18n.percent(c.low_confidence_threshold) }))} : ${escapeHtml(mr(c.low_confidence_rate))}</h3>
    <p class="gd-note">${escapeHtml(gt('confidence.low_help'))}</p>`;
  const hbox = $('histBox');
  const labels = c.histogram.map(b => `${I18n.percent(b.from)}–${I18n.percent(b.to)}`);
  chart('histChart', hbox, {
    type: 'bar',
    data: { labels, datasets: [{ label: gt('volume.analyses'), data: c.histogram.map(b => val(b.analyses)),
      backgroundColor: VIZ.slot(0), borderRadius: 4, categoryPercentage: 0.95, barPercentage: 0.95 }] },
    options: base,
  });
  hbox.insertAdjacentHTML('beforeend', tableView([gt('confidence.bin'), gt('volume.analyses')],
    c.histogram.map((b, i) => [escapeHtml(labels[i]), escapeHtml(mv(b.analyses))]), [1]));
}

function renderQuality() {
  const q = D['model-quality'];
  const box = $('qualityBox');
  if (!q || q.verified.masked) { box.innerHTML = `<p class="gd-empty">${escapeHtml(gt('quality.empty'))}</p>`; return; }
  const cell = {};
  q.confusion.cells.forEach(c => { cell[`${c.predicted}|${c.verified}`] = c.analyses; });
  box.innerHTML = `<div class="gd-kpis" style="margin-bottom:var(--sp-3);">
      <div class="gd-kpi"><div class="lbl">${escapeHtml(gt('quality.verified'))}</div><div class="val">${escapeHtml(mv(q.verified))}</div></div>
      <div class="gd-kpi"><div class="lbl">${escapeHtml(gt('quality.agreement'))}</div><div class="val">${escapeHtml(mr(q.agreement))}</div></div>
    </div>`
    + table([gt('quality.version'), gt('quality.verified'), gt('quality.agreement')],
      q.by_version.map(v => [escapeHtml(v.model_version), escapeHtml(mv(v.verified)), escapeHtml(mr(v.agreement))]), [1, 2])
    + `<h3>${escapeHtml(gt('quality.confusion'))}</h3><div class="table-scroll"><table class="gd-table gd-heat"><thead><tr><th>${escapeHtml(gt('quality.predicted'))} \\ ${escapeHtml(gt('quality.truth'))}</th>${q.confusion.labels.map(l =>
      `<th class="num">${escapeHtml(classLabel(l))}</th>`).join('')}</tr></thead><tbody>${q.confusion.labels.map(p =>
      `<tr><th>${escapeHtml(classLabel(p))}</th>${q.confusion.labels.map(v => {
        const c = cell[`${p}|${v}`];
        if (!c) return '<td class="cell">—</td>';
        return c.masked ? `<td class="cell masked">${escapeHtml(gt('masked', { k: K }))}</td>`
                        : `<td class="cell"${p === v ? ' style="font-weight:700"' : ''}>${escapeHtml(I18n.number(c.value))}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function renderDataset() {
  const rows = D.dataset || [];
  $('datasetBox').innerHTML = rows.length ? table([gt('dataset.class'), gt('dataset.images'), gt('dataset.verified')],
    rows.map(r => [escapeHtml(classLabel(r.class)), escapeHtml(mv(r.images)), escapeHtml(mv(r.verified))]), [1, 2]) : empty(D.meta.n);
}

/* ---- wiring --------------------------------------------------- */
$('filters').addEventListener('submit', e => { e.preventDefault(); loadAll(); });
$('resetBtn').addEventListener('click', () => { $('filters').reset(); loadAll(); });
$('regionMetric').addEventListener('change', renderRegions);
async function exportFile(path, name) {
  const { blob, error } = await API.greenData.download(path, currentFilters());
  if (error) { App.toast(error, 'error'); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$('csvBtn').addEventListener('click', () => exportFile('export.csv', 'green-data.csv'));
$('geoBtn').addEventListener('click', () => exportFile('export.geojson', 'green-data-regions.geojson'));
window.addEventListener('languageChanged', () => { if (D.meta) renderAll(); });
document.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>
