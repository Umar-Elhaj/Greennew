<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.economics">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <script src="/vendor/chart.js-4.4.0/chart.umd.min.js" defer></script>
  <style>
    /* ---- Two-column layout ---------------------------------- */
    .eco-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: var(--sp-6);
      align-items: start;
    }
    @media (max-width: 1050px) { .eco-layout { grid-template-columns: 1fr; } }

    /* ---- Input panel --------------------------------------- */
    .input-panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: calc(var(--header-height) + var(--sp-4));
    }
    .input-panel-hdr {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--sp-5) var(--sp-6);
    }
    .input-panel-hdr h3 {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0 0 2px;
    }
    .input-panel-hdr p {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin: 0;
    }
    .input-panel-body { padding: var(--sp-6); }

    .form-field { margin-bottom: var(--sp-5); }
    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: var(--sp-2);
    }
    .form-label-val {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      color: var(--brand-text);
      background: rgba(46,204,113,0.10);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      text-transform: none;
      letter-spacing: 0;
    }
    .form-select, .form-input {
      width: 100%;
      height: 42px;
      padding: 0 var(--sp-4);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      box-sizing: border-box;
      transition: border-color var(--dur-base) var(--ease-out);
    }
    .form-select:focus, .form-input:focus {
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px var(--input-ring);
    }
    .form-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--bg-muted);
      outline: none;
      accent-color: var(--brand-primary);
      margin-top: var(--sp-2);
    }
    .form-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--brand-primary);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .divider { height: 1px; background: var(--border-subtle); margin: var(--sp-5) 0; }

    /* ---- Result cards -------------------------------------- */
    .result-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }
    @media (max-width: 700px) { .result-kpis { grid-template-columns: 1fr; } }

    .result-kpi {
      background: var(--surface-1);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
    }
    .result-kpi.highlight { border-color: var(--brand-primary); background: rgba(46,204,113,0.04); }
    .result-kpi.danger    { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.03); }

    .kpi-label {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-secondary);
      margin-bottom: var(--sp-2);
    }
    .kpi-value {
      font-size: var(--text-2xl);
      font-weight: var(--weight-extrabold);
      letter-spacing: -.02em;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 4px;
    }
    .kpi-value.green  { color: var(--brand-text); }
    .kpi-value.red    { color: var(--color-error-text); }
    .kpi-value.orange { color: var(--color-warning-text); }
    .kpi-sub { font-size: 11px; color: var(--text-secondary); }

    /* ---- Scenario comparison table ------------------------- */
    .scenario-table {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: var(--sp-6);
    }
    .scenario-table-hdr {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }
    .scenario-table-hdr div, .scenario-row div {
      padding: var(--sp-4) var(--sp-5);
      font-size: var(--text-sm);
    }
    .scenario-table-hdr div {
      font-size: 11px;
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-muted);
    }
    .scenario-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      border-top: 1px solid var(--border-subtle);
      transition: background var(--dur-base) var(--ease-out);
    }
    .scenario-row:hover { background: var(--bg-subtle); }
    .scenario-row .label { font-weight: var(--weight-semibold); color: var(--text-primary); }
    .scenario-row .val   { font-weight: var(--weight-bold); color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .scenario-row.best   { background: rgba(46,204,113,.04); }
    .scenario-row.best .label { color: var(--brand-text); }
    .scenario-row.worst  { background: rgba(239,68,68,.03); }

    /* ---- Chart -------------------------------------------- */
    .chart-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-6);
      margin-bottom: var(--sp-6);
    }
    .chart-card-title {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0 0 var(--sp-4);
    }
    .chart-container { position: relative; height: 220px; }

    /* ---- ROI block ----------------------------------------- */
    .roi-block {
      background: linear-gradient(135deg, rgba(46,204,113,0.08), rgba(46,204,113,0.02));
      border: 1px solid rgba(46,204,113,0.2);
      border-radius: var(--radius-lg);
      padding: var(--sp-5) var(--sp-6);
      display: flex;
      align-items: center;
      gap: var(--sp-6);
      margin-bottom: var(--sp-6);
    }
    .roi-number {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--brand-text);
      letter-spacing: -.04em;
      line-height: 1;
      white-space: nowrap;
    }
    .roi-label { font-size: var(--text-sm); color: var(--text-secondary); }
    .roi-label strong { color: var(--text-primary); }

    /* ---- Section title ------------------------------------- */
    .section-title {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      letter-spacing: -.01em;
      margin-bottom: var(--sp-4);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .section-title-line { flex:1; height:1px; background: var(--border-subtle); }
      .eco-note { font-size: var(--text-xs); color: var(--text-muted); line-height: 1.6; margin: var(--sp-2) 0 var(--sp-4); }
    .field-help { font-size: 11px; color: var(--text-muted); margin-top: var(--sp-1); }
    .roi-block.negative .roi-number { color: var(--color-error-text); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Banner -->
      <div class="page-banner" style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-6);position:relative;overflow:hidden;">
        <div style="position:absolute;width:280px;height:280px;background:rgba(255,255,255,.05);border-radius:50%;right:-50px;top:-80px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="economics.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="economics.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.75);" data-i18n="economics.banner_text"></div>
        </div>
      </div>

      <div class="eco-layout">

        <!-- LEFT: parameters -->
        <div>
          <div class="input-panel">
            <div class="input-panel-hdr">
              <h3 data-i18n="economics.params"></h3>
              <p data-i18n="economics.params_help"></p>
            </div>
            <div class="input-panel-body">
              <div class="form-field">
                <label class="form-label" for="cropType" data-i18n="economics.crop"></label>
                <select class="form-select" id="cropType">
                  <option value="maize" data-i18n="economics.crops.maize"></option>
                  <option value="cassava" data-i18n="economics.crops.cassava"></option>
                  <option value="tomato" data-i18n="economics.crops.tomato"></option>
                  <option value="groundnut" data-i18n="economics.crops.groundnut"></option>
                  <option value="sorghum" data-i18n="economics.crops.sorghum"></option>
                </select>
              </div>
              <div class="form-field">
                <label class="form-label" for="area">
                  <span data-i18n="economics.area"></span>
                  <span class="form-label-val" id="areaVal"></span>
                </label>
                <input type="range" class="form-slider" id="area" min="0.5" max="20" step="0.5" value="2" />
              </div>
              <div class="form-field">
                <label class="form-label" for="yield">
                  <span data-i18n="economics.yield"></span>
                  <span class="form-label-val" id="yieldVal"></span>
                </label>
                <input type="range" class="form-slider" id="yield" min="0.5" max="10" step="0.1" value="2.5" />
              </div>
              <div class="form-field">
                <label class="form-label" for="price">
                  <span data-i18n="economics.price"></span>
                  <span class="form-label-val" id="priceVal"></span>
                </label>
                <input type="range" class="form-slider" id="price" min="50" max="1000" step="10" value="150" />
              </div>

              <div class="divider"></div>
              <div class="form-field">
                <label class="form-label" for="disease">
                  <span data-i18n="economics.incidence"></span>
                  <span class="form-label-val" id="diseaseVal" style="background:rgba(239,68,68,.10);color:var(--color-error-text);"></span>
                </label>
                <input type="range" class="form-slider" id="disease" min="0" max="80" step="1" value="25" />
                <div class="field-help" data-i18n="economics.incidence_help"></div>
              </div>
              <div class="form-field">
                <label class="form-label" for="treatCost">
                  <span data-i18n="economics.treat_cost"></span>
                  <span class="form-label-val" id="treatCostVal"></span>
                </label>
                <input type="range" class="form-slider" id="treatCost" min="5000" max="150000" step="1000" value="25000" />
                <div class="field-help" data-i18n="economics.treat_cost_help"></div>
              </div>
              <div class="form-field">
                <label class="form-label" for="effectiveness">
                  <span data-i18n="economics.effectiveness"></span>
                  <span class="form-label-val" id="effectivenessVal"></span>
                </label>
                <input type="range" class="form-slider" id="effectiveness" min="20" max="98" step="1" value="75" />
                <div class="field-help" data-i18n="economics.effectiveness_help"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT: results -->
        <div>
          <div class="section-title"><span data-i18n="economics.results"></span> <div class="section-title-line"></div></div>
          <div class="result-kpis">
            <div class="result-kpi highlight">
              <div class="kpi-label" data-i18n="economics.kpi_gross"></div>
              <div class="kpi-value green" id="kpiGross">—</div>
              <div class="kpi-sub" id="kpiGrossSub">—</div>
            </div>
            <div class="result-kpi danger">
              <div class="kpi-label" data-i18n="economics.kpi_loss"></div>
              <div class="kpi-value red" id="kpiLoss">—</div>
              <div class="kpi-sub" id="kpiLossSub">—</div>
            </div>
            <div class="result-kpi highlight">
              <div class="kpi-label" data-i18n="economics.kpi_after"></div>
              <div class="kpi-value green" id="kpiNet">—</div>
              <div class="kpi-sub" id="kpiNetSub">—</div>
            </div>
          </div>
          <p class="eco-note" data-i18n="economics.production_note"></p>

          <div class="roi-block" id="roiBlock">
            <div class="roi-number" id="roiValue">—</div>
            <div>
              <div class="roi-label"><strong data-i18n="economics.roi_title"></strong></div>
              <div class="roi-label" id="roiDesc" style="margin-top:4px;"></div>
            </div>
          </div>

          <div class="chart-card">
            <div class="chart-card-title" data-i18n="economics.chart_title"></div>
            <div class="chart-container">
              <canvas id="scenarioChart" role="img" data-i18n-aria-label="economics.chart_title"></canvas>
            </div>
          </div>

          <div class="section-title"><span data-i18n="economics.table_title"></span> <div class="section-title-line"></div></div>
          <div class="table-scroll">
            <div class="scenario-table">
              <div class="scenario-table-hdr">
                <div data-i18n="economics.col_scenario"></div>
                <div data-i18n="economics.col_gross"></div>
                <div data-i18n="economics.col_treat"></div>
                <div data-i18n="economics.col_loss"></div>
                <div data-i18n="economics.col_after"></div>
              </div>
              <div id="scenarioRows"></div>
            </div>
          </div>
          <p class="eco-note" data-i18n="economics.epidemic_rule"></p>

          <div class="section-title" style="margin-top:var(--sp-6);"><span data-i18n="economics.prices_title"></span> <div class="section-title-line"></div></div>
          <p class="eco-note" id="pricesNote"></p>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--sp-4);" id="priceRef"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'economics', titleKey: 'nav.economics', subtitleKey: 'economics.subtitle' });

/* Indicative Cameroonian prices (XAF/kg) and slider ranges per crop.
   Sources as declared by the original authors; not verified by GREEN. */
const CROP_PRICES = {
  maize: {
    bg: 'rgba(46,204,113,.10)', color: '#16a34a',
    svg: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="14" rx="3"/><path d="M9 8H5a2 2 0 0 0 0 4h4"/><path d="M15 6h4a2 2 0 0 1 0 4h-4"/><line x1="12" y1="16" x2="12" y2="22"/></svg>`,
    min: 100, avg: 175, max: 280,
    pmin: 50,  pmax: 500,  pstep: 5,
    ymin: 0.5, ymax: 8,   ystep: 0.1, yield_avg: 2.5,
    treat_def: 20000,
    source: 'WFP/FEWS NET 2025',
  },
  cassava: {
    bg: 'rgba(245,158,11,.10)', color: '#ca8a04',
    svg: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg>`,
    min: 80, avg: 200, max: 400,
    pmin: 50,  pmax: 600,  pstep: 10,
    ymin: 1,   ymax: 20,  ystep: 0.5, yield_avg: 8.0,
    treat_def: 25000,
    source: 'MINADER-PAM 2025',
  },
  tomato: {
    bg: 'rgba(239,68,68,.10)', color: '#dc2626',
    svg: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M12 7V3"/><path d="M9 5c0 0 1 2 3 2s3-2 3-2"/></svg>`,
    min: 200, avg: 600, max: 1200,
    pmin: 100, pmax: 1500, pstep: 10,
    ymin: 1,   ymax: 50,  ystep: 0.5, yield_avg: 15.0,
    treat_def: 60000,
    source: 'combien-coute.net 2026',
  },
  groundnut: {
    bg: 'rgba(180,83,9,.10)', color: '#b45309',
    svg: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="8" cy="13" rx="4" ry="6" transform="rotate(-20 8 13)"/><ellipse cx="16" cy="11" rx="4" ry="6" transform="rotate(20 16 11)"/><line x1="8" y1="7" x2="16" y2="5"/></svg>`,
    min: 400, avg: 800, max: 1500,
    pmin: 200, pmax: 2000, pstep: 25,
    ymin: 0.3, ymax: 3,   ystep: 0.1, yield_avg: 0.9,
    treat_def: 20000,
    source: 'FEWS NET/CBT 2025',
  },
  sorghum: {
    bg: 'rgba(124,58,237,.10)', color: '#7c3aed',
    svg: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="22" x2="12" y2="8"/><circle cx="12" cy="5" r="3"/><line x1="9" y1="13" x2="12" y2="11"/><line x1="15" y1="13" x2="12" y2="11"/><line x1="8" y1="17" x2="12" y2="15"/><line x1="16" y1="17" x2="12" y2="15"/></svg>`,
    min: 100, avg: 150, max: 240,
    pmin: 50,  pmax: 400,  pstep: 5,
    ymin: 0.3, ymax: 4,   ystep: 0.1, yield_avg: 1.0,
    treat_def: 15000,
    source: 'FEWS NET 2025',
  },
};


let _chart = null;
let _scenarios = [];

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('cropType').addEventListener('change', onCropChange);
  ['area', 'yield', 'price', 'disease', 'treatCost', 'effectiveness'].forEach(id =>
    document.getElementById(id).addEventListener('input', simulate));
  onCropChange();
});

window.addEventListener('languageChanged', () => { renderPriceRef(); simulate(); });

const xaf = n => I18n.money(Math.round(n));
const num = (id) => parseFloat(document.getElementById(id).value);
const setEl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };

function onCropChange() {
  const c = CROP_PRICES[document.getElementById('cropType').value];
  const set = (id, min, max, step, value) => Object.assign(document.getElementById(id), { min, max, step, value });
  set('yield', c.ymin, c.ymax, c.ystep, c.yield_avg);
  set('price', c.pmin, c.pmax, c.pstep, c.avg);
  document.getElementById('treatCost').value = c.treat_def;
  renderPriceRef();
  simulate();
}

function simulate() {
  const area = num('area'), yieldTha = num('yield'), priceKg = num('price');
  const diseasePct = num('disease') / 100, treatHa = num('treatCost'), eff = num('effectiveness') / 100;

  setEl('areaVal', `${I18n.number(area)} ha`);
  setEl('yieldVal', `${I18n.number(yieldTha, { minimumFractionDigits: 1, maximumFractionDigits: 1 })} t/ha`);
  setEl('priceVal', `${xaf(priceKg)}/kg`);
  setEl('diseaseVal', I18n.percent(diseasePct));
  setEl('treatCostVal', `${xaf(treatHa)}/ha`);
  setEl('effectivenessVal', I18n.percent(eff));

  const totalYieldKg   = area * yieldTha * 1000;
  const grossRevenue   = totalYieldKg * priceKg;
  const lossNoTreat    = grossRevenue * diseasePct;
  const totalTreatCost = area * treatHa;
  const lossWithTreat  = lossNoTreat * (1 - eff);
  const afterNoTreat   = grossRevenue - lossNoTreat;
  const afterTreat     = grossRevenue - lossWithTreat - totalTreatCost;
  const saved          = lossNoTreat - lossWithTreat;
  // Net return: (losses avoided − cost) / cost
  const roi            = totalTreatCost > 0 ? (saved - totalTreatCost) / totalTreatCost : 0;

  // Epidemic: assumptions shown on the page (economics.epidemic_rule)
  const epicPct   = Math.min(diseasePct * 2.5, 0.85);
  const epicEff   = Math.max(eff * 0.65, 0.10);
  const epicCost  = totalTreatCost * 1.5;
  const epicLoss  = grossRevenue * epicPct * (1 - epicEff);
  const epicAfter = grossRevenue - epicLoss - epicCost;

  setEl('kpiGross', xaf(grossRevenue));
  setEl('kpiGrossSub', I18n.t('economics.kpi_gross_sub', { area, yield: I18n.number(yieldTha * 1000), price: xaf(priceKg) }));
  setEl('kpiLoss', '−' + xaf(lossNoTreat));
  setEl('kpiLossSub', I18n.t('economics.kpi_loss_sub', { pct: I18n.percent(diseasePct) }));
  setEl('kpiNet', xaf(afterTreat));
  setEl('kpiNetSub', I18n.t('economics.kpi_after_sub', { cost: xaf(totalTreatCost) }));

  setEl('roiValue', I18n.percent(roi));
  setEl('roiDesc', roi < 0 ? I18n.t('economics.roi_negative')
    : I18n.t('economics.roi_text', { spent: xaf(1000), saved: xaf(saved / totalTreatCost * 1000), net: xaf(roi * 1000) }));
  document.getElementById('roiBlock').classList.toggle('negative', roi < 0);

  _scenarios = [
    { key: 'sc_none',      gross: grossRevenue, treat: 0,              loss: 0,             after: grossRevenue, cls: 'best' },
    { key: 'sc_treated',   gross: grossRevenue, treat: totalTreatCost, loss: lossWithTreat, after: afterTreat,   cls: '' },
    { key: 'sc_untreated', gross: grossRevenue, treat: 0,              loss: lossNoTreat,   after: afterNoTreat, cls: '' },
    { key: 'sc_epidemic',  gross: grossRevenue, treat: epicCost,       loss: epicLoss,      after: epicAfter,    cls: 'worst' },
  ];
  document.getElementById('scenarioRows').innerHTML = _scenarios.map(sc => `
    <div class="scenario-row ${sc.cls}">
      <div class="label">${escapeHtml(I18n.t(`economics.${sc.key}`))}</div>
      <div class="val">${escapeHtml(xaf(sc.gross))}</div>
      <div class="val" style="color:${sc.treat > 0 ? 'var(--color-warning-text)' : 'var(--text-muted)'};">${sc.treat > 0 ? escapeHtml(xaf(sc.treat)) : '—'}</div>
      <div class="val" style="color:${sc.loss > 0 ? 'var(--color-error-text)' : 'var(--text-muted)'};">${sc.loss > 0 ? '−' + escapeHtml(xaf(sc.loss)) : '—'}</div>
      <div class="val" style="color:${sc.after > 0 ? 'var(--brand-text)' : 'var(--color-error-text)'};">${escapeHtml(xaf(sc.after))}</div>
    </div>`).join('');
  updateChart();
}

function updateChart() {
  if (typeof Chart === 'undefined') { window.addEventListener('load', updateChart, { once: true }); return; }
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDark ? '#21262D' : '#F3F4F6';
  const tickColor = isDark ? '#8B949E' : '#6B7280';
  if (_chart) { _chart.destroy(); _chart = null; }
  _chart = new Chart(document.getElementById('scenarioChart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: _scenarios.map(sc => I18n.t(`economics.${sc.key}`)),
      datasets: [{
        label: I18n.t('economics.col_after'),
        data: _scenarios.map(sc => Math.round(sc.after / 1000)),
        backgroundColor: ['rgba(46,204,113,0.7)', 'rgba(46,204,113,0.5)', 'rgba(245,158,11,0.6)', 'rgba(239,68,68,0.6)'],
        borderColor: ['#2ECC71', '#2ECC71', '#f59e0b', '#ef4444'], borderWidth: 1.5, borderRadius: 6,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, locale: I18n.locale,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ' ' + xaf(c.parsed.y * 1000) } },
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 } } },
        y: { grid: { color: gridColor }, ticks: { color: tickColor, callback: v => I18n.number(v) },
             title: { display: true, text: I18n.t('economics.chart_axis'), color: tickColor }, beginAtZero: true },
      },
    },
  });
}

function renderPriceRef() {
  const sources = [...new Set(Object.values(CROP_PRICES).map(c => c.source))].join(' · ');
  setEl('pricesNote', I18n.t('economics.prices_note', { sources }));
  const t = k => escapeHtml(I18n.t(`economics.${k}`));
  document.getElementById('priceRef').innerHTML = Object.entries(CROP_PRICES).map(([key, p]) => `
    <div style="background:var(--surface-1);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--sp-4) var(--sp-5);">
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:${p.bg};color:${p.color};display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-3);">${p.svg}</div>
      <div style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-primary);margin-bottom:var(--sp-2);">${t(`crops.${key}`)}</div>
      <div style="display:flex;gap:var(--sp-4);">
        <div><div style="font-size:10px;color:var(--text-muted);">${t('min')}</div><div style="font-size:var(--text-sm);font-weight:600;">${escapeHtml(I18n.number(p.min))}</div></div>
        <div><div style="font-size:10px;color:var(--text-muted);">${t('avg')}</div><div style="font-size:var(--text-sm);font-weight:700;color:var(--brand-text);">${escapeHtml(I18n.number(p.avg))}</div></div>
        <div><div style="font-size:10px;color:var(--text-muted);">${t('max')}</div><div style="font-size:var(--text-sm);font-weight:600;">${escapeHtml(I18n.number(p.max))}</div></div>
      </div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">XAF/kg · ${escapeHtml(p.source)}</div>
    </div>`).join('');
}
</script>
</body>
</html>
