<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.settings">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    .settings-col {
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
    }

    /* ---- Settings card ------------------------------------- */
    .s-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .s-card-hdr {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
    }
    .s-card-hdr h3 {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0;
    }
    .s-card-hdr svg { color: var(--brand-primary); flex-shrink: 0; }

    /* ---- Setting row --------------------------------------- */
    .s-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-6);
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
      transition: background-color var(--dur-base) var(--ease-out);
    }
    .s-row:last-child { border-bottom: none; }
    .s-row-info h4 {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0 0 3px;
    }
    .s-row-info p {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    /* ---- Toggle switch ------------------------------------- */
    .toggle-wrap { position: relative; display: inline-block; width: 46px; height: 24px; flex-shrink: 0; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border-default);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: background-color var(--dur-base) var(--ease-out);
    }
    .toggle-track::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      left: 3px; top: 3px;
      transition: transform var(--dur-base) var(--ease-out);
      box-shadow: var(--shadow-sm);
    }
    .toggle-wrap input:checked + .toggle-track { background: var(--brand-primary); }
    .toggle-wrap input:checked + .toggle-track::before { transform: translateX(22px); }

    /* ---- Theme picker -------------------------------------- */
    .theme-options { display: flex; gap: var(--sp-3); }
    .theme-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      border: 2px solid var(--border-default);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      cursor: pointer;
      transition: border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
      min-width: 72px;
      background: none;
      font: inherit;
      color: inherit;
    }
    .theme-opt:hover { border-color: var(--brand-primary); }
    .theme-opt.active {
      border-color: var(--brand-primary);
      background: rgba(46,204,113,.07);
    }
    .theme-preview {
      width: 100%; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(0,0,0,.08);
    }
    .theme-label { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-secondary); }

    /* ---- Language options ---------------------------------- */
    .lang-options { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .lang-btn {
      height: 36px;
      padding: 0 var(--sp-4);
      border-radius: var(--radius-md);
      border: 2px solid var(--border-default);
      background: transparent;
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-secondary);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: border-color var(--dur-base) var(--ease-out),
                  color var(--dur-base) var(--ease-out),
                  background-color var(--dur-base) var(--ease-out);
    }
    .lang-btn:hover:not(:disabled) { border-color: var(--brand-primary); }
    .lang-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .lang-btn.active {
      border-color: var(--brand-primary);
      background: rgba(46,204,113,.1);
      color: var(--brand-primary);
    }

    /* ---- Version tag --------------------------------------- */
    .version-tag {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-family: var(--font-mono);
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: var(--radius-sm);
    }

    /* ---- Model status chip --------------------------------- */
    .model-chip {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      padding: 3px 10px;
      border-radius: var(--radius-full);
    }
    .model-chip.online  { background: rgba(46,204,113,.12); color: var(--brand-primary); }
    .model-chip.offline { background: rgba(239,68,68,.12);  color: var(--color-error); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Banner -->
      <div style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-8);position:relative;overflow:hidden;" class="page-banner">
        <div style="position:absolute;width:220px;height:220px;background:rgba(255,255,255,.05);border-radius:50%;right:-30px;top:-60px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:var(--weight-semibold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="settings.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:var(--weight-extrabold);color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="settings.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.7);" data-i18n="settings.banner_text"></div>
        </div>
      </div>

      <div class="settings-col">

        <!-- Appearance -->
        <div class="s-card">
          <div class="s-card-hdr">
            <h3 data-i18n="settings.appearance"></h3>
          </div>

          <!-- Theme -->
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.theme"></h4>
              <p data-i18n="settings.theme_help"></p>
            </div>
            <div class="theme-options">
              <button type="button" class="theme-opt" id="themeLight" onclick="setTheme('light')">
                <div class="theme-preview" style="background:#f8fafc;"></div>
                <span class="theme-label" data-i18n="settings.light"></span>
              </button>
              <button type="button" class="theme-opt" id="themeDark" onclick="setTheme('dark')">
                <div class="theme-preview" style="background:#0d1117;"></div>
                <span class="theme-label" data-i18n="settings.dark"></span>
              </button>
            </div>
          </div>

          <!-- Language -->
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.language"></h4>
              <p data-i18n="settings.language_help"></p>
            </div>
            <div class="lang-options">
              <button type="button" class="lang-btn" id="langFr" lang="fr" onclick="I18n.setLanguage('fr')">Français</button>
              <button type="button" class="lang-btn" id="langEn" lang="en" onclick="I18n.setLanguage('en')">English</button>
            </div>
          </div>
        </div>

        <!-- Data and privacy (stored on the server) -->
        <div class="s-card">
          <div class="s-card-hdr">
            <h3 data-i18n="settings.privacy"></h3>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.dataset_consent"></h4>
              <p data-i18n="settings.dataset_consent_help"></p>
            </div>
            <label class="toggle-wrap">
              <input type="checkbox" id="toggleDataset" onchange="saveConsent('dataset_consent', this)" />
              <span class="toggle-track"></span>
            </label>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.location_consent"></h4>
              <p data-i18n="settings.location_consent_help"></p>
            </div>
            <label class="toggle-wrap">
              <input type="checkbox" id="toggleLocation" onchange="saveConsent('location_consent', this)" />
              <span class="toggle-track"></span>
            </label>
          </div>
        </div>

        <!-- Camera / Rover -->
        <div class="s-card">
          <div class="s-card-hdr">
            <h3 data-i18n="settings.rover"></h3>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4><label for="defaultIp" data-i18n="settings.rover_ip"></label></h4>
              <p data-i18n="settings.rover_ip_help"></p>
            </div>
            <input type="text" id="defaultIp" class="form-input" inputmode="decimal"
                   style="width:150px;font-family:var(--font-mono);font-size:var(--text-sm);"
                   placeholder="192.168.10.1"
                   onchange="savePref('default_ip', this.value)" />
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4><label for="defaultPort" data-i18n="settings.rover_port"></label></h4>
              <p data-i18n="settings.rover_port_help"></p>
            </div>
            <input type="number" id="defaultPort" class="form-input" min="1" max="65535"
                   style="width:90px;"
                   placeholder="8080"
                   onchange="savePref('default_port', this.value)" />
          </div>
        </div>

        <!-- About -->
        <div class="s-card">
          <div class="s-card-hdr">
            <h3 data-i18n="settings.about"></h3>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.version"></h4>
              <p data-i18n="settings.version_help"></p>
            </div>
            <span class="version-tag" id="appVersion">—</span>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.model"></h4>
              <p data-i18n="settings.model_help"></p>
            </div>
            <span class="model-chip" id="modelStatus" data-i18n="settings.checking"></span>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.services"></h4>
              <p><span data-i18n="settings.service_greenbot"></span> : <strong id="svcGreenbot">—</strong> ·
                 <span data-i18n="settings.service_weather"></span> : <strong id="svcWeather">—</strong></p>
            </div>
          </div>
          <div class="s-row">
            <div class="s-row-info">
              <h4 data-i18n="settings.session"></h4>
              <p><span data-i18n="settings.signed_in_as"></span> <strong id="sessionUser" style="color:var(--text-primary);"></strong></p>
            </div>
            <button type="button" class="btn" onclick="App.logout()" style="font-size:var(--text-sm);" data-i18n="common.actions.sign_out"></button>
          </div>
        </div>

      </div><!-- /settings-col -->

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'settings', titleKey: 'nav.settings', subtitleKey: 'settings.subtitle' });

let health = undefined;   // undefined = loading, null = unreachable

document.addEventListener('DOMContentLoaded', () => {
  loadPrefs();
  loadAccount();
  checkApi();
});

window.addEventListener('languageChanged', () => {
  updateLanguageButtons();
  renderHealth();
});

function setTheme(t) {
  ThemeManager.set(t);
  document.getElementById('themeLight').classList.toggle('active', t === 'light');
  document.getElementById('themeDark').classList.toggle('active', t === 'dark');
  document.getElementById('themeLight').setAttribute('aria-pressed', t === 'light');
  document.getElementById('themeDark').setAttribute('aria-pressed', t === 'dark');
}

function updateLanguageButtons() {
  for (const [id, lang] of [['langFr', 'fr'], ['langEn', 'en']]) {
    const btn = document.getElementById(id);
    btn.classList.toggle('active', I18n.lang === lang);
    btn.setAttribute('aria-pressed', I18n.lang === lang);
  }
}

function savePref(key, value) {
  try { localStorage.setItem('green_pref_' + key, value); } catch (_) { /* private mode */ }
}

function loadPrefs() {
  setTheme(ThemeManager.get());
  updateLanguageButtons();
  let ip = null, port = null;
  try {
    ip   = localStorage.getItem('green_pref_default_ip');
    port = localStorage.getItem('green_pref_default_port');
  } catch (_) { /* private mode */ }
  document.getElementById('defaultIp').value   = ip || '192.168.10.1';
  document.getElementById('defaultPort').value = port || '8080';
}

/* Consents live on the server (they decide what GREEN Data may use) */
function loadAccount() {
  const user = Auth.getUser() || {};
  document.getElementById('sessionUser').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim();
  document.getElementById('toggleDataset').checked  = !!user.dataset_consent;
  document.getElementById('toggleLocation').checked = !!user.location_consent;
  // Refresh from the server: the cached user may predate the consent fields
  API.auth.me().then(({ data }) => {
    if (!data) return;
    Auth.updateUser(data);
    document.getElementById('toggleDataset').checked  = !!data.dataset_consent;
    document.getElementById('toggleLocation').checked = !!data.location_consent;
  });
}

async function saveConsent(field, input) {
  input.disabled = true;
  const { data, error } = await API.auth.updateProfile({ [field]: input.checked });
  input.disabled = false;
  if (error) {
    input.checked = !input.checked;   // back to the stored value
    App.toast(error, 'error');
    return;
  }
  Auth.updateUser(data);
  App.toast(I18n.t('settings.saved'), 'success', 2000);
}

async function checkApi() {
  const { data } = await API.health();
  health = data || null;
  renderHealth();
}

function renderHealth() {
  if (health === undefined) return;
  const chip = document.getElementById('modelStatus');
  chip.removeAttribute('data-i18n');
  const svc = (el, on) => {
    el.textContent = I18n.t(health ? (on ? 'settings.status_on' : 'settings.status_off') : 'settings.status_offline');
  };
  if (health) {
    chip.textContent = health.model_version || 'efficientnet';
    chip.className   = 'model-chip online';
    document.getElementById('appVersion').textContent = `v${health.version}`;
  } else {
    chip.textContent = I18n.t('settings.status_offline');
    chip.className   = 'model-chip offline';
  }
  svc(document.getElementById('svcGreenbot'), health && health.services && health.services.greenbot);
  svc(document.getElementById('svcWeather'),  health && health.services && health.services.weather);
}
</script>
</body>
</html>
