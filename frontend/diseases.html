<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.diseases">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    /* ---- Search / filter bar -------------------------------- */
    .search-bar {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-6);
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-4);
      align-items: center;
      margin-bottom: var(--sp-6);
    }
    .search-input-wrap {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-input-wrap svg {
      position: absolute;
      left: var(--sp-3);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 var(--sp-3) 0 calc(var(--sp-3) + 20px + var(--sp-2));
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      transition: border-color var(--dur-base) var(--ease-out);
    }
    .search-input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring); }
    .plant-filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .plant-chip {
      height: 34px;
      padding: 0 var(--sp-4);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      border: 1.5px solid var(--border-default);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--dur-base) var(--ease-out);
    }
    .plant-chip:hover   { border-color: var(--brand-primary); color: var(--brand-primary); }
    .plant-chip.active  { background: var(--brand-primary); border-color: var(--brand-primary); color: #fff; }
    .result-count {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-left: auto;
      white-space: nowrap;
    }

    /* ---- Two-column layout ---------------------------------- */
    .db-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: var(--sp-6);
      align-items: start;
    }
    @media (max-width: 1100px) { .db-layout { grid-template-columns: 1fr; } }

    /* ---- Disease card grid ---------------------------------- */
    .disease-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--sp-4);
    }
    .disease-card {
      background: var(--surface-1);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      cursor: pointer;
      transition: border-color var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out),
                  transform var(--dur-base) var(--ease-out);
    }
    .disease-card:hover {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-glow-lg);
      transform: translateY(-1px);
    }
    .disease-card.selected {
      border-color: var(--brand-primary);
      background: rgba(46,204,113,0.04);
    }
    .dc-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      margin-bottom: var(--sp-3);
    }
    .dc-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .dc-sci {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: var(--sp-3);
    }
    .dc-plants {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .plant-tag {
      font-size: 10px;
      font-weight: var(--weight-semibold);
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: rgba(46,204,113,0.10);
      color: var(--brand-primary);
      border: 1px solid rgba(46,204,113,0.2);
    }

    /* ---- Detail panel -------------------------------------- */
    .detail-panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: calc(var(--header-height) + var(--sp-6));
      max-height: calc(100vh - var(--header-height) - var(--sp-12));
      overflow-y: auto;
    }
    .detail-hdr {
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .detail-hdr-name {
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      margin: 0 0 2px;
    }
    .detail-hdr-sci {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-style: italic;
    }
    .detail-body { padding: var(--sp-5) var(--sp-6); }
    .detail-section { margin-bottom: var(--sp-5); }
    .detail-section-title {
      font-size: 11px;
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin: 0 0 var(--sp-2);
    }
    .detail-section ul {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: var(--sp-2);
    }
    .detail-section ul li {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      display: flex; align-items: flex-start; gap: var(--sp-2);
      line-height: 1.5;
    }
    .detail-section ul li::before { content: '•'; color: var(--brand-primary); flex-shrink: 0; margin-top: 2px; }
    .alias-list {
      display: flex; flex-wrap: wrap; gap: var(--sp-2);
    }
    .alias-tag {
      font-size: var(--text-xs);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-muted);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    .detail-description {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.65;
      margin: 0;
    }

    /* ---- Empty / loading state ----------------------------- */
    .panel-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-16) var(--sp-6);
      text-align: center;
      color: var(--text-muted);
      gap: var(--sp-3);
    }
    .panel-placeholder svg { opacity: .2; }
    .panel-placeholder p { font-size: var(--text-sm); margin: 0; }

    .disease-card { font: inherit; color: inherit; text-align: left; width: 100%; }
    .detail-note { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--sp-4); }
    .empty-grid {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--sp-16);
      color: var(--text-muted);
      font-size: var(--text-sm);
    }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <!-- Banner -->
      <div style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 60%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-8);position:relative;overflow:hidden;">
        <div style="position:absolute;width:280px;height:280px;background:rgba(255,255,255,.05);border-radius:50%;right:-50px;top:-80px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="font-size:var(--text-xs);color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--sp-2);" data-i18n="diseases.banner_kicker"></div>
          <div style="font-size:var(--text-2xl);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--sp-2);" data-i18n="diseases.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.7);" data-i18n="diseases.banner_text"></div>
        </div>
      </div>

      <!-- Search + filter bar -->
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search" class="search-input" id="searchInput"
                 data-i18n-placeholder="diseases.search_placeholder" data-i18n-aria-label="diseases.search_label" />
        </div>
        <div class="plant-filters" id="plantFilters">
          <button type="button" class="plant-chip active" data-plant="" data-i18n="diseases.all_crops"></button>
          <button type="button" class="plant-chip" data-plant="maize" data-i18n="model.plants.Corn"></button>
          <button type="button" class="plant-chip" data-plant="tomato" data-i18n="model.plants.Tomato"></button>
          <button type="button" class="plant-chip" data-plant="cassava" data-i18n="model.plants.Cassava"></button>
        </div>
        <div class="plant-filters" id="categoryFilters">
          <button type="button" class="plant-chip active" data-category="" data-i18n="diseases.all_types"></button>
          <button type="button" class="plant-chip" data-category="disease" data-i18n="diseases.diseases"></button>
          <button type="button" class="plant-chip" data-category="pest" data-i18n="diseases.pests"></button>
        </div>
        <span class="result-count" id="resultCount" aria-live="polite"></span>
      </div>

      <!-- Two-column layout -->
      <div class="db-layout">

        <!-- Left: disease grid -->
        <div>
          <div class="disease-grid" id="diseaseGrid">
            <div class="empty-grid" data-i18n="diseases.loading"></div>
          </div>
        </div>

        <!-- Right: detail panel -->
        <div class="detail-panel" id="detailPanel">
          <div class="panel-placeholder">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <p data-i18n="diseases.select"></p>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'diseases', titleKey: 'nav.diseases', subtitleKey: 'diseases.subtitle' });

/* ---- State ------------------------------------------------ */
let _diseases    = null;   // null = loading/error, [] = none
let _loadError   = false;
let _activePlant = '';
let _activeCat   = '';
let _selectedId  = null;
let _requestSeq  = 0;

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('searchInput').addEventListener('input', debounce(loadDiseases, 250));
  document.querySelectorAll('#plantFilters .plant-chip').forEach(btn => btn.addEventListener('click', () => {
    _activePlant = btn.dataset.plant;
    setActiveChip('#plantFilters', btn);
    loadDiseases();
  }));
  document.querySelectorAll('#categoryFilters .plant-chip').forEach(btn => btn.addEventListener('click', () => {
    _activeCat = btn.dataset.category;
    setActiveChip('#categoryFilters', btn);
    loadDiseases();
  }));
  const wanted = new URLSearchParams(window.location.search).get('id');
  if (wanted) _selectedId = wanted;
  loadDiseases();
});

// Entries come from the server in the current language: fetch again
window.addEventListener('languageChanged', loadDiseases);

function setActiveChip(group, btn) {
  document.querySelectorAll(`${group} .plant-chip`).forEach(b => {
    b.classList.toggle('active', b === btn);
    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
  });
}

/* ---- Icons by entry id ------------------------------------ */
const ICONS = {
  healthy: {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg>`,
    bg: 'rgba(46,204,113,0.12)', color: '#16a34a'
  },
  mildiou: {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
    bg: 'rgba(139,92,246,0.12)', color: '#7c3aed'
  },
  "powdery-mildew": {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>`,
    bg: 'rgba(156,163,175,0.12)', color: '#6b7280'
  },
  "rust-disease": {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
    bg: 'rgba(249,115,22,0.12)', color: '#ea580c'
  },
  anthracnose: {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>`,
    bg: 'rgba(239,68,68,0.12)', color: '#dc2626'
  },
  _default: {
    svg: `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`,
    bg: 'rgba(239,68,68,0.10)', color: '#dc2626'
  },
};

function getIcon(id) {
  return ICONS[id] || ICONS._default;
}

/* ---- Load (server-side bilingual search) ------------------ */
async function loadDiseases() {
  const seq = ++_requestSeq;
  const q = document.getElementById('searchInput').value.trim();
  const { data, error } = await API.diseases.list({ q, plant: _activePlant, category: _activeCat });
  if (seq !== _requestSeq) return;   // a newer search is on its way
  _loadError = !!error || !Array.isArray(data);
  _diseases = _loadError ? null : data.filter(d => d.category !== 'healthy');
  renderGrid();
  if (_selectedId) {
    const d = (_diseases || []).find(x => x.id === _selectedId || (x.aliases || []).includes(_selectedId));
    if (d) renderDetail(d);
  }
}

/* ---- Render cards ----------------------------------------- */
function renderGrid() {
  const grid  = document.getElementById('diseaseGrid');
  const count = document.getElementById('resultCount');
  if (_loadError) {
    count.textContent = '';
    grid.innerHTML = `<div class="empty-grid">${escapeHtml(I18n.t('diseases.error'))}</div>`;
    return;
  }
  count.textContent = I18n.t('diseases.count', { count: _diseases.length });
  if (!_diseases.length) {
    grid.innerHTML = `<div class="empty-grid">${escapeHtml(I18n.t('diseases.no_match'))}</div>`;
    return;
  }
  grid.innerHTML = _diseases.map(d => {
    const icon = getIcon(d.id);
    const sel  = d.id === _selectedId ? ' selected' : '';
    const plants = (d.affectedPlants || []).slice(0, 3)
      .map(p => `<span class="plant-tag">${escapeHtml(p)}</span>`).join('');
    return `
      <button type="button" class="disease-card${sel}" data-id="${escapeHtml(d.id)}">
        <div class="dc-icon" style="background:${icon.bg};color:${icon.color}">${icon.svg}</div>
        <div class="dc-name">${escapeHtml(d.name)}</div>
        <div class="dc-sci">${escapeHtml(d.scientificName || I18n.t(`diseases.category.${d.category}`))}</div>
        <div class="dc-plants">${plants}</div>
      </button>`;
  }).join('');
  grid.querySelectorAll('.disease-card').forEach(card =>
    card.addEventListener('click', () => selectDisease(card.dataset.id)));
}

/* ---- Detail ----------------------------------------------- */
function selectDisease(id) {
  _selectedId = id;
  const disease = (_diseases || []).find(d => d.id === id);
  if (!disease) return;
  document.querySelectorAll('.disease-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
  renderDetail(disease);
  if (window.innerWidth <= 900) document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth' });
}

function _list(items) {
  return `<ul>${items.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>`;
}

function _section(titleKey, html) {
  return `<div class="detail-section"><div class="detail-section-title">${escapeHtml(I18n.t(titleKey))}</div>${html}</div>`;
}

function renderDetail(d) {
  const icon = getIcon(d.id);
  // Aliases shown to people: names only (not model codes or former ids)
  const aliases = (d.aliases || []).filter(a => !/[_]/.test(a) && !/^[a-z0-9-]+$/.test(a));
  const tags = (items, cls) => `<div class="alias-list">${items.map(x =>
    `<span class="${cls}">${escapeHtml(x)}</span>`).join('')}</div>`;

  document.getElementById('detailPanel').innerHTML = `
    <div class="detail-hdr">
      <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2);">
        <div style="width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:${icon.bg};color:${icon.color};flex-shrink:0;">${icon.svg}</div>
        <div>
          <div class="detail-hdr-name">${escapeHtml(d.name)}</div>
          <div class="detail-hdr-sci">${escapeHtml(d.scientificName || '')} · ${escapeHtml(I18n.t(`diseases.category.${d.category}`))}</div>
        </div>
      </div>
    </div>
    <div class="detail-body">
      ${d.description ? `<div class="detail-section"><p class="detail-description">${escapeHtml(d.description)}</p></div>` : ''}
      ${(d.affectedPlants || []).length ? _section('diseases.plants', tags(d.affectedPlants, 'plant-tag')) : ''}
      ${(d.symptoms || []).length ? _section('diseases.symptoms', _list(d.symptoms)) : ''}
      ${(d.actions || []).length ? _section('diseases.actions', _list(d.actions)) : ''}
      ${aliases.length ? _section('diseases.aliases', tags(aliases, 'alias-tag')) : ''}
      <p class="detail-note">${escapeHtml(I18n.t('diseases.advice_note'))}</p>
    </div>`;
}
</script>
</body>
</html>
