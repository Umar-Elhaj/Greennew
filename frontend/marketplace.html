<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- i18n: dictionary + language applied before the first paint -->
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <title data-i18n="titles.marketplace">GREEN</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <script>(function(){var t=localStorage.getItem('green_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
  <style>
    /* ---- Category tabs -------------------------------------- */
    .cat-tabs {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
      margin-bottom: var(--sp-6);
    }
    .cat-tab {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      height: 38px;
      padding: 0 var(--sp-4);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      border: 1.5px solid var(--border-default);
      background: var(--surface-1);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--dur-base) var(--ease-out);
    }
    .cat-tab:hover  { border-color: var(--brand-primary); color: var(--brand-primary); }
    .cat-tab.active { background: var(--brand-primary); border-color: var(--brand-primary); color: #fff; }
    .cat-tab .cat-count {
      font-size: 10px;
      font-weight: var(--weight-bold);
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: rgba(0,0,0,0.12);
    }
    .cat-tab.active .cat-count { background: rgba(255,255,255,0.25); }

    /* ---- Page layout --------------------------------------- */
    .mkt-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--sp-6);
      align-items: start;
    }
    @media (max-width: 960px) { .mkt-layout { grid-template-columns: 1fr; } }

    /* ---- Filter sidebar ------------------------------------ */
    .filter-sidebar {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      position: sticky;
      top: calc(var(--header-height) + var(--sp-4));
    }
    .filter-sidebar-title {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin: 0 0 var(--sp-4);
    }
    .filter-group { margin-bottom: var(--sp-5); }
    .filter-group-title {
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-secondary);
      margin-bottom: var(--sp-3);
    }
    .filter-check {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-2);
      cursor: pointer;
    }
    .filter-check input[type=checkbox] { accent-color: var(--brand-primary); width: 14px; height: 14px; }
    .filter-check span { font-size: var(--text-sm); color: var(--text-secondary); }
    .price-range {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .price-range input[type=range] {
      width: 100%;
      accent-color: var(--brand-primary);
    }
    .price-range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ---- Product grid -------------------------------------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--sp-4);
    }

    /* ---- Product card -------------------------------------- */
    .product-card {
      background: var(--surface-1);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out),
                  transform var(--dur-base) var(--ease-out);
      position: relative;
    }
    .product-card:hover {
      border-color: var(--brand-primary);
      box-shadow: 0 4px 20px rgba(46,204,113,0.12);
      transform: translateY(-2px);
    }
    .product-img {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      overflow: hidden;
      background-color: var(--surface-2);
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .product-badge {
      position: absolute;
      top: var(--sp-3);
      left: var(--sp-3);
      font-size: 10px;
      font-weight: var(--weight-bold);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .badge-new       { background: #dcfce7; color: #15803d; }
    .badge-popular   { background: #fef3c7; color: #92400e; }
    .badge-certified { background: #ede9fe; color: #5b21b6; }
    .badge-promo     { background: #fee2e2; color: #991b1b; }

    .product-body { padding: var(--sp-4); }
    .product-name {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .product-supplier {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: var(--sp-2);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .supplier-verified { color: var(--brand-primary); }
    .product-stars {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: #f59e0b;
      margin-bottom: var(--sp-2);
    }
    .product-stars svg {
      display: inline-block;
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      vertical-align: middle;
    }
    .product-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-footer {
      padding: var(--sp-3) var(--sp-4);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
    }
    .product-price {
      font-size: var(--text-sm);
      font-weight: var(--weight-extrabold);
      color: var(--brand-primary);
      white-space: nowrap;
    }
    .product-price .per-unit {
      font-size: 10px;
      font-weight: var(--weight-medium);
      color: var(--text-muted);
    }

    /* Cart button with "coming soon" overlay */
    .btn-cart {
      height: 32px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      background: rgba(46,204,113,0.10);
      color: var(--brand-primary);
      border: 1px solid rgba(46,204,113,0.25);
      cursor: not-allowed;
      white-space: nowrap;
      position: relative;
      transition: background var(--dur-base) var(--ease-out);
    }
    .btn-cart:hover { background: rgba(46,204,113,0.18); }

    /* ---- Coming soon ribbon -------------------------------- */
    .coming-ribbon {
      background: linear-gradient(135deg, rgba(46,204,113,0.08) 0%, rgba(46,204,113,0.02) 100%);
      border: 1px solid rgba(46,204,113,0.15);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-6);
      display: flex;
      align-items: center;
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }
    .coming-ribbon-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-md);
      background: rgba(46,204,113,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .coming-ribbon-text h4 {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
      margin: 0 0 2px;
    }
    .coming-ribbon-text p {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin: 0;
    }

    /* ---- Stats row ----------------------------------------- */
    .mkt-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-4);
      margin-bottom: var(--sp-6);
    }
    @media (max-width: 800px) { .mkt-stats { grid-template-columns: repeat(2, 1fr); } }
    .mkt-stat {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-5);
      text-align: center;
    }
    .mkt-stat-val {
      font-size: var(--text-2xl);
      font-weight: var(--weight-extrabold);
      color: var(--text-primary);
      letter-spacing: -.02em;
    }
    .mkt-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ---- Notify bar ---------------------------------------- */
    .notify-bar {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--sp-6) var(--sp-8);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-6);
      margin-top: var(--sp-6);
    }
    .notify-bar-text h3 {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--text-primary);
      margin: 0 0 4px;
    }
    .notify-bar-text p { font-size: var(--text-sm); color: var(--text-muted); margin: 0; }
    .notify-form { display: flex; gap: var(--sp-3); flex-shrink: 0; }
    .notify-input {
      height: 40px;
      padding: 0 var(--sp-4);
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      outline: none;
      width: 220px;
      transition: border-color var(--dur-base) var(--ease-out);
    }
    .notify-input:focus { border-color: var(--input-border-focus); box-shadow: 0 0 0 3px var(--input-ring); }
    @media (max-width: 700px) {
      .notify-bar { flex-direction: column; }
      .notify-form { width: 100%; }
      .notify-input { flex: 1; width: auto; }
    }

    /* ---- Add-to-cart button --------------------------------- */
    .btn-cart {
      display: flex; align-items: center; gap: 5px;
      height: 32px; padding: 0 var(--sp-3);
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      background: var(--brand-primary);
      color: #fff;
      border: none; cursor: pointer;
      white-space: nowrap;
      transition: background var(--dur-base) var(--ease-out),
                  transform var(--dur-fast) var(--ease-out);
      font-family: var(--font-sans);
    }
    .btn-cart:hover { background: var(--brand-dark); }
    .btn-cart:active { transform: scale(.96); }
    .btn-cart.in-cart {
      background: rgba(46,204,113,0.12);
      color: var(--brand-primary);
      border: 1px solid rgba(46,204,113,0.3);
    }
    .btn-cart.in-cart:hover { background: rgba(46,204,113,0.2); }

    /* ---- Qty stepper (in cart panel) ----------------------- */
    .qty-stepper {
      display: flex; align-items: center; gap: var(--sp-2);
    }
    .qty-btn {
      width: 26px; height: 26px; border-radius: var(--radius-sm);
      background: var(--bg-subtle); border: 1px solid var(--border-default);
      color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; font-family: var(--font-sans);
      transition: background var(--dur-base) var(--ease-out);
    }
    .qty-btn:hover { background: var(--border-subtle); }
    .qty-val { font-size: var(--text-sm); font-weight: var(--weight-semibold); min-width: 20px; text-align: center; }

    /* ---- Floating cart button ------------------------------ */
    #cartFab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 500;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--brand-primary);
      color: #fff;
      border: none; cursor: pointer;
      box-shadow: 0 6px 24px rgba(46,204,113,0.45);
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--dur-base) var(--ease-out),
                  box-shadow var(--dur-base) var(--ease-out);
    }
    #cartFab:hover { transform: scale(1.07); box-shadow: 0 8px 32px rgba(46,204,113,0.55); }
    #cartFab .cart-badge {
      position: absolute; top: -4px; right: -4px;
      min-width: 20px; height: 20px; border-radius: var(--radius-full);
      background: #dc2626; color: #fff;
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 2px solid var(--bg-app);
    }

    /* ---- Cart drawer --------------------------------------- */
    .cart-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 800;
      display: none;
      animation: fadeIn .2s var(--ease-out);
    }
    .cart-overlay.open { display: block; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    .cart-drawer {
      position: fixed;
      top: 0; right: -420px;
      width: 420px; max-width: 100vw;
      height: 100%;
      background: var(--surface-1);
      border-left: 1px solid var(--border-subtle);
      z-index: 900;
      display: flex; flex-direction: column;
      transition: right .28s var(--ease-out);
      box-shadow: -8px 0 40px rgba(0,0,0,0.15);
    }
    .cart-drawer.open { right: 0; }

    .cart-drawer-hdr {
      padding: var(--sp-5) var(--sp-6);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-subtle);
      flex-shrink: 0;
    }
    .cart-drawer-title {
      font-size: var(--text-base); font-weight: var(--weight-bold);
      color: var(--text-primary); margin: 0;
    }
    .cart-close-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); display: flex; align-items: center;
      padding: 4px; border-radius: var(--radius-sm);
      transition: color var(--dur-base) var(--ease-out);
    }
    .cart-close-btn:hover { color: var(--text-primary); }

    .cart-body {
      flex: 1; overflow-y: auto; padding: var(--sp-4) var(--sp-6);
    }
    .cart-empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: var(--sp-3);
      color: var(--text-muted); text-align: center;
    }
    .cart-empty svg { opacity: .2; }
    .cart-empty p { font-size: var(--text-sm); margin: 0; }

    .cart-item {
      display: flex; gap: var(--sp-3); align-items: flex-start;
      padding: var(--sp-4) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-icon {
      width: 44px; height: 44px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name {
      font-size: var(--text-sm); font-weight: var(--weight-semibold);
      color: var(--text-primary); margin: 0 0 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item-sub { font-size: 11px; color: var(--text-muted); margin-bottom: var(--sp-2); }
    .cart-item-price {
      font-size: var(--text-sm); font-weight: var(--weight-bold);
      color: var(--brand-primary);
    }

    .cart-footer {
      padding: var(--sp-5) var(--sp-6);
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      flex-shrink: 0;
    }
    .cart-total-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--sp-4);
    }
    .cart-total-label { font-size: var(--text-sm); color: var(--text-secondary); }
    .cart-total-val {
      font-size: var(--text-lg); font-weight: var(--weight-extrabold);
      color: var(--text-primary);
    }
    .checkout-note {
      font-size: 11px; color: var(--text-muted); text-align: center;
      margin-top: var(--sp-3);
    }

    /* ---- Product category icon ----------------------------- */
    .product-img-icon {
      display: flex; align-items: center; justify-content: center;
      opacity: 0.7;
    }
      .mkt-notice { font-size: var(--text-sm); color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border-subtle);
                  border-left: 3px solid var(--color-warning); border-radius: var(--radius-md); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-5); line-height: 1.55; }
    .product-icon { height: 96px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md) var(--radius-md) 0 0; }
    .product-crops { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--sp-2); }
    .product-crops span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg-subtle); color: var(--text-secondary); }
    .product-unit { font-size: var(--text-xs); color: var(--text-muted); }
    .product-desc { -webkit-line-clamp: unset !important; line-clamp: unset !important; display: block !important; overflow: visible !important; }
    .mkt-empty { grid-column: 1 / -1; text-align: center; padding: var(--sp-10); color: var(--text-muted); }
    .mkt-bot { display: inline-flex; margin-top: var(--sp-6); }
  </style>
</head>
<body>
<div class="app-layout" id="appLayout">
  <div class="app-main" id="appMain">
    <main class="app-content" id="appContent">

      <div class="page-banner" style="background:linear-gradient(135deg,var(--brand-darker) 0%,var(--brand-dark) 50%,var(--brand-mid) 100%);border-radius:var(--radius-xl);padding:var(--sp-8) var(--sp-10);margin-bottom:var(--sp-6);position:relative;overflow:hidden;">
        <div style="position:absolute;width:320px;height:320px;background:rgba(255,255,255,.05);border-radius:50%;right:-60px;top:-100px;pointer-events:none;"></div>
        <div style="position:relative;z-index:1;">
          <div style="display:inline-flex;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:var(--radius-full);padding:3px 14px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.06em;text-transform:uppercase;margin-bottom:var(--sp-3);" data-i18n="marketplace.banner_kicker"></div>
          <div style="font-size:var(--text-3xl);font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.15;margin-bottom:var(--sp-3);" data-i18n="marketplace.banner_title"></div>
          <div style="font-size:var(--text-sm);color:rgba(255,255,255,.8);max-width:560px;line-height:1.6;" data-i18n="marketplace.banner_text"></div>
        </div>
      </div>

      <p class="mkt-notice" data-i18n="marketplace.notice"></p>

      <div class="cat-tabs" id="catTabs">
        <button type="button" class="cat-tab active" data-cat="all"><span data-i18n="marketplace.cats.all"></span> <span class="cat-count" id="cnt-all"></span></button>
        <button type="button" class="cat-tab" data-cat="seeds"><span data-i18n="marketplace.cats.seeds"></span> <span class="cat-count" id="cnt-seeds"></span></button>
        <button type="button" class="cat-tab" data-cat="protection"><span data-i18n="marketplace.cats.protection"></span> <span class="cat-count" id="cnt-protection"></span></button>
        <button type="button" class="cat-tab" data-cat="fertilizer"><span data-i18n="marketplace.cats.fertilizer"></span> <span class="cat-count" id="cnt-fertilizer"></span></button>
        <button type="button" class="cat-tab" data-cat="bio"><span data-i18n="marketplace.cats.bio"></span> <span class="cat-count" id="cnt-bio"></span></button>
        <button type="button" class="cat-tab" data-cat="equipment"><span data-i18n="marketplace.cats.equipment"></span> <span class="cat-count" id="cnt-equipment"></span></button>
      </div>

      <div class="mkt-layout">
        <div class="filter-sidebar">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4);">
            <div class="filter-sidebar-title" style="margin:0;" data-i18n="marketplace.filters"></div>
            <button type="button" id="clearFilters" style="font-size:11px;color:var(--brand-primary);background:none;border:none;cursor:pointer;font-family:var(--font-sans);font-weight:600;" data-i18n="marketplace.clear"></button>
          </div>
          <div class="filter-group">
            <div class="filter-group-title" data-i18n="marketplace.crop"></div>
            <label class="filter-check"><input type="checkbox" class="crop-filter" value="Corn" /> <span data-i18n="model.plants.Corn"></span></label>
            <label class="filter-check"><input type="checkbox" class="crop-filter" value="Cassava" /> <span data-i18n="model.plants.Cassava"></span></label>
            <label class="filter-check"><input type="checkbox" class="crop-filter" value="Tomato" /> <span data-i18n="model.plants.Tomato"></span></label>
            <label class="filter-check"><input type="checkbox" class="crop-filter" value="Groundnut" /> <span data-i18n="marketplace.plants.Groundnut"></span></label>
            <label class="filter-check"><input type="checkbox" class="crop-filter" value="Plantain" /> <span data-i18n="marketplace.plants.Plantain"></span></label>
          </div>
          <div class="filter-group">
            <label class="filter-group-title" for="priceRange" data-i18n="marketplace.max_price"></label>
            <div class="price-range">
              <input type="range" id="priceRange" min="0" max="200000" step="5000" value="200000" />
              <div class="price-range-labels"><span id="priceMin"></span><span id="priceMax"></span></div>
            </div>
          </div>
        </div>

        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4);">
            <div style="font-size:var(--text-sm);color:var(--text-muted);" id="productCount" aria-live="polite"></div>
            <label style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--text-sm);color:var(--text-muted);">
              <span data-i18n="marketplace.sort"></span>
              <select id="sortSelect" style="height:36px;padding:0 var(--sp-3);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:var(--text-sm);font-family:var(--font-sans);">
                <option value="name" data-i18n="marketplace.sort_name"></option>
                <option value="price-asc" data-i18n="marketplace.sort_price_asc"></option>
                <option value="price-desc" data-i18n="marketplace.sort_price_desc"></option>
              </select>
            </label>
          </div>
          <div class="product-grid" id="productGrid"></div>
          <a href="/chatbot" class="btn btn-primary mkt-bot" data-i18n="marketplace.ask_bot"></a>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/layout.js"></script>
<script>
Layout.init({ page: 'marketplace', titleKey: 'nav.marketplace', subtitleKey: 'marketplace.subtitle' });

/* Generic input types; names and descriptions in marketplace.products.<id>.
   Prices are indicative (XAF), not offers. */
const PRODUCTS = [
  { id: 'maize_hybrid', cat: 'seeds', price: 12000, crops: ["Corn"] },
  { id: 'cassava_cuttings', cat: 'seeds', price: 8500, crops: ["Cassava"] },
  { id: 'tomato_seed', cat: 'seeds', price: 15000, crops: ["Tomato"] },
  { id: 'groundnut_seed', cat: 'seeds', price: 6500, crops: ["Groundnut"] },
  { id: 'maize_opv', cat: 'seeds', price: 5500, crops: ["Corn"] },
  { id: 'plantain_suckers', cat: 'seeds', price: 3500, crops: ["Plantain"] },
  { id: 'fungicide_systemic', cat: 'protection', price: 18500, crops: ["Tomato", "Cassava"] },
  { id: 'fungicide_triazole', cat: 'protection', price: 14000, crops: ["Corn", "Tomato"] },
  { id: 'insecticide_systemic', cat: 'protection', price: 9500, crops: ["Cassava", "Corn"] },
  { id: 'copper', cat: 'protection', price: 7000, crops: ["Tomato"] },
  { id: 'pyrethroid', cat: 'protection', price: 6500, crops: ["Corn", "Cassava"] },
  { id: 'neem', cat: 'protection', price: 5000, crops: ["Tomato", "Corn", "Cassava"] },
  { id: 'npk', cat: 'fertilizer', price: 38000, crops: ["Corn", "Cassava"] },
  { id: 'urea', cat: 'fertilizer', price: 27000, crops: ["Corn"] },
  { id: 'lime', cat: 'fertilizer', price: 15000, crops: ["Corn", "Tomato", "Cassava"] },
  { id: 'zinc_boron', cat: 'fertilizer', price: 12000, crops: ["Corn"] },
  { id: 'potassium_sulphate', cat: 'fertilizer', price: 42000, crops: ["Tomato"] },
  { id: 'bokashi', cat: 'bio', price: 18000, crops: ["Corn", "Tomato", "Cassava"] },
  { id: 'trichoderma', cat: 'bio', price: 9500, crops: ["Tomato", "Corn"] },
  { id: 'biochar', cat: 'bio', price: 12000, crops: ["Corn", "Cassava"] },
  { id: 'bacillus', cat: 'bio', price: 14000, crops: ["Tomato", "Corn"] },
  { id: 'liquid_organic', cat: 'bio', price: 11000, crops: ["Tomato", "Corn"] },
  { id: 'sprayer', cat: 'equipment', price: 35000, crops: [] },
  { id: 'moisture_sensor', cat: 'equipment', price: 45000, crops: [] },
  { id: 'sheller', cat: 'equipment', price: 22000, crops: ["Corn"] },
  { id: 'soil_kit', cat: 'equipment', price: 28000, crops: [] },
  { id: 'solar_pump', cat: 'equipment', price: 195000, crops: ["Tomato", "Corn"] }
];

const CAT_STYLE = {
  seeds:      { bg: 'rgba(46,204,113,.10)', color: '#16a34a' },
  protection: { bg: 'rgba(59,130,246,.10)', color: '#2563eb' },
  fertilizer: { bg: 'rgba(245,158,11,.12)', color: '#ca8a04' },
  bio:        { bg: 'rgba(46,204,113,.10)', color: '#15803d' },
  equipment:  { bg: 'rgba(124,58,237,.10)', color: '#7c3aed' },
};
const CAT_ICONS = {
  seeds:      `<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 22V12"/><path d="M20 6s-4 0-8 6c-4-6-8-6-8-6s0 6 8 8c8-2 8-8 8-8z"/></svg>`,
  protection: `<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  fertilizer: `<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 3h6l1 9H8L9 3z"/><path d="M8 12a4 4 0 1 0 8 0"/><line x1="12" y1="16" x2="12" y2="21"/></svg>`,
  bio:        `<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M17 8C8 10 5.9 16.17 3.82 19.82A2 2 0 0 0 6 22c5.13 0 9-4.46 9-10V8"/><path d="M12 22s0-8-7-10"/></svg>`,
  equipment:  `<svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M4.93 4.93a10 10 0 0 0 14.14 14.14"/></svg>`,
};

let activeCat = 'all';
const $ = id => document.getElementById(id);
const pText = (p, field) => I18n.t(`marketplace.products.${p.id}.${field}`);
const cropLabel = c => I18n.has(`model.plants.${c}`) ? I18n.t(`model.plants.${c}`) : I18n.t(`marketplace.plants.${c}`);

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.cat-tab').forEach(btn => btn.addEventListener('click', () => {
    activeCat = btn.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(b => {
      b.classList.toggle('active', b === btn);
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    render();
  }));
  document.querySelectorAll('.crop-filter').forEach(cb => cb.addEventListener('change', render));
  $('priceRange').addEventListener('input', render);
  $('sortSelect').addEventListener('change', render);
  $('clearFilters').addEventListener('click', () => {
    document.querySelectorAll('.crop-filter').forEach(cb => { cb.checked = false; });
    $('priceRange').value = $('priceRange').max;
    render();
  });
  render();
});
window.addEventListener('languageChanged', render);

function render() {
  const crops = [...document.querySelectorAll('.crop-filter:checked')].map(cb => cb.value);
  const maxPrice = parseInt($('priceRange').value, 10);
  $('priceMin').textContent = I18n.money(0);
  $('priceMax').textContent = I18n.money(maxPrice);

  const matches = p => p.price <= maxPrice && (!crops.length || p.crops.length === 0 || p.crops.some(c => crops.includes(c)));
  ['all', 'seeds', 'protection', 'fertilizer', 'bio', 'equipment'].forEach(cat => {
    $(`cnt-${cat}`).textContent = I18n.number(PRODUCTS.filter(p => matches(p) && (cat === 'all' || p.cat === cat)).length);
  });

  const sort = $('sortSelect').value;
  const list = PRODUCTS.filter(p => matches(p) && (activeCat === 'all' || p.cat === activeCat))
    .sort((a, b) => sort === 'price-asc' ? a.price - b.price
                  : sort === 'price-desc' ? b.price - a.price
                  : pText(a, 'name').localeCompare(pText(b, 'name'), I18n.locale));

  $('productCount').textContent = I18n.t('marketplace.count', { count: list.length });
  $('productGrid').innerHTML = list.length ? list.map(p => {
    const st = CAT_STYLE[p.cat];
    const crops = p.crops.length ? p.crops.map(c => `<span>${escapeHtml(cropLabel(c))}</span>`).join('')
                                 : `<span>${escapeHtml(I18n.t('marketplace.all_crops'))}</span>`;
    return `
      <article class="product-card">
        <div class="product-icon" style="background:${st.bg};color:${st.color};" aria-hidden="true">${CAT_ICONS[p.cat]}</div>
        <div class="product-body">
          <h3 class="product-name">${escapeHtml(pText(p, 'name'))}</h3>
          <p class="product-desc">${escapeHtml(pText(p, 'desc'))}</p>
          <div class="product-crops">${crops}</div>
          <div class="product-footer">
            <div class="product-price">${escapeHtml(I18n.t('marketplace.price', { price: I18n.money(p.price) }))}
              <div class="product-unit">${escapeHtml(I18n.t('marketplace.per', { unit: pText(p, 'unit') }))}</div>
            </div>
          </div>
        </div>
      </article>`;
  }).join('') : `<div class="mkt-empty">${escapeHtml(I18n.t('marketplace.empty'))}</div>`;
}
</script>
</body>
</html>
